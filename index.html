    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * SK, 0, from, to);
    ctx.strokeStyle = bstyle(cx, cy, r, SK, r0, r1, fade, false, n);
    ctx.lineWidth = step * 1.8;
    ctx.stroke();
  }
}
/**
 * Dibuja el disco con cualquier inclinación y radios; un arco completo (de 0 a 2π) dibuja las dos
 * mitades.
 *
 * @param {number} cx Centro horizontal, en píxeles de pantalla.
 * @param {number} cy Centro vertical, en píxeles de pantalla.
 * @param {number} R Radio del horizonte, en píxeles de pantalla.
 * @param {number} k Aplastamiento vertical del disco (1: visto de frente).
 * @param {number} f0 Radio interior del disco, en radios del horizonte.
 * @param {number} f1 Radio exterior del disco, en radios del horizonte.
 * @param {number} from Ángulo inicial del arco, en radianes.
 * @param {number} to Ángulo final del arco, en radianes.
 * @param {number} alpha Opacidad, de 0 a 1.
 */
function bhDiskK(cx, cy, R, k, f0, f1, from, to, alpha) {
  if (from === 0 && to > 6) {
    if (BHGL.draw(0, cx, cy, R, k, f0, f1, alpha)) {
      BHGL.draw(1, cx, cy, R, k, f0, f1, alpha);
      return;
    }
  } else if (BHGL.draw(from > 1 ? 0 : 1, cx, cy, R, k, f0, f1, alpha)) {
    return;
  }
  const r0 = R * f0,
    r1 = R * f1,
    step = Math.max(1.6, R * 0.035);
  for (let r = r1; r >= r0; r -= step) {
    const fade = Math.min(1, (r1 - r) / (R * 0.35) + 0.15) * alpha;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * k, 0, from, to);
    ctx.strokeStyle = bstyle(cx, cy, r, k, r0, r1, fade, false);
    ctx.lineWidth = step * 1.3;
    ctx.stroke();
  }
}

// Agujero negro en alta calidad: el mismo diseño (mismos colores, misma forma, mismo giro),
// dibujado píxel a píxel en la GPU en un canvas aparte y copiado al lienzo principal.
const BHGL = (() => {
  let cv = null,
    gl = null,
    pr = null,
    U = {},
    ok = null;
  const FS = `precision highp float;
  uniform vec2 uSize; uniform float uR, uK, uR0, uR1, uT, uAlpha, uPart, uScale;
  vec3 bcol(float b){ b = clamp(b, 0., 1.);
    vec3 c0 = vec3(50.,10.,4.)/255., c1 = vec3(150.,38.,8.)/255., c2 = vec3(255.,100.,28.)/255., c3 = vec3(255.,196.,96.)/255., c4 = vec3(255.,246.,222.)/255.;
    if (b < .35) return mix(c0, c1, b/.35); if (b < .6) return mix(c1, c2, (b - .35)/.25); if (b < .82) return mix(c2, c3, (b - .6)/.22); return mix(c3, c4, (b - .82)/.18); }
  float bbright(float th, float r, float r0, float r1){ float rad = 1. - (r - r0)/(r1 - r0), dop = .5 - .5*cos(th), s = .89 + .11*sin(th*5. + r/uR*7. - uT*2.4*pow(r0/r, 1.5));   // el dibujo del disco escala con su tamaño: no se vuelve un disco de vinilo al crecer
    return (.25 + .75*pow(max(rad, 0.), .8))*(.4 + .6*dop)*s; }
  void main(){
    vec2 p = (gl_FragCoord.xy - .5*uSize); p.y = -p.y;           // y hacia abajo, como el lienzo 2D
    vec4 o = vec4(0.);
    if (uPart < 1.5){                                             // disco: 0 = mitad de atrás (arriba), 1 = mitad de delante (abajo)
      float hm = uPart < .5 ? 1. - smoothstep(-.5, .5, p.y) : smoothstep(-1.5, -.5, p.y);   // mitades complementarias: sin costura
      float r = length(vec2(p.x, p.y/uK)), th = atan(p.y/uK, p.x);
      float r0 = uR*uR0, r1 = uR*uR1;
      if (r >= r0 - 1. && r <= r1 + 1.){
        float fade = min(1., (r1 - r)/(uR*.35) + .15)*uAlpha;
        float a = 1. - pow(1. - clamp(fade, 0., 1.), 2.2);
        a *= smoothstep(r0 - 1., r0 + 1., r)*smoothstep(r1 + 1., r1 - 1., r)*hm;
        vec3 c = bcol(bbright(th, r, r0, r1)); c = clamp(mix(vec3(dot(c, vec3(.299,.587,.114))), c, 1.12), 0., 1.);
        o = vec4(c*a, a);
      }
    } else {                                                      // la luz curvada alrededor de la esfera
      float rho = length(p), ph = atan(p.y, p.x), up = .5 - .5*sin(ph);
      float q = (rho/uR - 1.03)/(.08 + .16*up);
      if (q >= -.05 && q <= 1.05){
        float rd = uR*1.35 + clamp(q, 0., 1.)*uR*(2.05 - 1.35);
        float a = uAlpha*(1. - clamp(q, 0., 1.)*.6)*(.45 + .45*up);
        a = 1. - pow(1. - clamp(a, 0., 1.), .75/(.08 + .16*up));   // tantas capas como el dibujo original
        a *= smoothstep(-.05, .02, q)*smoothstep(1.05, .97, q);
        vec3 c = bcol(bbright(ph, rd, uR*1.35, uR*2.05)); c = clamp(mix(vec3(dot(c, vec3(.299,.587,.114))), c, 1.12), 0., 1.);
        o = vec4(c*a, a);
      }
    }
    gl_FragColor = o;
  }`;
  function init() {
    if (ok !== null) {
      return ok;
    }
    try {
      cv = document.createElement('canvas');
      gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
      if (!gl) {
        ok = false;
        return ok;
      }
      const sh = (t, src) => {
        const o = gl.createShader(t);
        gl.shaderSource(o, src);
        gl.compileShader(o);
        if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(o));
        }
        return o;
      };
      pr = gl.createProgram();
      gl.attachShader(
        pr,
        sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'),
      );
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
        throw new Error('link');
      }
      gl.useProgram(pr);
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW,
      );
      const l = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(l);
      gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
      ['uSize', 'uR', 'uK', 'uR0', 'uR1', 'uT', 'uAlpha', 'uPart', 'uScale'].forEach(
        n => (U[n] = gl.getUniformLocation(pr, n)),
      );
      ok = true;
    } catch (e) {
      ok = false;
      try {
        console.warn('BHGL', e && e.message);
      } catch (_) {}
    }
    return ok;
  }
  /**
   * Dibuja una parte del agujero negro centrada en (cx, cy) del lienzo principal, a la resolución
   * real de la pantalla.
   *
   * @param {number} part 0: mitad de atrás del disco; 1: mitad de delante; 2: anillo de luz.
   * @param {number} cx Centro horizontal, en píxeles de pantalla.
   * @param {number} cy Centro vertical, en píxeles de pantalla.
   * @param {number} R Radio del horizonte, en píxeles de pantalla.
   * @param {number} k Aplastamiento vertical del disco (1: visto de frente).
   * @param {number} f0 Radio interior del disco, en radios del horizonte.
   * @param {number} f1 Radio exterior del disco, en radios del horizonte.
   * @param {number} alpha Opacidad, de 0 a 1.
   * @returns {boolean} Falso si no hay WebGL (quien llama dibuja el respaldo 2D).
   */
  function draw(part, cx, cy, R, k, f0, f1, alpha) {
    if (!init() || !(R > 2)) {
      return false;
    }
    let sc = 1;
    try {
      const m = ctx.getTransform && ctx.getTransform();
      sc = m ? Math.hypot(m.a, m.b) : window.devicePixelRatio || 1;
    } catch (e) {}
    const ext = part === 2 ? R * 1.3 : R * f1 + 2,
      w = Math.min(4096, Math.ceil(ext * 2 * sc) + 4),
      h = part === 2 ? w : Math.min(4096, Math.ceil((R * f1 * k + 2) * 2 * sc) + 4);
    if (cv.width !== w || cv.height !== h) {
      cv.width = w;
      cv.height = h;
    }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.uSize, w, h);
    gl.uniform1f(U.uR, R * sc);
    gl.uniform1f(U.uK, k);
    gl.uniform1f(U.uR0, f0);
    gl.uniform1f(U.uR1, f1);
    gl.uniform1f(U.uT, t);
    gl.uniform1f(U.uAlpha, alpha);
    gl.uniform1f(U.uPart, part);
    gl.uniform1f(U.uScale, sc);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = 1;
    ctx.drawImage(cv, cx - w / sc / 2, cy - h / sc / 2, w / sc, h / sc);
    ctx.globalAlpha = ga;
    return true;
  }
  return { draw };
})();

/**
 * Dibuja el agujero negro de la marca visto casi desde arriba (como en el juego).
 *
 * @param {number} cx Centro horizontal, en píxeles de pantalla.
 * @param {number} cy Centro vertical, en píxeles de pantalla.
 * @param {number} R Radio del horizonte, en píxeles de pantalla.
 * @param {number} alpha Opacidad, de 0 a 1.
 * @param {number} flare Destello del borde, de 0 a 1.
 */
function brandHole(cx, cy, R, alpha, flare) {
  bhDiskK(cx, cy, R, 0.96, 1.06, 1.6, 0, Math.PI * 2, alpha);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = bcol(0.95, 0.9);
  ctx.lineWidth = Math.max(1.2, R * 0.03) + flare * 5;
  ctx.shadowColor = '#ff5a1f';
  ctx.shadowBlur = 10 + flare * 36;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.015, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}
// ---- El logotipo: la Ó es el agujero negro a 37° y su acento es la Tierra ----
// Proporciones del logotipo, en tamaños de letra (r) y en radios del agujero (disk, txt).
const LOGO = { r: 0.42, disk: 1.8, txt: 1.55, track: 0.2, weight: 400 };
/**
 * Dibuja el acento de la Ó: la Tierra escapando, con una estela inclinada como un acento agudo.
 *
 * @param {number} cx Centro horizontal de la Ó, en píxeles de pantalla.
 * @param {number} cy Centro vertical de la Ó, en píxeles de pantalla.
 * @param {number} R Radio del agujero de la Ó, en píxeles de pantalla.
 * @param {number} p Avance del vuelo de la Tierra, de 0 (en el agujero) a 1 (en su lugar).
 */
function drawAccent(cx, cy, R, p) {
  const dx = 0.574,
    dy = -0.819,
    ex = cx + R * 0.55 - dx * (1 - p) * R * 3,
    ey = cy - R * 1.62 - dy * (1 - p) * R * 3;
  const re = Math.max(3, R * 0.19),
    L = R * (0.55 + 0.25 * p),
    tx = ex - dx * L,
    ty = ey - dy * L,
    px = -dy * re * 0.85,
    py = dx * re * 0.85;
  const g = ctx.createLinearGradient(tx, ty, ex, ey);
  if (g && g.addColorStop) {
    g.addColorStop(0, 'rgba(143,208,255,0)');
    g.addColorStop(1, 'rgba(143,208,255,.75)');
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = 'rgba(143,208,255,.5)';
  }
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(ex + px, ey + py);
  ctx.lineTo(ex - px, ey - py);
  ctx.closePath();
  ctx.fill();
  splashEarth(ex, ey, re);
}
/**
 * Dibuja el logotipo ÓRBITA centrado, con su animación de entrada.
 *
 * @param {number} midX Centro horizontal del logotipo, en píxeles de pantalla.
 * @param {number} cy Línea central vertical, en píxeles de pantalla.
 * @param {number} fs Tamaño de letra, en píxeles de pantalla.
 * @param {number} [p] Tiempo de la animación, en segundos (sin él, el logotipo completo).
 */
function drawLogo(midX, cy, fs, p) {
  if (p === undefined) {
    p = 99;
  }
  ctx.save();
  const pO = easeIO2(clamp(p / 1.0, 0, 1)),
    Rf0 = fs * LOGO.r,
    word = 'RBITA',
    ls = fs * LOGO.track;
  ctx.font =
    LOGO.weight + ' ' + fs + 'px ' + (splashFont ? 'Unbounded' : 'system-ui') + ', sans-serif';
  const mw = s => {
    const m = ctx.measureText(s);
    return (m && m.width) || s.length * fs * 0.75;
  };
  const tw = mw(word) + ls * (word.length - 1),
    cx = midX - (Rf0 * LOGO.disk + Rf0 * LOGO.txt + tw) / 2 + Rf0 * LOGO.disk;
  const Rf = Rf0 * (0.55 + 0.45 * pO);
  ctx.globalAlpha = pO;
  const g = ctx.createRadialGradient(cx, cy, Rf, cx, cy, Rf * 4);
  g.addColorStop(0, 'rgba(255,100,28,.16)');
  g.addColorStop(1, 'rgba(255,100,28,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, Rf * 4, 0, Math.PI * 2);
  ctx.fill();
  bhDisk(cx, cy, Rf, Math.PI - 0.03, Math.PI * 2 + 0.03, pO, LOGO.disk);
  bhCore(cx, cy, Rf, pO);
  bhDisk(cx, cy, Rf, 0, Math.PI, pO, LOGO.disk);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = BONE;
  // letras una por una, subiendo suavemente (como en la presentación)
  for (let i = 0; i < word.length; i++) {
    const la = clamp((p - (0.7 + i * 0.16)) / 0.5, 0, 1);
    if (la <= 0) {
      continue;
    }
    ctx.globalAlpha = easeIO2(la);
    ctx.fillText(
      word[i],
      cx + Rf0 * LOGO.txt + mw(word.slice(0, i)) + ls * i,
      cy + fs * 0.36 + (1 - easeIO2(la)) * 8,
    );
  }
  ctx.globalAlpha = 1;
  // la Tierra sale disparada del agujero negro y se queda como el acento
  if (p > 1.6) {
    drawAccent(cx, cy, Rf, 1 - Math.pow(1 - clamp((p - 1.6) / 0.55, 0, 1), 3));
  }
  ctx.restore();
}
/**
 * Dibuja el horizonte negro y el anillo de luz curvada a su alrededor; va entre las dos mitades
 * del disco.
 *
 * @param {number} cx Centro horizontal, en píxeles de pantalla.
 * @param {number} cy Centro vertical, en píxeles de pantalla.
 * @param {number} R Radio del horizonte, en píxeles de pantalla.
 * @param {number} alpha Opacidad del anillo, de 0 a 1.
 */
function bhCore(cx, cy, R, alpha) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fill();
  // la luz curvada alrededor de la esfera: un solo anillo continuo, más grueso arriba y más fino
  // abajo
  const dq = R > 30 ? 0.04 : 0.1,
    N = 120,
    ns = R > 30 ? 48 : 28;
  if (BHGL.draw(2, cx, cy, R, 1, 1, 1, alpha)) {
    /* Con WebGL el anillo ya está dibujado. */
  } else {
    for (let q = 0; q <= 1.0001; q += dq) {
      const rd = R * BR0 + q * R * (BR1 - BR0),
        g = ctx.createConicGradient ? ctx.createConicGradient(0, cx, cy) : null;
      if (g) {
        for (let i = 0; i <= ns; i++) {
          const ph = (i / ns) * Math.PI * 2,
            up = 0.5 - 0.5 * Math.sin(ph);
          g.addColorStop(
            i / ns,
            bcol(bbright(ph, rd, R * BR0, R * BR1), alpha * (1 - q * 0.6) * (0.45 + 0.45 * up)),
          );
        }
      }
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const ph = (i / N) * Math.PI * 2,
          up = 0.5 - 0.5 * Math.sin(ph),
          rr2 = R * (1.03 + (0.08 + 0.16 * up) * q);
        const px = cx + Math.cos(ph) * rr2,
          py = cy + Math.sin(ph) * rr2;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = g || bcol(0.6, alpha * 0.45 * (1 - q * 0.6));
      ctx.lineWidth = Math.max(1.8, R * 0.03);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = bcol(0.95, 0.85);
  ctx.lineWidth = Math.max(1.2, R * 0.022) + sfl * 5;
  ctx.shadowColor = '#ff5a1f';
  ctx.shadowBlur = sfl * 40;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.015, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}
/**
 * Dibuja la Tierra pequeña del acento: océano, un continente y su lado de noche.
 *
 * @param {number} ex Centro horizontal, en píxeles de pantalla.
 * @param {number} ey Centro vertical, en píxeles de pantalla.
 * @param {number} r Radio, en píxeles de pantalla.
 */
function splashEarth(ex, ey, r) {
  ctx.fillStyle = '#3d8bff';
  ctx.beginPath();
  ctx.arc(ex, ey, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(ex, ey, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = '#5ccf6b';
  ctx.beginPath();
  ctx.ellipse(ex - r * 0.25, ey - r * 0.15, r * 0.45, r * 0.3, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(10,14,30,.55)';
  ctx.beginPath();
  ctx.arc(ex + r * 0.5, ey - r * 0.5, r * 1.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
/**
 * Programa todo el sonido de la presentación de una vez: un rumor que crece, las letras como
 * notas, la Tierra que cae y un golpe final. Va por `splashBus` para poder apagarlo al saltarla.
 */
function splashSounds() {
  if (!AC) {
    return;
  }
  try {
    const n = AC.currentTime + 0.05;
    splashBus = AC.createGain();
    splashBus.gain.value = 0.9;
    splashBus.connect(master);
    const osc = (type, f0, f1, t0, dur, peak, att) => {
      const o = AC.createOscillator(),
        g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0);
      if (f1) {
        o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      }
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + att);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(splashBus);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
      return o;
    };
    osc('sine', 38, 58, n, 6, 0.35, 2.5); // rumor grave
    // Barrido de ruido que sube.
    const src = AC.createBufferSource();
    src.buffer = NOISE;
    const f = AC.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 1.1;
    f.frequency.setValueAtTime(200, n + 3);
    f.frequency.exponentialRampToValueAtTime(6000, n + 5.5);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n + 3);
    g.gain.exponentialRampToValueAtTime(0.28, n + 5.45);
    g.gain.exponentialRampToValueAtTime(0.0001, n + 5.6);
    src.connect(f);
    f.connect(g);
    g.connect(splashBus);
    src.start(n + 3);
    src.stop(n + 5.7);
    // Una nota por letra (escala pentatónica menor).
    [0, 3, 5, 7, 10].forEach((s, i) =>
      osc('triangle', ROOT * Math.pow(2, s / 12), 0, n + 4 + i * 0.22, 0.7, 0.12, 0.005),
    );
    // la Tierra cae en el acento
    osc('sine', ROOT * 2 * Math.pow(2, 7 / 12), 0, n + 5.3, 1.4, 0.1, 0.004);
    osc('sine', 72, 38, n + 5.5, 1.6, 0.9, 0.005); // golpe
    noiseHit(n + 5.5, 1.6, 'highpass', 3000, 0.35, splashBus);
    // Acorde final: cada nota con dos osciladores desafinados para que suene ancho.
    for (const s of [0, 3, 7, 12]) {
      for (const det of [-7, 7]) {
        const o = AC.createOscillator(),
          gg = AC.createGain(),
          lp = AC.createBiquadFilter();
        o.type = 'sawtooth';
        o.frequency.value = (ROOT / 2) * Math.pow(2, s / 12);
        o.detune.value = det;
        lp.type = 'lowpass';
        lp.frequency.value = 1300;
        gg.gain.setValueAtTime(0.0001, n + 5.5);
        gg.gain.exponentialRampToValueAtTime(0.035, n + 5.6);
        gg.gain.exponentialRampToValueAtTime(0.0001, n + 9.5);
        o.connect(lp);
        lp.connect(gg);
        gg.connect(splashBus);
        o.start(n + 5.5);
        o.stop(n + 9.6);
      }
    }
    // Campanas.
    osc('sine', ROOT * 4, 0, n + 5.55, 2.8, 0.07, 0.005);
    osc('sine', ROOT * 4 * Math.pow(2, 7 / 12), 0, n + 5.6, 2.6, 0.05, 0.005);
  } catch (e) {}
}
/** Empieza la presentación: oculta el panel y el HUD y lanza su sonido. */
function startSplash() {
  state = 'splash';
  splashT = 0;
  sflared = false;
  sfl = 0;
  elPanel.classList.add('hide');
  elHud.style.opacity = 0;
  splashSounds();
}
/** Salta la presentación: apaga su sonido en 0,25 s y pasa a lo que sigue. */
function skipSplash() {
  if (splashBus && AC) {
    try {
      const n = AC.currentTime;
      splashBus.gain.cancelScheduledValues(n);
      splashBus.gain.setValueAtTime(splashBus.gain.value, n);
      splashBus.gain.exponentialRampToValueAtTime(0.0001, n + 0.25);
    } catch (e) {}
  }
  afterSplash();
}
/**
 * Avanza la presentación: destello cuando la Tierra cae en el acento (a 5,5 s) y fin a los 10 s.
 *
 * @param {number} dt Tiempo del cuadro, en segundos.
 */
function updateSplash(dt) {
  t += dt;
  if (state === 'splash') {
    splashT += dt;
  }
  flash = Math.max(0, flash - dt * 2);
  sfl = Math.max(0, sfl - dt * 1.3);
  if (state === 'splash' && !sflared && splashT >= 5.5) {
    sflared = true;
    flash = 0.35;
    sfl = 1;
    buzz([30, 40, 80]);
  }
  if (state === 'splash' && splashT >= SPLASH_END) {
    afterSplash();
  }
}
/**
 * Dibuja un cuadro de la presentación: el agujero negro grande viaja a su lugar en el logotipo y
 * se encoge hasta la Ó, salen las letras y la Tierra, y al final todo se funde a negro.
 */
function renderSplash() {
  const T = splashT;
  ctx.save();
  ctx.fillStyle = '#05060c';
  ctx.fillRect(0, 0, W, H);
  const sr = Math.max(W, H) * 0.62;
  for (const s of stars) {
    const x = CX + Math.cos(s.a + t * 0.004) * s.r * sr,
      y = CY + Math.sin(s.a + t * 0.004) * s.r * sr;
    ctx.globalAlpha = 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 1.3 + s.tw));
    ctx.fillStyle = BONE;
    ctx.fillRect(x, y, s.s * 0.8, s.s * 0.8);
  }
  ctx.globalAlpha = 1;
  const fs = Math.min(54, W * 0.11),
    Rf = fs * LOGO.r,
    word = 'RBITA',
    ls = fs * LOGO.track;
  ctx.font =
    LOGO.weight + ' ' + fs + 'px ' + (splashFont ? 'Unbounded' : 'system-ui') + ', sans-serif';
  const mw = s => {
    const m = ctx.measureText(s);
    return (m && m.width) || s.length * fs * 0.8;
  };
  const tw = mw(word) + ls * (word.length - 1),
    total = Rf * LOGO.disk + Rf * LOGO.txt + tw,
    fx = (W - total) / 2 + Rf * LOGO.disk,
    fy = H * 0.45;
  const Rs = Math.min(W, H) * 0.17,
    u = easeIO2(clamp((T - 3.3) / 2.2, 0, 1));
  const R =
    Rs * (0.94 + 0.06 * clamp(T / 3.3, 0, 1)) +
    (Rf - Rs * (0.94 + 0.06 * clamp(T / 3.3, 0, 1))) * u;
  const cx = W / 2 + (fx - W / 2) * u,
    cy = fy,
    a = 1,
    dim = state === 'pretitle' ? 0.5 : 0.5 * (1 - clamp(T / 1.2, 0, 1));
  const g = ctx.createRadialGradient(cx, cy, R, cx, cy, R * 4.5);
  g.addColorStop(0, 'rgba(255,100,28,' + 0.2 * a + ')');
  g.addColorStop(1, 'rgba(255,100,28,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const df = BR1 + (LOGO.disk - BR1) * u; // el disco se acorta al convertirse en la O
  bhDisk(cx, cy, R, Math.PI - 0.03, Math.PI * 2 + 0.03, a, df);
  bhCore(cx, cy, R, a);
  bhDisk(cx, cy, R, 0, Math.PI, a, df);
  if (dim > 0) {
    ctx.globalAlpha = dim;
    ctx.fillStyle = '#05060c';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  // letras una por una, por delante del disco (el disco pasa por detrás de la R)
  const tx = cx + R * LOGO.txt,
    base = cy + fs * 0.36;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  for (let i = 0; i < word.length; i++) {
    const la = clamp((T - (4 + i * 0.22)) / 0.32, 0, 1);
    if (la <= 0) {
      continue;
    }
    const lx = tx + mw(word.slice(0, i)) + ls * i,
      ly = base + (1 - easeIO2(la)) * 14;
    ctx.globalAlpha = la;
    ctx.fillStyle = BONE;
    ctx.fillText(word[i], lx, ly);
  }
  ctx.globalAlpha = 1;
  // la Tierra sale disparada del agujero negro y se convierte en el acento
  if (T > 4.95) {
    const p = clamp((T - 4.95) / 0.45, 0, 1);
    drawAccent(cx, cy, R, 1 - Math.pow(1 - p, 3));
  }
  if (state === 'splash' && T > 0.8 && T < 9) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = BONE;
    ctx.font = '300 12px Unbounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Toca para saltar', CX, H - 34);
    ctx.globalAlpha = 1;
  }
  if (T > 9.2) {
    ctx.globalAlpha = clamp((T - 9.2) / 0.8, 0, 1);
    ctx.fillStyle = '#05060c';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.4;
    ctx.fillStyle = '#fffaf0';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

  const sigs = elLv.querySelectorAll('.sig');
  if (!sigs.length) {
    return;
  }
  sigShown = i;
  if (sigTimer) {
    clearTimeout(sigTimer);
  }
  sigs.forEach((g, k) => {
    if (k !== i) {
      g.classList.remove('rx', 'done');
      const on = g.querySelector('.on'),
        off = g.querySelector('.off');
      on.textContent = '';
      off.textContent = g.dataset.txt;
    }
  });
  const g = sigs[i];
  if (!g) {
    return;
  }
  const txt = g.dataset.txt,
    on = g.querySelector('.on'),
    off = g.querySelector('.off');
  g.classList.remove('done');
  g.classList.remove('rx');
  void g.offsetWidth;
  g.classList.add('rx');
  let n = 0;
  on.textContent = '';
  off.textContent = txt;
  const step = () => {
    if (sigShown !== i) {
      return;
    }
    n++;
    on.textContent = txt.slice(0, n);
    off.textContent = txt.slice(n);
    if (n >= txt.length) {
      g.classList.add('done');
      return;
    }
    const c = txt[n - 1];
    sigTimer = setTimeout(step, c === ',' || c === '.' ? 160 : 22 + Math.random() * 26);
  };
  sigTimer = setTimeout(step, 420);
}

function homeAmbience(on) {
  if (!AC) {

      const g = AC.createGain();

        [ROOT / 8, 'sine', 0.32],
        [(ROOT / 8) * 1.498, 'sine', 0.18],
        [(ROOT / 8) * 1.006, 'sawtooth', 0.08],

          og = AC.createGain();

      const glass = AC.createGain();
      glass.gain.value = 0.018;
      glass.connect(g);

      for (const [semi, rate] of [
        [12, 0.11],
        [19, 0.07],
        [27, 0.05],
        [24, 0.13],
      ]) {
        const o = AC.createOscillator(),
          og = AC.createGain(),

        o.type = 'sine';
        o.frequency.value = (ROOT / 2) * Math.pow(2, semi / 12);
        og.gain.value = 0.5;
        tr.frequency.value = rate;
        trg.gain.value = 0.5;
        tr.connect(trg);
        trg.connect(og.gain);

        tr.start(n);

      const a = amb;
      amb = null;

      a.g.gain.setValueAtTime(Math.max(a.g.gain.value, 0.0001), n);

  sfl = Math.max(sfl - dt * 1.3, hsFlare);

      hsEvents['s' + i] = 1;
      rockIn(d, clamp(Math.cos(a0), -1, 1) * 0.85);
    }
  });
  if (homeT >= TDE.t0 + TDE.dur - 1.4 && !hsEvents.suck) {
    hsEvents.suck = 1;
    bigSuck(1.4);
  }
  if (homeT >= TDE.t0 + TDE.dur - 0.75 && !hsEvents.chirp) {
    hsEvents.chirp = 1;
    gwChirp();
  }
  if (hsEvents.feed) {
    hsRipple += dt;
  }
  if (homeT >= HOME_BIG && !hsEvents.bedOff) {
    hsEvents.bedOff = 1;
    showStop(1.5);
  }
  logoSounds();
  ROCKS.forEach(([tb, , d], i) => {
    if (homeT >= tb + d && !hsEvents['r' + i]) {
      hsEvents['r' + i] = 1;
      hsFlare = Math.max(hsFlare, 0.55);
      hsShake = Math.max(hsShake, 3);

    hsFlare = 1;
    hsBoost = 1;

  }
}
/**
 * Punto de una trayectoria en espiral hacia el horizonte, cada vez más rápida al acercarse.
 *
 * @param {number} cx Centro horizontal del agujero, en píxeles de pantalla.
 * @param {number} cy Centro vertical del agujero, en píxeles de pantalla.
 * @param {number} R Radio del horizonte, en píxeles de pantalla.
 * @param {number} r0 Radio inicial, en píxeles de pantalla.
 * @param {number} a0 Ángulo inicial, en radianes.
 * @param {number} u Avance de la caída, de 0 a 1.
 * @param {number} dir Sentido del giro (1 o -1).
 * @returns {number[]} [x, y, r]: posición y distancia al centro, en píxeles de pantalla.
 */
function spiralPos(cx, cy, R, r0, a0, u, dir) {
  const r = r0 + (R * 0.92 - r0) * Math.pow(u, 1.7),
    a = a0 + dir * (u * 1.6 + u * u * u * 4.2);
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.82, r];
}
/**
 * Dibuja un cuadro de la entrada: el agujero negro grande (lente de estrellas, chorros, rocas en
 * espiral y la estrella destrozada) que se aleja hasta su lugar de juego.
 */
function renderHomeIntro() {
  const T = homeT,
    p = easeIO(clamp((T - HOME_BIG) / (HOME_IN - HOME_BIG), 0, 1));
  ctx.save();
  ctx.fillStyle = '#05060c';
  ctx.fillRect(0, 0, W, H);
  if (hsShake > 0) {
    ctx.translate((Math.random() - 0.5) * hsShake, (Math.random() - 0.5) * hsShake);
  }
  const Rbig = Math.min(W, H) * 0.24 * (1 + 0.04 * clamp(T / HOME_BIG, 0, 1)),
    Rg = Math.max(rr(sunLevel), SUN) * S;
  const R = Rbig + (Rg - Rbig) * p,
    cx = W / 2 + (CX - W / 2) * p,
    cy = H * 0.47 + (CY - H * 0.47) * p;
  // La luz de las estrellas se dobla alrededor del agujero negro: cada estrella se aparta del
  // centro como RE²/d (RE hace de radio de Einstein) y cerca del anillo se estira en un arco.
  const sr = Math.max(W, H) * 0.62,
    RE = R * 1.7;
  for (const s of stars) {
    const a = s.a + t * 0.015;
    let x = CX + Math.cos(a) * s.r * sr,
      y = CY + Math.sin(a) * s.r * sr;
    const dx = x - cx,
      dy = y - cy,
      d = Math.hypot(dx, dy) || 1;
    if (d < R * 1.02) {
      continue;
    }
    const dl = d + ((RE * RE) / d) * 0.45 * (1 - p);
    x = cx + (dx / d) * dl;
    y = cy + (dy / d) * dl;
    const tang = clamp((RE * 1.3) / d, 0, 1) * (1 - p);
    ctx.globalAlpha = 0.14 + 0.3 * (0.5 + 0.5 * Math.sin(t * 1.3 + s.tw)) + 0.3 * tang;
    ctx.fillStyle = BONE;
    if (tang > 0.25) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
      ctx.fillRect(-s.s * (1 + tang * 3), -s.s * 0.4, s.s * 2 * (1 + tang * 3), s.s * 0.8);
      ctx.restore();
    } else {
      ctx.fillRect(x, y, s.s * 0.8, s.s * 0.8);
    }
  }
  ctx.globalAlpha = 1;
  const k = SK + (0.96 - SK) * p,
    f0 = BR0 + (1.06 - BR0) * p,
    f1 = BR1 + (1.6 - BR1) * p;
  const g = ctx.createRadialGradient(cx, cy, R, cx, cy, R * (4.5 + hsBoost * 2));
  g.addColorStop(0, 'rgba(255,100,28,' + (0.22 + hsBoost * 0.35) + ')');
  g.addColorStop(1, 'rgba(255,100,28,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  if (p > 0) {
    const ra = [0.9, 0.47, 0.08, 0.04, 0.02];
    for (let i = 0; i < 5; i++) {
      ctx.globalAlpha = p * ra[i];
      ctx.strokeStyle = BONE;
      ctx.lineWidth = i === 0 ? 2 : 1;
      ctx.beginPath();
      ctx.arc(CX, CY, rr(i) * S, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  bhDiskK(cx, cy, R, k, f0, f1, Math.PI - 0.03, Math.PI * 2 + 0.03, 1);
  // chorros de energía por los polos al alimentarse
  if (hsJet > 0) {
    for (const sgn of [-1, 1]) {
      const len = R * (3.2 + 2.5 * (1 - hsJet)),
        w0 = R * 0.08,
        w1 = R * 0.32,
        y1 = cy + sgn * len;
      const jg = ctx.createLinearGradient(cx, cy, cx, y1);
      jg.addColorStop(0, 'rgba(232,240,255,' + 0.85 * hsJet + ')');
      jg.addColorStop(1, 'rgba(143,208,255,0)');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.moveTo(cx - w0, cy);
      ctx.lineTo(cx - w1 * (0.8 + 0.2 * Math.sin(t * 40)), y1);
      ctx.lineTo(cx + w1, y1);
      ctx.lineTo(cx + w0, cy);
      ctx.closePath();
      ctx.fill();
    }
  }
  bhCore(cx, cy, R, 1 - 0.6 * p);
  bhDiskK(cx, cy, R, k, f0, f1, 0, Math.PI, 1);
  if (hsRipple > 0 && hsRipple < 2.2) {
    for (let i = 0; i < 4; i++) {
      const q = hsRipple - i * 0.18;
      if (q <= 0) {
        continue;
      }
      const rr2 = R * (1.4 + q * 5),
        al = Math.max(0, 0.5 * (1 - q / 2.2)) * (1 - i * 0.2);
      ctx.globalAlpha = al;
      ctx.strokeStyle = '#e8f0ff';
      ctx.lineWidth = 2 * (1 - q / 2.2) + 0.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr2, rr2 * (0.55 + 0.45 * p), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (hsBoost > 0) {
    ctx.globalAlpha = hsBoost * 0.5;
    ctx.strokeStyle = '#fff3cf';
    ctx.lineWidth = R * 0.12 * hsBoost;
    ctx.beginPath();
    ctx.ellipse(cx, cy, R * 1.5, R * 1.5 * k, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // rocas que caen en espiral y se estiran
  if (p === 0) {
    const r0 = Math.max(W, H) * 0.62;
    ROCKS.forEach(([tb, a0, d, dir]) => {
      const u = (T - tb) / d;
      if (u <= 0 || u >= 1) {
        return;
      }
      const pts = [];
      for (let j = 0; j < 7; j++) {
        const uu = Math.max(0, u - j * 0.035 * (0.4 + u));
        pts.push(spiralPos(cx, cy, R, r0, a0, uu, dir));
      }
      ctx.lineCap = 'round';
      for (let j = pts.length - 1; j > 0; j--) {
        ctx.globalAlpha = (1 - j / pts.length) * 0.9;
        ctx.strokeStyle = j < 2 ? '#d8c6b0' : '#b49a7e';
        ctx.lineWidth = Math.max(1, (5 - j * 0.6) * (1 - u * 0.5));
        ctx.beginPath();
        ctx.moveTo(pts[j - 1][0], pts[j - 1][1]);
        ctx.lineTo(pts[j][0], pts[j][1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ece6d8';
      ctx.beginPath();
      ctx.arc(pts[0][0], pts[0][1], 3.5 * (1 - u * 0.6), 0, Math.PI * 2);
      ctx.fill();
    });
    // la estrella que es destrozada: se estira en un río de fuego que se enrolla alrededor del
    // disco
    const u = (T - TDE.t0) / TDE.dur;
    if (u > 0 && u < 1) {
      const tail = Math.min(0.6, u * 0.9),
        N = 40;
      ctx.lineCap = 'round';
      for (let j = 0; j < N; j++) {
        const ua = Math.max(0, u - (tail * j) / N),
          ub = Math.max(0, u - (tail * (j + 1)) / N);
        const A = spiralPos(cx, cy, R, r0 * 0.95, TDE.a0, ua, 1),
          B = spiralPos(cx, cy, R, r0 * 0.95, TDE.a0, ub, 1);
        ctx.globalAlpha = (1 - j / N) * 0.95;
        ctx.strokeStyle = j < 6 ? '#fff6e0' : j < 18 ? '#ffd36b' : '#ff7a2a';
        ctx.lineWidth = Math.max(1, R * 0.12 * (1 - j / N) * (u < 0.3 ? 0.6 + u : 1));
        ctx.beginPath();
        ctx.moveTo(A[0], A[1]);
        ctx.lineTo(B[0], B[1]);
        ctx.stroke();
      }
      const H0 = spiralPos(cx, cy, R, r0 * 0.95, TDE.a0, u, 1),
        hr = R * 0.22 * (1 - u * 0.7);
      const sg = ctx.createRadialGradient(H0[0], H0[1], 0, H0[0], H0[1], hr * 3);
      sg.addColorStop(0, 'rgba(255,246,224,.9)');
      sg.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(H0[0], H0[1], hr * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff6e0';
      ctx.beginPath();
      ctx.ellipse(
        H0[0],
        H0[1],
        hr * (1 + u * 1.5),
        hr * (1 - u * 0.5),
        Math.atan2(H0[1] - cy, H0[0] - cx) + Math.PI / 2,
        0,
        Math.PI * 2,
      );
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if (p > 0.4) {
    ctx.globalAlpha = (p - 0.4) / 0.6;
    drawPlayer(CX, CY - rr(0) * S, PR * S * 1.15);
    ctx.globalAlpha = 1;
  }
  if (hsFlare > 0.6) {
    ctx.globalAlpha = (hsFlare - 0.6) * 0.6;
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.globalAlpha = 1;
  }
  if (T < 0.9) {
    ctx.globalAlpha = 1 - T / 0.9;
    ctx.fillStyle = '#05060c';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (logoT0 > 0 && T >= logoT0) {
    drawLogo(W / 2, Math.max(120, H * 0.24), Math.min(46, W * 0.1), T - logoT0);
  }
}
// ---------- sonidos de la interfaz: cristal y eco, en la tonalidad del juego ----------
let uiBus = null,
  lastHover = null,
  uiLastT = 0;
function uiOut() {
  if (uiBus) {
    return uiBus;
  }
  const inG = AC.createGain(),
    dl = AC.createDelay(1),
    fb = AC.createGain(),
    wet = AC.createGain();

  fb.gain.value = 0.35;
  wet.gain.value = 0.45;
  inG.connect(master);
  inG.connect(dl);
  dl.connect(fb);
  fb.connect(dl);
  dl.connect(wet);
  wet.connect(master);

}
function uiTone(f, t0, dur, gain, type) {
  const o = AC.createOscillator(),
    g = AC.createGain(),
    lp = AC.createBiquadFilter();
  o.type = type || 'sine';
  o.frequency.value = f;
  lp.type = 'lowpass';
  lp.frequency.value = 3200;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(lp);
  lp.connect(g);
  g.connect(uiOut());
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
// al pasar el puntero: una nota de cristal suave, distinta cada vez
function uiHover() {

    return;
  }

    const n = AC.currentTime;
    if (n - uiLastT < 0.06) {
      return;
    }
    uiLastT = n;
    const notes = [0, 3, 7, 10, 12, 15],
      semi = notes[Math.floor(Math.random() * notes.length)] + 12;
    uiTone(ROOT * Math.pow(2, semi / 12), n, 0.9, 0.045);
    uiTone(ROOT * 2 * Math.pow(2, semi / 12), n + 0.01, 0.5, 0.012);

function uiClick(kind) {

// ---------- el sonido de la absorción ----------
let showBus = null,
  bed = null;
function showOut() {
  if (!showBus) {
    showBus = AC.createGain();
    showBus.gain.value = muted ? 0 : 1;
    showBus.connect(master);
  }
  return showBus;
}
// un "inhalar" que nunca para: oleadas de aire que bajan de tono y se cortan, como un desagüe
// cósmico
function showStart() {
  if (!AC) {
    return;
  }
  try {
    const n = AC.currentTime;
    showStop(0.05);
    showBus = AC.createGain();
    showBus.gain.setValueAtTime(muted ? 0 : 1, n);
    showBus.connect(master);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.38, n + 1.2);
    g.connect(showBus);
    const vg = AC.createGain();
    vg.gain.setValueAtTime(0.0001, n);
    vg.gain.exponentialRampToValueAtTime(0.42, n + 1.8);
    vg.connect(showBus);
    const nodes = perseusVoice(vg, n);
    // presión gravitacional: un latido grave, más sentido que escuchado
    const pr = AC.createOscillator(),
      prg = AC.createGain(),
      pl = AC.createOscillator(),
      plg = AC.createGain();
    pr.type = 'sine';
    pr.frequency.value = 43;
    prg.gain.value = 0.35;
    pl.frequency.value = 0.55;
    plg.gain.value = 0.3;
    pl.connect(plg);
    plg.connect(prg.gain);
    pr.connect(prg);
    prg.connect(g);
    pr.start(n);
    pl.start(n);
    nodes.push(pr, pl);
    const o = AC.createOscillator(),
      og = AC.createGain();
    o.type = 'sine';
    o.frequency.value = 31;
    og.gain.value = 0.4;
    o.connect(og);
    og.connect(g);

}
function showStop(fade) {
  if (!AC) {
    return;
  }
  try {
    const n = AC.currentTime,
      f = fade || 0.6;
    if (showBus) {
      const sb = showBus;
      showBus = null;
      sb.gain.cancelScheduledValues(n);
      sb.gain.setValueAtTime(Math.max(sb.gain.value, 0.0001), n);
      sb.gain.exponentialRampToValueAtTime(0.0001, n + f);
    }
    if (bed) {
      const b = bed;
      bed = null;
      b.nodes.forEach(x => {
        try {
          x.stop(n + f + 0.1);
        } catch (e) {}
      });
    }
  } catch (e) {}
}
// cada roca: un silbido que sube mientras acelera hacia el centro y se corta al cruzar el horizonte
function rockIn(dur, pan) {
  if (!AC || muted) {
    return;
  }
  try {
    const n = AC.currentTime,
      out = showOut();
    let dest = out;
    if (AC.createStereoPanner) {
      const pn = AC.createStereoPanner();
      pn.pan.setValueAtTime(pan, n);
      pn.pan.linearRampToValueAtTime(0, n + dur);
      pn.connect(out);
      dest = pn;
    }
    // la roca cae y su "voz" se vuelve cada vez más aguda (corrimiento al azul), hasta cortarse en
    // el horizonte
    for (const [f0, f1, gn, ty] of [
      [55, 330, 0.2, 'sine'],
      [82, 495, 0.07, 'sine'],
      [110, 660, 0.03, 'triangle'],
    ]) {
      const o = AC.createOscillator(),
        g = AC.createGain(),
        v = AC.createOscillator(),
        vg = AC.createGain();
      o.type = ty;
      o.frequency.setValueAtTime(f0, n);
      o.frequency.exponentialRampToValueAtTime(f1, n + dur);
      v.frequency.value = 5;
      vg.gain.value = f0 * 0.02;
      v.connect(vg);
      vg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(gn, n + dur * 0.97);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur + 0.02);
      o.connect(g);
      g.connect(dest);
      o.start(n);
      v.start(n);
      o.stop(n + dur + 0.1);
      v.stop(n + dur + 0.1);
    }
  } catch (e) {}
}
// justo antes de tragarse la estrella: una gran inhalación que crece y se corta en seco
function bigSuck(dur) {
  if (!AC || muted) {
    return;
  }
  try {
    const n = AC.currentTime,
      out = showOut();
    for (const [f0, f1, gn, ty, lpf] of [
      [30, 90, 0.5, 'sine', 0],
      [45, 135, 0.18, 'sawtooth', 300],
      [60, 240, 0.06, 'sawtooth', 900],
    ]) {
      const o = AC.createOscillator(),
        g = AC.createGain();
      o.type = ty;
      o.frequency.setValueAtTime(f0, n);
      o.frequency.exponentialRampToValueAtTime(f1, n + dur);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(gn, n + dur * 0.98);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur + 0.02);
      if (lpf) {
        const lp = AC.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = lpf;
        o.connect(lp);
        lp.connect(g);
      } else {
        o.connect(g);
      }
      g.connect(out);
      o.start(n);
      o.stop(n + dur + 0.1);
    }
  } catch (e) {}

// ---------- sonidos científicos ----------
// "Voz" inspirada en la sonificación de la NASA del agujero negro de Perseo (2022): un gemido grave
// que cambia lentamente de tono
function perseusVoice(dest, n) {
  const nodes = [];
  const formA = AC.createBiquadFilter(),
    formB = AC.createBiquadFilter(),
    mix = AC.createGain();
  formA.type = 'bandpass';
  formA.frequency.value = 420;
  formA.Q.value = 5;
  formB.type = 'bandpass';
  formB.frequency.value = 900;
  formB.Q.value = 7;
  mix.gain.value = 0.9;
  formA.connect(mix);
  formB.connect(mix);
  mix.connect(dest);
  // la "vocal" del gemido cambia despacio (ooo -> aaa)
  for (const [f, rate, depth] of [
    [formA, 0.09, 160],
    [formB, 0.06, 300],
  ]) {
    const l = AC.createOscillator(),
      lg = AC.createGain();
    l.frequency.value = rate;
    lg.gain.value = depth;
    l.connect(lg);
    lg.connect(f.frequency);
    l.start(n);
    nodes.push(l);
  }
  for (const [base, rate, dep, gn] of [
    [ROOT / 8, 0.05, 0.09, 0.5],
    [(ROOT / 8) * 1.19, 0.037, 0.11, 0.32],
    [(ROOT / 16) * 1.5, 0.023, 0.07, 0.45],
    [(ROOT / 8) * 0.998, 0.061, 0.1, 0.28],
  ]) {
    const o = AC.createOscillator(),
      og = AC.createGain(),
      l = AC.createOscillator(),
      lg = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.value = base;
    og.gain.value = gn;
    l.frequency.value = rate;
    lg.gain.value = base * dep;
    l.connect(lg);
    lg.connect(o.frequency); // el tono se arrastra arriba y abajo
    o.connect(og);
    og.connect(formA);
    og.connect(formB);
    o.start(n);
    l.start(n);
    nodes.push(o, l);
  }
  return nodes;
}
// "Chirrido" inspirado en las ondas gravitacionales que detectó LIGO en 2015: sube de tono, crece y
// se apaga de golpe
function gwChirp() {
  if (!AC || muted) {
    return;
  }
  try {
    const n = AC.currentTime,
      out = showOut(),
      dur = 0.75;
    for (const [mult, gn, ty] of [
      [1, 0.55, 'sine'],
      [2, 0.14, 'sine'],
      [1, 0.08, 'triangle'],
    ]) {
      const o = AC.createOscillator(),
        g = AC.createGain();
      o.type = ty;
      o.frequency.setValueAtTime(32 * mult, n);
      o.frequency.exponentialRampToValueAtTime(110 * mult, n + dur * 0.75);
      o.frequency.exponentialRampToValueAtTime(320 * mult, n + dur);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(gn * 0.3, n + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(gn, n + dur * 0.98);
      g.gain.exponentialRampToValueAtTime(gn * 0.2, n + dur + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur + 0.35); // "ringdown"
      o.connect(g);
      g.connect(out);
      o.start(n);
      o.stop(n + dur + 0.4);
    }
  } catch (e) {}
}

  // un cielo lleno de estrellas de distintos colores
  for (let i = 0; i < 520; i++) {
    const x = R2() * W,
      y = R2() * H,
      s = R2() < 0.9 ? 0.5 + R2() * 0.9 : 1.4 + R2() * 1.2;
    g.fillStyle =
      ['rgba(255,255,255,', 'rgba(200,215,255,', 'rgba(255,236,205,'][i % 3] +
      (0.35 + R2() * 0.55) +
      ')';
    g.fillRect(x, y, s, s);
  }
  andCanvas = c;
  andKey = key;

}
// Estrellas que titilan sobre los fondos 2D: posiciones repartidas con la razón áurea (de 0 a 1
// del ancho y del alto) y fase propia.
const AND_TW = Array.from({ length: 26 }, (_, i) => ({
  x: (i * 0.6180339) % 1,
  y: (i * 0.7548776) % 1,
  p: i * 1.7,
}));
/** Dibuja el fondo de Andrómeda en toda la pantalla (respaldo 2D del fondo WebGL). */
function drawAndromeda() {
  const c = buildAndromeda();
  ctx.save();
  if (c) {
    const a = Math.sin(t * 0.025) * 0.025; // la galaxia gira tan lento que apenas se nota
    ctx.translate(W / 2, H / 2);
    ctx.rotate(a);
    ctx.scale(1.07, 1.07);
    ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(c, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#070618';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  for (const s of AND_TW) {
    ctx.globalAlpha = 0.25 + 0.6 * Math.max(0, Math.sin(t * 1.7 + s.p));
    ctx.fillStyle = '#e8f0ff';
    ctx.fillRect(s.x * W, s.y * H, 1.8, 1.8);
  }
  ctx.globalAlpha = 1;
}

// ---- Dentro de la Gran Nube de Magallanes (como la muestran los telescopios) ----
// Barra central de estrellas viejas anaranjadas, nubes irregulares de estrellas azuladas, la
// nebulosa de la Tarántula (rosada, con su cúmulo R136), polvo oscuro, la Pequeña Nube a lo lejos
// con un puente tenue de estrellas, y los tres anillos de la supernova 1987A.
let magCanvas = null,
  magKey = '';
/**
 * Pinta la Gran Nube de Magallanes en un canvas del tamaño de la pantalla y lo guarda hasta que
 * cambie el tamaño.
 *
 * @returns {HTMLCanvasElement|null} El canvas, o null si el navegador no puede crearlo.
 */
function buildMagallanes() {
  const key = Math.round(W) + 'x' + Math.round(H);
  if (magCanvas && magKey === key) {
    return magCanvas;
  }
  if (!document.createElement) {
    return null;
  }
  const c = document.createElement('canvas');
  if (!c || !c.getContext) {
    return null;
  }
  const d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(W * d);
  c.height = Math.round(H * d);
  const g = c.getContext('2d');
  if (!g || !g.setTransform) {
    return null;
  }
  g.setTransform(d, 0, 0, d, 0, 0);
  let sd = 1987;
  const R2 = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const D = Math.hypot(W, H);
  g.fillStyle = '#04070e';
  g.fillRect(0, 0, W, H);
  const tint = g.createLinearGradient(0, H, W, 0);
  tint.addColorStop(0, 'rgba(10,40,60,.4)');
  tint.addColorStop(1, 'rgba(40,20,50,.3)');
  g.fillStyle = tint;
  g.fillRect(0, 0, W, H);
  // nubes irregulares de estrellas (la forma de la galaxia es desordenada, sin espirales)
  for (let i = 0; i < 34; i++) {
    const x = R2() * W,
      y = R2() * H,
      r = D * (0.05 + R2() * 0.14),
      cg = g.createRadialGradient(x, y, 0, x, y, r);
    cg.addColorStop(0, 'rgba(190,210,255,' + (0.06 + R2() * 0.12) + ')');
    cg.addColorStop(1, 'rgba(160,190,255,0)');
    g.fillStyle = cg;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // la barra central: estrellas viejas, anaranjadas, cruzando en diagonal
  g.save();
  g.translate(W * 0.42, H * 0.56);
  g.rotate(-0.42);
  g.scale(1, 0.26);
  const bar = g.createRadialGradient(0, 0, 0, 0, 0, D * 0.5);
  bar.addColorStop(0, 'rgba(255,225,180,.6)');
  bar.addColorStop(0.35, 'rgba(255,200,150,.22)');
  bar.addColorStop(1, 'rgba(255,190,140,0)');
  g.fillStyle = bar;
  g.beginPath();
  g.arc(0, 0, D * 0.5, 0, Math.PI * 2);
  g.fill();
  g.restore();
  for (let i = 0; i < 500; i++) {
    const u = (R2() - 0.5) * 2,
      v = (R2() - 0.5) * 0.28,
      x = W * 0.42 + Math.cos(-0.42) * u * D * 0.42 - Math.sin(-0.42) * v * D * 0.42,
      y = H * 0.56 + Math.sin(-0.42) * u * D * 0.42 + Math.cos(-0.42) * v * D * 0.42;
    g.fillStyle =
      'rgba(255,' +
      ((205 + R2() * 40) | 0) +
      ',' +
      ((150 + R2() * 60) | 0) +
      ',' +
      (0.25 + R2() * 0.5) +
      ')';
    g.fillRect(x, y, 0.6 + R2() * 1.4, 0.6 + R2() * 1.4);
  }
  // polvo oscuro en manchas
  for (let i = 0; i < 10; i++) {
    const x = R2() * W,
      y = R2() * H,
      r = D * (0.04 + R2() * 0.08),
      dg = g.createRadialGradient(x, y, 0, x, y, r);
    dg.addColorStop(0, 'rgba(14,8,6,.55)');
    dg.addColorStop(1, 'rgba(14,8,6,0)');
    g.fillStyle = dg;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // la nebulosa de la Tarántula: rosada, con filamentos y su cúmulo de estrellas jóvenes R136
  const tx = W * 0.76,
    ty = H * 0.2,
    TR = D * 0.17;
  for (let i = 0; i < 14; i++) {
    const a = R2() * Math.PI * 2,
      rr2 = TR * (0.2 + R2() * 0.8),
      x = tx + Math.cos(a) * rr2 * 0.6,
      y = ty + Math.sin(a) * rr2 * 0.6,
      r = TR * (0.25 + R2() * 0.4),
      ng = g.createRadialGradient(x, y, 0, x, y, r);
    ng.addColorStop(0, 'rgba(255,90,150,' + (0.18 + R2() * 0.18) + ')');
    ng.addColorStop(1, 'rgba(255,70,140,0)');
    g.fillStyle = ng;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const a0 = R2() * Math.PI * 2;
    g.strokeStyle = 'rgba(255,150,190,' + (0.18 + R2() * 0.2) + ')';
    g.lineWidth = 1 + R2() * 2.5;
    g.beginPath();
    for (let j = 0; j <= 14; j++) {
      const a = a0 + j * 0.12 + Math.sin(j * 0.9 + i) * 0.15,
        r = TR * (0.15 + j * 0.055);
      const x = tx + Math.cos(a) * r,
        y = ty + Math.sin(a) * r * 0.8;
      j ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  const r136 = g.createRadialGradient(tx, ty, 0, tx, ty, TR * 0.18);
  r136.addColorStop(0, 'rgba(235,245,255,.95)');
  r136.addColorStop(1, 'rgba(180,210,255,0)');
  g.fillStyle = r136;
  g.fillRect(tx - TR * 0.2, ty - TR * 0.2, TR * 0.4, TR * 0.4);
  // la Pequeña Nube de Magallanes a lo lejos, y el puente de estrellas que las une
  const sx = W * 0.12,
    sy = H * 0.12;
  g.save();
  g.translate(sx, sy);
  g.rotate(0.5);
  g.scale(1, 0.55);
  const smc = g.createRadialGradient(0, 0, 0, 0, 0, D * 0.08);
  smc.addColorStop(0, 'rgba(210,225,255,.5)');
  smc.addColorStop(1, 'rgba(190,210,255,0)');
  g.fillStyle = smc;
  g.beginPath();
  g.arc(0, 0, D * 0.08, 0, Math.PI * 2);
  g.fill();
  g.restore();
  for (let i = 0; i < 70; i++) {
    const u = R2(),
      x = sx + (W * 0.42 - sx) * u + (R2() - 0.5) * D * 0.05,
      y = sy + (H * 0.56 - sy) * u + (R2() - 0.5) * D * 0.05;
    g.fillStyle = 'rgba(200,220,255,' + (0.2 + R2() * 0.4) + ')';
    g.fillRect(x, y, 1.1, 1.1);
  }
  // supernova 1987A: un punto brillante con su anillo interior y dos anillos exteriores
  const nx = tx - TR * 0.55,
    ny = ty + TR * 0.55;
  g.strokeStyle = 'rgba(255,220,200,.7)';
  g.lineWidth = 1;
  g.beginPath();
  g.ellipse(nx, ny, 5, 3, 0.5, 0, Math.PI * 2);
  g.stroke();
  g.strokeStyle = 'rgba(255,160,190,.45)';
  g.beginPath();
  g.ellipse(nx - 3, ny - 5, 12, 6, 0.5, 0, Math.PI * 2);
  g.stroke();
  g.beginPath();
  g.ellipse(nx + 3, ny + 5, 12, 6, 0.5, 0, Math.PI * 2);
  g.stroke();
  g.fillStyle = 'rgba(255,240,220,.95)';
  g.beginPath();
  g.arc(nx, ny, 1.4, 0, Math.PI * 2);
  g.fill();
  // muchas estrellas azuladas, jóvenes
  for (let i = 0; i < 480; i++) {
    const x = R2() * W,
      y = R2() * H,
      s = R2() < 0.9 ? 0.5 + R2() * 0.9 : 1.3 + R2() * 1.3;
    g.fillStyle =
      ['rgba(255,255,255,', 'rgba(190,215,255,', 'rgba(170,200,255,'][i % 3] +
      (0.35 + R2() * 0.55) +
      ')';
    g.fillRect(x, y, s, s);
  }
  magCanvas = c;
  magKey = key;
  return c;
}
/** Dibuja el fondo de la Gran Nube de Magallanes en toda la pantalla (respaldo 2D). */
function drawMagallanes() {
  const c = buildMagallanes();
  ctx.save();
  if (c) {
    const a = Math.sin(t * 0.03) * 0.02;
    ctx.translate(W / 2, H / 2);
    ctx.rotate(a);
    ctx.scale(1.07, 1.07);
    ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(c, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#04070e';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  for (const s of AND_TW) {
    ctx.globalAlpha = 0.25 + 0.6 * Math.max(0, Math.sin(t * 1.9 + s.p));
    ctx.fillStyle = '#e8f4ff';
    ctx.fillRect(((s.x + 0.37) % 1) * W, ((s.y + 0.21) % 1) * H, 1.8, 1.8);
  }
  ctx.globalAlpha = 1;
}

// ---- Fondos de los niveles 4 a 8, como los muestran los telescopios ----
// Canvas ya pintados, por nivel y tamaño de pantalla ('nivel:anchoxalto').
const bgCache = {};
/**
 * Pinta una mancha de luz redonda con degradado radial.
 *
 * @param {CanvasRenderingContext2D} g Contexto donde pintar.
 * @param {number} x Centro horizontal, en píxeles de pantalla.
 * @param {number} y Centro vertical, en píxeles de pantalla.
 * @param {number} r Radio, en píxeles de pantalla.
 * @param {string} c0 Color del centro, en CSS.
 * @param {string} c1 Color del borde, en CSS.
 */
function blob(g, x, y, r, c0, c1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, c0);
  gr.addColorStop(1, c1);
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}
// Pintores de cada fondo, por índice de nivel (3 a 7). Reciben el contexto, el ancho y alto y la
// diagonal de la pantalla (en píxeles) y un generador pseudoaleatorio con semilla fija.
const BG_BUILD = {
  // Centaurus A: elíptica gigante y cálida, cruzada por una franja de polvo torcida con estrellas
  // jóvenes; chorros y lóbulos perpendiculares
  3: (g, W, H, D, R) => {
    g.fillStyle = '#07060a';
    g.fillRect(0, 0, W, H);
    const cx = W * 0.5,
      cy = H * 0.38,
      la = -0.35,
      ja = la + Math.PI / 2;
    for (const sg of [-1, 1]) {
      const lx = cx + Math.cos(ja) * sg * D * 0.42,
        ly = cy + Math.sin(ja) * sg * D * 0.42;
      blob(g, lx, ly, D * 0.24, 'rgba(255,140,60,.2)', 'rgba(255,120,50,0)');
      g.fillStyle = 'rgba(160,200,255,.28)';
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(lx + Math.cos(la) * D * 0.03, ly + Math.sin(la) * D * 0.03);
      g.lineTo(lx - Math.cos(la) * D * 0.03, ly - Math.sin(la) * D * 0.03);
      g.closePath();
      g.fill();
    }
    blob(g, cx, cy, D * 0.45, 'rgba(255,236,205,.7)', 'rgba(230,200,160,0)');
    for (let i = 0; i < 700; i++) {
      const r = Math.abs(R() + R() + R() - 1.5) * D * 0.3,
        a = R() * Math.PI * 2;
      g.fillStyle = 'rgba(255,230,195,' + (0.2 + R() * 0.5) + ')';
      g.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.85, 1, 1);
    }
    g.save();
    g.translate(cx, cy);
    g.rotate(la);
    const bz = u => {
      const p0 = [-D * 0.48, D * 0.02],
        p1 = [-D * 0.15, -D * 0.07],
        p2 = [D * 0.15, D * 0.07],
        p3 = [D * 0.48, -D * 0.02],
        v = 1 - u;
      return [
        v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
        v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1],
      ];
    };
    g.lineCap = 'round';
    for (const [lw, al] of [
      [D * 0.085, 0.55],
      [D * 0.05, 0.85],
    ]) {
      g.strokeStyle = 'rgba(22,12,6,' + al + ')';
      g.lineWidth = lw;
      g.beginPath();
      for (let i = 0; i <= 40; i++) {
        const [x, y] = bz(i / 40);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
    for (let i = 0; i < 60; i++) {
      const [x, y] = bz(R()),
        off = (R() - 0.5) * D * 0.07;
      if (i % 3 === 0) {
        blob(g, x, y + off, 5 + R() * 8, 'rgba(255,120,175,.5)', 'rgba(255,90,160,0)');
      } else {
        g.fillStyle = 'rgba(170,200,255,.7)';
        g.fillRect(x, y + off, 1.5, 1.5);
      }
    }
    g.restore();
  },
  // Remolino (M51): espiral vista de frente con dos brazos perfectos, regiones rosadas, polvo, y su
  // vecina NGC 5195 al final de un brazo
  4: (g, W, H, D, R) => {
    g.fillStyle = '#050712';
    g.fillRect(0, 0, W, H);
    const cx = W * 0.42,
      cy = H * 0.46;
    let tipX = 0,
      tipY = 0;
    blob(g, cx, cy, D * 0.5, 'rgba(120,145,230,.14)', 'rgba(90,110,220,0)');
    for (let arm = 0; arm < 2; arm++) {
      const dust = [];
      for (let i = 0; i < 900; i++) {
        const th = (i / 900) * 6.6 + arm * Math.PI,
          r = D * 0.035 * Math.exp(0.3 * th);
        if (r > D * 0.95) {
          break;
        }
        const x = cx + Math.cos(th) * r + (R() - 0.5) * r * 0.16,
          y = cy + Math.sin(th) * r + (R() - 0.5) * r * 0.16;
        g.fillStyle = ['rgba(150,180,255,', 'rgba(190,210,255,'][i % 2] + (0.2 + R() * 0.45) + ')';
        g.beginPath();

    g.beginPath();
    g.ellipse(cx, cy + D * 0.012, D * 0.5, D * 0.02, 0, 0, Math.PI * 2);

// 3 · M32: la pequeña galaxia elíptica que pasa rozando y arranca estrellas del disco

// 4 · el anillo de fuego: así se ve Andrómeda en infrarrojo, anillos de polvo encendido
vec3 fireRing(vec2 q){

// 5 · el núcleo: bulbo dorado, el doble núcleo y el viento que sopla el agujero negro (en rayos X, violeta)
vec3 core(vec2 q){

// salida: Andrómeda y la Vía Láctea, que dentro de 4500 millones de años chocarán
vec3 collide(vec2 q){
  vec2 d = (q - .5*uRes)/uScale;

uniform float uSpd;

/**

 * la galaxia vista desde fuera con sus brazos espirales.

const FS_MW =

uniform float uScale;
float fbm7(vec2 p){ float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 7; i++){ s += a*vn(p); p = m*p; a *= .5; } return s; }

vec3 starsD(vec2 q, float sc, float dens, float bmul){

    vec2 o = vec2(x, y), cid = id + o; float n = h21(cid); if (n > dens) continue;
    vec2 sp = o + h22(cid*1.7); float dd = length(f - sp)*sc;

vec3 band(vec2 q, out float body){
  vec2 d = (q - .5*uRes)/uScale;
  float a = -1.05;                                                       // casi vertical, inclinada como en la foto
  d = mat2(cos(a), -sin(a), sin(a), cos(a))*d;
  d.x += uFlow*.006 + uJour*.6 + uT*.008;

  float w = .15 + .06*fbm(vec2(u*1.5, 7.));

// restos de supernova (como la Nebulosa del Velo): filamentos finos y retorcidos en magenta, naranja y azul
vec3 veil(vec2 q){
  vec2 d = (q - .5*uRes)/uScale;
  float a = -1.05; d = mat2(cos(a), -sin(a), sin(a), cos(a))*d;
  d.x += uFlow*.008 + uJour*.9 + uT*.01;
  vec2 w = d + .18*vec2(fbm(d*2.3 + 1. + uT*.06), fbm(d*2.3 + 7. - uT*.05)) - .09;

// la galaxia vista desde fuera: núcleo con barra dorada, brazos azules con cúmulos rosados
vec3 spiral(vec2 q){
  vec2 c = vec2(.5*uRes.x, .76*uRes.y);
  vec2 d = (q - c)/(uScale*.34);
  float a = .5 + uT*.01; d = mat2(cos(a), -sin(a), sin(a), cos(a))*d; d.y /= .62;

// 3 · el núcleo de la galaxia: nubes de estrellas doradas y polvo oscuro que gira
vec3 coreScene(vec2 q){

// 4 · nebulosa de reflexión y cúmulo joven (como las Pléyades): bruma azul con estrellas que destellan

// 5 · gas rojo con nubes oscuras recortadas (como la Cabeza de Caballo) y bordes encendidos

float win(float j, float a, float b){ return smoothstep(a - .05, a + .05, j)*(1. - smoothstep(b - .05, b + .05, j)); }

uniform float uSpd;

// rayas de velocidad: al saltar, las estrellas se estiran desde el centro como en un salto al hiperespacio
vec3 warp(vec2 q0){
  vec2 d = q0 - .5*uRes; float r = length(d)/uRes.y, a = atan(d.y, d.x);
  float bins = 90., id = floor((a/6.2831 + .5)*bins), fa = fract((a/6.2831 + .5)*bins) - .5;
  float off = h21(vec2(id, 3.)), z = fract(log(r + .05)*1.6 - uFlow*.05 - uT*.25 + off*7.);
  float streak = smoothstep(.0, .05, z)*smoothstep(.35, .05, z)*exp(-fa*fa*60.)*step(.55, h21(vec2(id, 9.)));
  vec3 tint = mix(vec3(.7, .85, 1.), vec3(1., .75, .9), h21(vec2(id, 5.)));
  return tint*streak*smoothstep(.12, .45, r);
}
vec3 post(vec3 col, vec2 q0){
  float lum = dot(col, vec3(.3, .55, .15));
  col = max(vec3(0.), mix(vec3(lum), col, 1.3));                                   // colores más vivos sin perder lo natural
  float hA = .22*sin(uT*.11 + uJour*5.) + .1*sin(uT*.27);                           // la paleta se mece dentro de colores reales del espacio
  col = max(vec3(0.), hueRot(col, hA));
  col.g = min(col.g, max(col.r, col.b)*1.02 + .01);                                // en el espacio casi no hay verde: se evita que el color derive a verde
  col *= 1. + .32*uBeat;                                                             // todo late con la música
  col += warp(q0)*smoothstep(.25, .9, uSpd)*(1.3 + .6*uBeat);
  vec2 v = (q0 - .5*uRes)/uRes.y; float vg = dot(v, v);
  col *= 1. - .55*vg;                                                                // viñeta de cine
  float rp = length(q0 - uBH.xy)/uRes.y;
  col *= .82 - .5*exp(-pow(rp/.34, 2.));                                             // donde juegas el cielo se calla: los anillos mandan
  col += vec3(.25, .1, .35)*vg*.06*(1. + uBeat);                                     // un borde de color muy tenue
  return col;
}
void main(){
  vec2 q0 = gl_FragCoord.xy, ctr = .5*uRes;
  float ra = uT*.006, zb = 1. + .02*sin(uT*.25);                          // el cielo gira despacio y "respira"
  vec2 q = ctr + mat2(cos(ra), -sin(ra), sin(ra), cos(ra))*(q0 - ctr)/zb;
  // agujero de gusano: la luz se dobla a su alrededor (lente gravitacional: cada punto se ve más lejos del centro)
  float whIn = 0.;
  if (uWH.w > .001){ vec2 wd = q0 - uWH.xy; float wr = max(length(wd), 1.), te = uWH.z*1.05;
    if (wr > uWH.z) q -= (wd/wr)*(te*te/wr)*uWH.w; else { whIn = 1.; float l = wr/uWH.z; q = uWH.xy + wd*(1.45/sqrt(max(1. - l*l*.93, .05))); } }
  float j = uJour;
  float w1 = win(j, -1., .2), w2 = win(j, .2, .38), w3 = win(j, .38, .56), w4 = win(j, .56, .74), w5 = win(j, .74, .9);
  float out_ = smoothstep(.86, .98, j);
  vec3 col = vec3(.018, .016, .03);
  float body = 0.;
  // 1 · la banda de la Vía Láctea con los filamentos del Velo (violeta y magenta)
  if (w1 > .001){ vec3 mw = band(q, body); col += (mw*.4 + veil(q)*1.1)*w1; }
  if (w2 > .001) col += emission(q)*w2;
  if (w3 > .001) col += coreScene(q)*w3;
  if (w4 > .001) col += blueScene(q)*w4;
  if (w5 > .001) col += redScene(q)*w5;
  // estrellas en capas: lejanas lentas y cercanas rápidas
  col += starsD(q + vec2(0., uFlow*1.2), 2.6, mix(.05, .5, body*w1)*(1. - out_*.6), .55);
  col += starsD(q + vec2(0., uFlow*2.4), 5., .1, .9);
  col += starsD(q + vec2(0., uFlow*5.), 11., .09, 1.25);
  // estrellas brillantes con halo de color y picos suaves
  { vec2 g = (q + vec2(uT*3., uFlow*3.5))/(uScale*.16), id = floor(g), f = fract(g);
    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
      vec2 o = vec2(x, y), cid = id + o; if (h21(cid + 17.) > .28) continue;
      vec2 pp = (f - o - h22(cid + 4.))*uScale*.16; float r2 = dot(pp, pp);
      vec3 sc = mix(vec3(1., .7, .45), vec3(.6, .78, 1.), h21(cid + 8.));
      float tw = .7 + .3*sin(uT*(2. + 3.*h21(cid)) + h21(cid)*20.);
      col += sc*(exp(-r2*.9)*1.4 + exp(-r2*.02)*.12 + (exp(-abs(pp.x)*1.2)*exp(-abs(pp.y)*.08) + exp(-abs(pp.y)*1.2)*exp(-abs(pp.x)*.08))*.08)*tw;
    } }
  col += meteors(q0);
  col += spiral(q)*out_*.85;
  vec2 bd = q - uBH.xy; float rb = length(bd);
  col += vec3(1., .45, .18)*.06*exp(-rb/(uRes.y*.4))*(1. - .7*j);
  col = post(col, q0);
  if (uWH.w > .001){
    float l = length(q0 - uWH.xy)/uWH.z, er = l - 1., ew = .0018 + .0006/max(uWH.z/120., .25);
    if (whIn > .5){ col = col*vec3(.8, .72, 1.2) + vec3(.03, .018, .08); col *= .62 + .55*smoothstep(1., .5, l); }   // la garganta: el mismo cielo, teñido
    // anillo de Einstein: la luz de detrás se amontona en el borde, con los colores un poco separados
    col += (vec3(1.)*exp(-er*er/ew)*.95 + vec3(1., .38, .72)*exp(-pow(er - .03, 2.)/ew)*.55 + vec3(.42, .78, 1.)*exp(-pow(er + .03, 2.)/ew)*.55 + vec3(.86, .9, 1.)*exp(-max(er, 0.)*7.)*.16)*uWH.w;
  }
  col = col/(1. + col*.5);
  gl_FragColor = vec4(col, 1.);
}`;
// Nubes de Magallanes (nivel 2)
// Nubes de Magallanes: el viaje pasa por sus lugares reales
const FS_LMC =
  BG_COMMON +
  `
uniform float uScale;
float fbm7(vec2 p){ float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 7; i++){ s += a*vn(p); p = m*p; a *= .5; } return s; }
float rid(vec2 p){ float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 5; i++){ s += a*(1. - abs(vn(p)*2. - 1.)); p = m*p; a *= .5; } return s; }
vec3 starsD(vec2 q, float sc, float dens, float bmul){
  vec2 g = q/sc, id = floor(g), f = fract(g); vec3 c = vec3(0.);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 o = vec2(x, y), cid = id + o; float n = h21(cid); if (n > dens) continue;
    vec2 sp = o + h22(cid*1.7); float dd = length(f - sp)*sc;
    float b = (pow(h21(cid + 7.1), 9.)*2.2 + .18)*bmul, tw = .8 + .2*sin(uT*(1. + 3.*n) + n*40.);
    vec3 col = mix(vec3(1., .78, .6), vec3(.72, .84, 1.), h21(cid + 3.3));
    c += col*b*tw*exp(-dd*dd*2.2);
  }
  return c;
}
vec2 sceneD(vec2 q, float drift){ return (q - .5*uRes)/uScale + vec2(.05*sin(uT*.05 + drift*300.), .07*sin(uFlow*drift*1.5 + uT*.04)); }   // se mece sin irse de la pantalla
float win(float j, float a, float b){ return smoothstep(a - .05, a + .05, j)*(1. - smoothstep(b - .05, b + .05, j)); }
vec3 meteors(vec2 q){
  vec3 c = vec3(0.);
  for (int i = 0; i < 3; i++){
    float fi = float(i), per = 5. + fi*2.3, tt = uT + fi*3.7, k = floor(tt/per), ph = fract(tt/per);
    if (ph > .18) continue;
    vec2 a0 = vec2(h21(vec2(k, fi)), .55 + .45*h21(vec2(fi, k + 3.)))*uRes;
    vec2 dir = normalize(vec2(-.8 + 1.6*h21(vec2(k + 9., fi)), -1.));
    vec2 hd = a0 + dir*ph/.18*uRes.y*.7;
    vec2 rel = q - hd; float along = dot(rel, -dir), perp = abs(dot(rel, vec2(-dir.y, dir.x)));
    float L = uRes.y*.18;
    float tr = step(0., along)*(1. - smoothstep(0., L, along))*exp(-perp*perp*.6);
    float fade = sin(ph/.18*3.14159);
    c += vec3(.85, .92, 1.)*tr*fade*.9 + vec3(1.)*exp(-dot(rel, rel)*.25)*fade;

mat2 rot(float a){ return mat2(cos(a), -sin(a), sin(a), cos(a)); }
// polvo luminoso en primer plano, desenfocado, que pasa flotando (da profundidad)
vec3 bokeh(vec2 q){
  vec3 c = vec3(0.); vec2 g = (q + vec2(uT*14., uFlow*9.))/(uRes.y*.22), id = floor(g), f = fract(g);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 o = vec2(x, y), cid = id + o; if (h21(cid + 31.) > .22) continue;
    float rr = .12 + .2*h21(cid + 5.); float dd = length(f - o - h22(cid + 9.));
    vec3 tint = mix(vec3(1., .4, .65), vec3(.45, .7, 1.), h21(cid + 2.));
    c += tint*smoothstep(rr, rr*.75, dd)*(.05 + .04*sin(uT + h21(cid)*20.));

// estrellas que estallan en un destello de vez en cuando
vec3 flares(vec2 q){
  vec3 c = vec3(0.); vec2 g = (q + vec2(0., uFlow*3.))/(uRes.y*.3), id = floor(g), f = fract(g);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 o = vec2(x, y), cid = id + o; float per = 3. + 5.*h21(cid + 3.), ph = fract(uT/per + h21(cid + 7.));
    if (ph > .12) continue;
    float e = sin(ph/.12*3.14159); vec2 pp = (f - o - h22(cid))*uRes.y*.3;

float tone(vec3 c){ return dot(c, vec3(.3, .55, .15)); }
// 1 · la Gran Nube: galaxia irregular, barra de estrellas descentrada, nubes de estrellas y regiones rosadas
vec3 lmcBody(vec2 q){
  vec2 d = rot(.45 + uT*.01)*(sceneD(q, .003) - vec2(0., .18));
  vec2 w = d + .1*vec2(fbm(d*2. + uT*.05), fbm(d*2. + 4. - uT*.04));
  float disk = exp(-length(w*vec2(1., 1.5))*2.)*smoothstep(.2, .55, fbm7(w*2.2 + 1.));
  float bar = exp(-pow((w.x + .12)/.45, 2.) - pow((w.y - .05)/.1, 2.));
  float cl = fbm7(w*7. + 3.)*fbm7(w*16. - uT*.04);
  vec3 col = vec3(.5, .66, 1.)*disk*(.35 + 3.2*cl) + vec3(1., .8, .55)*bar*(.7 + 2.4*cl);
  float h2 = smoothstep(.74, .86, fbm7(w*8. + 9.))*(disk + bar);
  col += vec3(1., .28, .5)*h2*1.8 + vec3(1., .3, .5)*pow(rid(w*9. + uT*.05), 7.)*disk*1.2;
  col *= 1. - .55*smoothstep(.62, .8, rid(w*vec2(5., 9.) + 2.))*(disk + bar);
  col += vec3(.9, .94, 1.)*starsD(q, 2.3, .75*clamp(disk + bar, 0., 1.), .7);
  return col;
}
// 2 · la Nebulosa de la Tarántula (30 Doradus): filamentos rosados que salen de un cúmulo azul gigante (R136)
vec3 tarantula(vec2 q){
  vec2 d = rot(uT*.015)*(sceneD(q, .004) - vec2(-.05, .26));
  vec2 w = d + .08*vec2(fbm(d*3. + uT*.08), fbm(d*3. - uT*.07 + 5.));
  float r = length(w), a = atan(w.y, w.x);
  float legs = pow(rid(vec2(a*2.2 + r*2.5, r*5.) + uT*.03), 3.);
  float fil = pow(rid(w*vec2(7., 9.) + 3. + uT*.05), 6.);
  float env = exp(-r*2.2)*smoothstep(.06, .2, r);
  float gas = fbm7(w*4. + 2.);
  vec3 col = vec3(1., .3, .55)*(legs*2.2 + fil*1.8)*env*(.5 + gas) + vec3(1., .55, .35)*fil*env*.6;
  col += vec3(.95, .2, .3)*gas*exp(-r*1.5)*.45;
  col += vec3(.3, .95, .85)*smoothstep(.45, .8, gas)*exp(-r*4.)*.7;
  col += vec3(.8, .9, 1.)*exp(-r*r*900.)*1.6 + vec3(.6, .8, 1.)*exp(-r*22.)*.25;
  float rays = pow(.5 + .5*cos(a*9. + fbm(vec2(a*2., uT*.2))*5.), 4.)*exp(-r*5.)*smoothstep(.01, .06, r);
  col += vec3(.75, .85, 1.)*rays*(.3 + .15*sin(uT*.8));
  float sw = fract(uT*.22); col += vec3(1., .55, .75)*exp(-pow((r - sw*.7)/.012, 2.))*(1. - sw)*.9;
  col += vec3(.85, .92, 1.)*starsD(q, 2., .9*exp(-r*7.), 1.4);
  return col*(1. + .25*uBeat);
}
// 3 · la superburbuja N44: un anillo de gas inflado por vientos de estrellas jóvenes
vec3 bubble(vec2 q){
  vec2 d = sceneD(q, .005) - vec2(.04, .24);
  vec2 w = d + .06*vec2(fbm(d*4. + uT*.08), fbm(d*4. - uT*.08 + 2.));
  float r = length(w*vec2(1., 1.15))*(1. - .04*sin(uT*.9)), wob = .04*(fbm(vec2(atan(w.y, w.x)*2., uT*.1)) - .5);
  float ring = exp(-pow((r - .22 - wob)/.035, 2.))*(.5 + fbm7(vec2(atan(w.y, w.x)*3., r*9.)));
  float shell = exp(-pow((r - .22 - wob)/.1, 2.));
  float gas = fbm7(w*6. + 4.);
  vec3 col = vec3(1., .3, .5)*ring*(.6 + 1.4*gas)*1.3 + vec3(.9, .25, .35)*shell*gas*.5;
  col += vec3(.25, .85, .9)*smoothstep(.24, .0, r)*fbm7(w*5. + uT*.05)*.5;
  col += vec3(1., .5, .6)*pow(rid(w*8. + uT*.04), 6.)*shell*1.2;
  vec2 b2 = w - vec2(.45, -.3); float r2 = length(b2);

// 4 · la Supernova 1987A: el anillo de perlas brillantes y dos anillos tenues; a un lado, los restos de N49
vec3 supernova(vec2 q){

  vec2 c = (d - vec2(-.12, .3))*1.9;
  vec2 e = rot(.35)*c; e.y /= .55;
  float r = length(e), a = atan(e.y, e.x);
  float beads = pow(.5 + .5*cos(a*16. + uT*.4), 6.);
  float ring = exp(-pow((r - .16)/.01, 2.));

// 5 · el Puente de Magallanes y la Pequeña Nube con NGC 346
vec3 bridge(vec2 q){
  vec2 d = sceneD(q, .005);
