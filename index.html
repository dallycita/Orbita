<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · Prototipo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* base: colores, página y lienzo */
:root {
  --bg: #0d1220;
  --fg: #ece6d8;
  --muted: #8b8f9e;
  --sun: #ff5a1f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1220;
    --fg: #ece6d8;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1220;
  --fg: #ece6d8;
}
html {
  height: 100%;
  background: var(--bg);
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font-family:
    'Unbounded',
    system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#wrap {
  position: relative;
  width: 100%;
  height: 100%;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
@keyframes misRot {
  to {
    transform: rotate(360deg);
  }
}
@keyframes misCore {
  50% {
    opacity: 0.7;
  }
}
/* botones de navegación compartidos: flechas, volver y chips */
.arrow svg.arc {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.arrow .arc path {
  fill: none;
  stroke-linecap: round;
}
.arrow .arc .base {
  stroke: rgba(236, 230, 216, 0.5);
  stroke-width: 1.5;
  transition: stroke 0.25s;
}
.arrow .arc .hot {
  stroke: #ffa155;
  stroke-width: 1.9;
  transform-origin: 26px 26px;
  filter: drop-shadow(0 0 3px rgba(255, 150, 70, 0.75));
  animation: arcBreath 3.2s ease-in-out infinite;
}
.arrow.r.go .arc .hot {
  animation: arcSpinR 0.65s cubic-bezier(0.3, 0.75, 0.3, 1);
}
.arrow.l.go .arc .hot {
  animation: arcSpinL 0.65s cubic-bezier(0.3, 0.75, 0.3, 1);
}
@media (prefers-reduced-motion: reduce) {
  .arrow .arc .hot {
    animation: none !important;
  }
}
.back svg.arc {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.back .arc path {
  fill: none;
  stroke-linecap: round;
}
.back .arc .base {
  stroke: rgba(236, 230, 216, 0.5);
  stroke-width: 1.5;
  transition: stroke 0.25s;
}
.back .arc .hot {
  stroke: #ffa155;
  stroke-width: 1.9;
  transform-origin: 26px 26px;
  filter: drop-shadow(0 0 3px rgba(255, 150, 70, 0.75));
  animation: arcBreath 3.2s ease-in-out infinite;
}
.back.go .arc .hot {
  animation: arcSpinL 0.65s cubic-bezier(0.3, 0.75, 0.3, 1);
}
@media (prefers-reduced-motion: reduce) {
  .back .arc .hot {
    animation: none !important;
  }
}
@keyframes arcBreath {
  50% {
    opacity: 0.55;
  }
}
@keyframes arcSpinR {
  from {
    transform: rotate(0);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes arcSpinL {
  from {
    transform: rotate(0);
  }
  to {
    transform: rotate(-360deg);
  }
}
/* pantalla de inicio */

  #home .sm:hover,
  #home .opt:hover {
    animation: hop 0.35s ease-out forwards;
  }
  #home .bigplay:hover {
    animation: hopbig 0.4s ease-out forwards;
    box-shadow:
      0 0 0 10px rgba(255, 90, 31, 0.2),
      0 0 60px rgba(255, 90, 31, 0.55);
  }
  #home .sm:hover,
  #home .opt:hover {
    border-color: rgba(236, 230, 216, 0.5);
  }
}
#home .playrow {
  display: flex;
  align-items: center;
  gap: 26px;
}
#home .spacer {
  width: 68px;
  height: 68px;
}
#home .plan {
  position: relative;

  height: 68px;
  border-radius: 50%;

  background: radial-gradient(circle at 50% 40%, #1d2440, #0f1426);
  box-shadow:
    0 0 0 2px rgba(143, 208, 255, 0.35),

  align-items: center;
  justify-content: center;
}
#home .plan svg {
  width: 52px;
  height: 52px;
}
#home .plan .orb {
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1.5px dashed rgba(143, 208, 255, 0.5);

}
@media (prefers-reduced-motion: reduce) {
  #home .plan .orb {
    animation: none;
  }
}
#home .plabel {
  position: absolute;
  top: 100%;
  margin-top: 9px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #8fd0ff;
  white-space: nowrap;
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  #home .plan:hover {
    animation: hopbig 0.4s ease-out forwards;
    box-shadow:
      0 0 0 3px rgba(143, 208, 255, 0.6),
      0 0 34px rgba(143, 208, 255, 0.5);
  }
}
#home {

  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;

#home.off {

}
#home > * {

}

}
@media (prefers-reduced-motion: reduce) {
  #home.off > * {
    transform: none;
  }
}
#home.off * {
  pointer-events: none !important;
}
#home button {
  pointer-events: auto;
  font-family: 'Unbounded', system-ui, sans-serif;
  cursor: pointer;
}
#home .bigplay {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  border: 0;
  background: var(--sun);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 8px rgba(255, 90, 31, 0.14),
    0 0 40px rgba(255, 90, 31, 0.35);

}
#home .bigplay:active {
  transform: scale(0.94);
}
#home .bigplay svg {

  height: 40px;

}
#home .playlbl {

  font-size: 14px;
  font-weight: 500;

}
#home .row {
  display: flex;

}
#home .sm {

  padding: 11px 14px;

  border: 1px solid rgba(236, 230, 216, 0.22);

}
#home .sheet {
  position: absolute;
  left: 50%;
  bottom: max(7vh, 44px);
  transform: translateX(-50%);

  flex-direction: column;

  pointer-events: auto;
}
#home .sheet.on {
  display: flex;
}
#home .sheet h3 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 500;
  color: var(--fg);
  text-align: center;
}
#home .sheet .opt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(236, 230, 216, 0.14);
  background: transparent;
  color: var(--fg);
  font-size: 13px;
  font-weight: 400;
}
#home .sheet .opt b {
  font-weight: 500;
  color: var(--muted);
}
#home .sheet .danger {
  color: var(--fg);
}
#home button:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 3px;
}
#home .plan.new::after {
  content: '';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff6b2c;
  box-shadow:
    0 0 0 3px #05070d,
    0 0 10px rgba(255, 107, 44, 0.8);
}
/* botón de Misiones: más pequeño que Planetas, sin borde; las lunas giran y las encendidas respiran */
#home .plan.mis {
  width: 68px;
  height: 68px;
  box-shadow: none;
}
#home .plan.mis svg {
  width: 50px;
  height: 50px;
  filter: none;
  overflow: visible;
}
#home .plan.mis .plabel {
  color: #8fd0ff;
}
#home .plan.mis .lit {
  animation: misLit 2.4s ease-in-out infinite;
}
#home .plan.mis .lit {
  filter: drop-shadow(0 0 2px #ff8a3d);
}
#home .plan.mis.new::after {
  top: 4px;
  right: 4px;
  width: 12px;
  height: 12px;
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  #home .plan.mis:hover {
    box-shadow:
      0 0 0 3px rgba(143, 208, 255, 0.5),
      0 0 26px rgba(143, 208, 255, 0.4);
  }
}
@media (prefers-reduced-motion: reduce) {
  #home .plan.mis .lit {
    animation: none;
  }
}
@keyframes hop {
  0% {
    translate: 0 0;
    scale: 1;
  }
  40% {
    translate: 0 -6px;
    scale: 1.07;
  }
  100% {
    translate: 0 -2px;
    scale: 1.03;
  }
}
@keyframes hopbig {
  0% {
    scale: 1;
  }
  45% {
    scale: 1.1;
  }
  100% {
    scale: 1.05;
  }
}
@keyframes orbspin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes misLit {
  50% {
    filter: drop-shadow(0 0 4px #ff8a3d) drop-shadow(0 0 8px #ff8a3d);
  }
}
/* selector de niveles (galaxias) */
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  #levels .arrow:hover,
  #levels .back:hover,
  #levels .play:not([disabled]):hover {
    animation: hop 0.35s ease-out forwards;
  }
}
#levels .back {
  position: absolute;
  z-index: 3;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(236, 230, 216, 0.22);

  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#levels {

  inset: 0;

  background: #05060c;

  touch-action: pan-x pan-y;

}
#levels .lvbg {

}
#levels .lvshade {

/* botones de navegación: esferas de cristal con una órbita y una pequeña luna */
#levels .back,
#levels .arrow {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  padding: 0;
  color: #eaf3ff;
  background: radial-gradient(
    circle at 34% 28%,
    rgba(255, 255, 255, 0.22),
    rgba(143, 208, 255, 0.08) 38%,
    rgba(8, 12, 24, 0.72) 72%
  );
  border: 1px solid rgba(160, 205, 255, 0.38);
  box-shadow:
    0 0 18px rgba(120, 180, 255, 0.16),
    inset 0 0 14px rgba(143, 208, 255, 0.14);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    opacity 0.2s;

#levels .back::before,
#levels .arrow::before {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1px dashed rgba(160, 205, 255, 0.32);
  animation: navorb 14s linear infinite;
  pointer-events: none;
}
#levels .arrow::after {
  position: absolute;
  top: -8px;
  left: 50%;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: #cfe6ff;
  box-shadow: 0 0 6px #8fd0ff;
  transform-origin: 2.5px 32px;
  animation: navmoon 6s linear infinite;
  pointer-events: none;
}
#levels .arrow.l::after {

@keyframes navorb {
  to {
    transform: rotate(360deg);
  }
}
@keyframes navmoon {
  to {
    transform: rotate(360deg);
  }
}
@keyframes accrete {
  to {
    transform: rotate(360deg);
  }
}
@keyframes accrete2 {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);

@keyframes sigbar {

}

  0% {
    opacity: 0;
  }
  20% {

  }
  28% {

  40% {
    opacity: 0.85;

    opacity: 0.4;
  }

}
@keyframes plDraw {

/* ---------- Misiones ---------- */
#missions {
  position: absolute;
  inset: 0;
  z-index: 6;
  overflow: hidden;
  color: var(--fg);
}
#missions::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(5, 6, 12, 0.18);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: misFade 0.35s ease-out both;
}
#missions .mpanel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  top: calc(max(3vh, 18px) + 62px);
  border-radius: 28px 28px 0 0;
  background: rgba(6, 8, 16, 0.38);
  border-top: 1px solid rgba(236, 230, 216, 0.18);
  -webkit-backdrop-filter: blur(9px) saturate(1.15);
  backdrop-filter: blur(9px) saturate(1.15);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  animation: misUp 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}
#missions.out .mpanel {
  animation: misDown 0.3s ease-in both;
}
#missions.out::before {

@keyframes wpop {
  40% {
    transform: scale(1.25);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes misUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}
@keyframes misDown {
  to {
    transform: translateY(100%);
  }
}
@keyframes misFade {
  from {
    opacity: 0;
  }
}
@keyframes misFlash {
  0% {
    background: rgba(159, 240, 228, 0.28);
    box-shadow: inset 0 0 0 1px rgba(159, 240, 228, 0.6);
  }
  100% {
    background: transparent;
    box-shadow: none;
  }
}
@keyframes misPing {
  0% {
    opacity: 0;
    transform: translateY(-8px) scale(0.7);
  }
  15% {
    opacity: 1;
    transform: none;
  }
  75% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-6px);
  }
}
@keyframes misSwap {
  from {
    opacity: 0;
    transform: translateX(var(--sd, 0));
  }
  to {
    opacity: 1;
    transform: none;
  }
}
/* durante la partida: marcador, estrellas, botón de pausa, "Intento N" */
#wallet {
  position: absolute;
  z-index: 7;
  font-weight: 500;
  font-size: 14px;
  pointer-events: none;
  transition: opacity 0.3s;
}

}
#hud {

}

  margin-left: 0.15em;

  letter-spacing: -0.02em;
}
#best {

#scorewrap {

  place-items: center;
  margin: 0 auto;
}

  width: 112px;
  height: 112px;
}
#arc {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  display: none;
}
#scorewrap.arc #arc {
  display: block;
}
#arc circle {
  fill: none;
  stroke-width: 2.5;
}
#arc .bg {
  stroke: rgba(236, 230, 216, 0.12);
}
#arc .fg {
  stroke: var(--sun);
  stroke-linecap: round;
  stroke-dasharray: 276.5;
  stroke-dashoffset: 276.5;
  transition:
    stroke-dashoffset 0.25s ease-out,
    stroke 0.2s;
}
/* contador de estrellas: sin caja, estrella dentro de un anillo de progreso (como los anillos del juego) */
#wallet {
  display: flex;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  font:
    500 14px 'Unbounded',
    system-ui,
    sans-serif;
  letter-spacing: 0.04em;
}
#wallet .wring {
  width: 28px;
  height: 28px;
  display: block;
  overflow: visible;
}
#wallet .wb {
  fill: none;
  stroke: rgba(255, 211, 107, 0.18);
  stroke-width: 1.5;
}
#wallet .wp {
  fill: none;
  stroke: #ffd36b;
  stroke-width: 1.8;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 14px 14px;
  filter: drop-shadow(0 0 3px rgba(255, 211, 107, 0.7));
  transition: stroke-dasharray 0.6s ease;
}
#wallet .ws {
  fill: #ffd36b;
  filter: drop-shadow(0 0 4px rgba(255, 211, 107, 0.6));
}
#wallet i {
  font-style: normal;
  text-shadow: none;
}
#wallet.full .wring {
  animation: wfull 2.6s ease-in-out infinite;
}
/* contador de estrellas: texto limpio */
#wallet {
  gap: 6px;
  color: #ece6d8;
  text-shadow: none;
  align-items: center;
}
#wallet .wst {
  width: 15px;
  height: 15px;

}

// ---------- "Horizonte de sucesos": la banda sonora del Sistema solar ----------
// La idea: no es una historia de amor, es una persecución. La música tiene dos personajes:
// · el agujero negro: un zumbido enorme que "late" cada vez más rápido, y un motivo de dos notas
// que CAE medio tono,
// como la gravedad, y que se repite cada vez más seguido cuanto más cerca está (como el tiburón de
// Tiburón);
//  · la Tierra: una frase de cristal, frágil, que corre cada vez más rápido para escapar.
// Debajo, un tono que sube sin fin (escala de Shepard): la sensación de que algo se acerca y nunca
// termina.
// Todo con una reverberación de varios segundos, como un espacio inmenso y vacío.
let hzS = null;
function hzEnsure() {
  if (hzS && hzS.ac === AC) {
    return hzS;
  }
  const len = Math.floor(AC.sampleRate * 6.5),
    buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const x = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 3.2) * (i < 400 ? i / 400 : 1);
    }
  }
  const rev = AC.createConvolver();
  rev.buffer = buf;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 3800;
  const out = AC.createGain();
  out.gain.value = 0.85;
  rev.connect(lp);
  lp.connect(out);
  hzS = { ac: AC, rev, shep: 0, drone: null };
  out.connect(hzBus());
  return hzS;
}
function hzOut(node, dry, wet) {
  const a = AC.createGain(),
    b = AC.createGain();
  a.gain.value = dry;
  b.gain.value = wet;
  node.connect(a);
  node.connect(b);
  a.connect(hzBus());
  b.connect(hzEnsure().rev);
}

    g = AC.createGain(),
    lp = AC.createBiquadFilter();

  lp.type = 'lowpass';
  lp.frequency.value = 260;
  lp.Q.value = 3;
  lp.connect(g);

    oA = AC.createOscillator(),

  oB.type = 'sawtooth';

  oS.frequency.value = f / 2;
  sg.gain.value = 0.9;

  oB.connect(lp);
  oS.connect(sg);

function hzShepard(t0, dur, gain, rate) {
  const S = hzEnsure(),
    p0 = S.shep,
    bell = x => Math.exp(-Math.pow((x - 3.5) / 1.25, 2));
  for (let i = 0; i < 7; i++) {
    const x0 = (i + p0) % 7,
      x1 = x0 + rate;
    if (x1 >= 7) {
      continue;
    }
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(55 * Math.pow(2, x0), t0);
    o.frequency.exponentialRampToValueAtTime(55 * Math.pow(2, x1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain * bell(x0), t0 + 0.03);
    g.gain.linearRampToValueAtTime(gain * bell(x1), t0 + dur);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur + 0.04);
    o.connect(g);
    hzOut(g, 0.35, 0.8);
    o.start(t0);
    o.stop(t0 + dur + 0.06);
  }
  S.shep = (p0 + rate) % 7;

  const S = hzEnsure();

  const g = AC.createGain(),
    comp = AC.createDynamicsCompressor(),
    out = AC.createGain();

  comp.knee.value = 8;
  comp.ratio.value = 3.5;

  comp.release.value = 0.25;

  pulse = 1;
  try {
    if (AC && !muted) {
      const n = AC.currentTime;
      [0, 5, 12].forEach((sm, i) =>
        uiTone(
          ROOT *
            Math.pow(
              2,
              (sm +
                {
                  luna: 3,
                  mercurio: 9,
                  venus: 2,
                  marte: -2,
                  jupiter: -5,
                  saturno: 4,
                  urano: 7,
                  neptuno: 10,
                  pluton: -7,
                  sol: 0,
                }[curPlanet] || 0) / 12,
            ),
          n + i * 0.05,
          0.8,
          0.04,
        ),
      );
    }
  } catch (e) {}
  texts = texts.filter(x => !x.tip && x.key !== 'pow' && x.y !== -R0 - 96 && x.y !== -R0 - 76);
  texts.push({
    txt: powerName(),
    x: 0,
    y: -R0 - 96,
    life: 1.4,
    size: 20,
    col: col || '#ffd36b',
    center: true,
    key: 'pow',
  });
}
/**
 * Usa el poder del planeta actual y gasta la carga. Plutón no tiene poder activo: Caronte lo
 * salva solo (ver `caronteSaves`), así que aquí solo avisa si está listo.
 *
 * @param {boolean} mid Verdadero si se usa a mitad de un salto (Marte y Mercurio lo aprovechan).
 */
function usePower(mid) {
  const id = curPlanet;
  if (id === 'pluton') {
    if (!texts.some(x => x.key === 'pow')) {
      texts.push({
        txt: shieldLeft > 0 ? 'Caronte está listo: te salvará una vez' : 'Caronte ya te salvó',
        x: 0,
        y: -R0 - 30,
        life: 1.2,
        size: 13,
        col: '#d9c7b4',
        center: true,
        key: 'pow',
      });
    }
    return;
  }
  charge = 0;
  showHint = false;
  pending = false;
  usedDouble = true;
  noteDouble();
  buzz([15, 30, 25]);
  const nr = rings.get(level + 1);
  if (id === 'marte') {
    // Monte Olimpo: salto triple
    const up = Math.min(3, curGoal() - level);
    if (mid) {
      const p1 = Math.min(jumpT / jumpDur(), 1),
        e1 = 1 - Math.pow(1 - p1, 3);
      jumpT = (1 - Math.cbrt(1 - e1 / up)) * (0.24 + (up - 2) * 0.1);
    } else {
      jumping = true;
      jumpT = 0;
    }
    jumpTarget = up;
    crossed = false;
    pfx.push({ k: 'olimpo', t: 0 });
    noise(0.4, 200, 5000, 0.3, 'bandpass');
    cowbell(SCALE[5] + 12);
    powerShout('#ff8a5c');
  } else if (id === 'luna') {
    // Eclipse: cámara lenta
    eclipseT = 2.5;
    timeScale = 0.42;
    slowTimer = 2.5;
    pfx.push({ k: 'eclipse', t: 0 });
    noise(1.2, 3000, 200, 0.2, 'lowpass');
    powerShout('#dfe6ff');
  } else if (id === 'mercurio') {
    // Perihelio: tus dos siguientes saltos son instantáneos
    periLeft = 2;
    if (mid) {
      periLeft = 1;
      pfx.push({ k: 'destello', t: 0, a: pAng, l0: pLevel });
      jumpT = 99;
      ghostT = 0.15;
    }
    flash = 0.2;
    noise(0.18, 6000, 9000, 0.25, 'highpass');
    cowbell(SCALE[7] + 12);
    powerShout('#ffe9b8');
  } else if (id === 'venus') {
    // Efecto invernadero: derrite los dos asteroides más cercanos del anillo de arriba
    if (nr) {
      const near = nr.obs
        .filter(o => !o.melt && !o.star)
        .map(o => [
          Math.abs(Math.atan2(Math.sin(obsAng(nr, o) - pAng), Math.cos(obsAng(nr, o) - pAng))),
          o,
        ])
        .sort((a, b) => a[0] - b[0])
        .slice(0, 2);
      for (const [, o] of near) {
        o.melt = t;
      }
      nr.heatT = 1;
    }
    pfx.push({ k: 'calor', t: 0 });
    noise(0.9, 400, 2500, 0.3, 'bandpass');
    powerShout('#ffb070');
  } else if (id === 'jupiter') {
    // Empujón gravitacional: aleja al agujero negro
    sunLevel = Math.max(-1.6, sunLevel - 0.4);
    lastEaten = Math.min(lastEaten, Math.floor(sunLevel));
    // El resto del empujón y el temblor del agujero negro llegan con la onda (ver powerUpdate).
    pfx.push({ k: 'empujon', t: 0, a: pAng, l: pLevel, left: 0.8 });
    sub();
    noise(0.8, 2500, 120, 0.4, 'lowpass');
    powerShout('#f0c08a');
  } else if (id === 'saturno') {
    // Anillos protectores: un rato sin choques (shieldT, en segundos)
    shieldT = 1.5;
    pfx.push({ k: 'anillos', t: 0 });
    noise(0.5, 500, 4000, 0.2, 'bandpass');
    cowbell(SCALE[4] + 12);
    powerShout('#f3dfa6');
  } else if (id === 'urano') {
    // Congelar: los dos anillos de arriba se detienen (el segundo, un poco más)
    if (nr) {
      nr.frozenT = 3;
      nr.frz0 = 3;
      nr.frzA = pAng;
      nr.shat = 0;
    }
    {
      const n2 = rings.get(level + 2);
      if (n2) {
        n2.frozenT = 3.6;
        n2.frz0 = 3.6;
        n2.frzA = pAng;
        n2.shat = 0;
      }
    }
    pfx.push({ k: 'hielo', t: 0 });
    noise(0.5, 7000, 2500, 0.18, 'highpass');
    powerShout('#bff0ff');
  } else if (id === 'neptuno') {
    // Predicción: ves dónde estarán los asteroides cuando caigas
    predT = 3;
    pfx.push({ k: 'viento', t: 0 });
    noise(0.6, 2500, 600, 0.2, 'bandpass');
    try {
      if (AC) {
        [0, 7, 12].forEach((sm, i) =>
          uiTone(ROOT * 2 * Math.pow(2, sm / 12), AC.currentTime + i * 0.07, 0.9, 0.035),
        );
      }
    } catch (e) {}
    powerShout('#9cc0ff');
  } else if (id === 'sol') {
    // Arder: 1.5 segundos en los que los asteroides que tocas se vuelven plasma
    burnT = BURN_DUR;
    pfx.push({ k: 'arder', t: 0 });
    flash = 0.25;
    shake = reduceMotion ? 0 : 5;
    sub();
    noise(1.4, 300, 3000, 0.35, 'bandpass');
    powerShout('#ffb347');
  }
}
/**
 * Sol: vaporiza un asteroide que el planeta toca mientras arde (lo marca como fundido, con
 * chispas de plasma, temblor y sonido).
 *
 * @param {object} ring Anillo del asteroide.
 * @param {object} o Asteroide.
 * @param {number} x Posición horizontal del choque, en píxeles de pantalla.
 * @param {number} y Posición vertical del choque, en píxeles de pantalla.
 */
function vaporize(ring, o, x, y) {
  o.melt = t;
  o.burn = 1;
  shake = Math.max(shake, reduceMotion ? 0 : 4);
  flash = Math.max(flash, 0.12);
  buzz([12]);
  const wx = (x - CX) / S,
    wy = (y - CY) / S;
  pfx.push({ k: 'plasma', t: 0, x: wx, y: wy });
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2,
      v = 60 + Math.random() * 190;
    particles.push({
      x: wx,
      y: wy,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: 0.35 + Math.random() * 0.45,
      col: ['#ffffff', '#fff3c4', '#ffd36b', '#ff9a3c', '#ff5a1f'][i % 5],
      s: 1.2 + Math.random() * 2.6,
    });

  noise(0.35, 5000, 400, 0.3, 'lowpass');
}
/**
 * Caronte (Plutón): si algo iba a destruir al planeta con la carga llena, su luna se interpone
 * una sola vez, se rompe en pedazos de hielo y el choque frena al planeta (el agujero negro se
 * acerca).
 *
 * @param {number} x Posición horizontal del planeta, en unidades del mundo (centro en el agujero).
 * @param {number} y Posición vertical del planeta, en unidades del mundo.
 * @param {number} [tx] Posición horizontal de lo que golpea; sin ella, el golpe viene del centro.
 * @param {number} [ty] Posición vertical de lo que golpea, en unidades del mundo.
 * @returns {boolean} Verdadero si Caronte salvó al planeta.
 */
function caronteSaves(x, y, tx, ty) {
  if (tutorial || curPlanet !== 'pluton' || shieldLeft <= 0 || charge < chargeMax()) {
    return false;
  }
  const ta = tx !== undefined ? Math.atan2(ty - y, tx - x) : Math.atan2(-y, -x);
  pfx.push({ k: 'caronte', t: 0, x, y, a: ta, ca: caronteAng() });
  shieldLeft = 0;
  charge = 0;
  ghostT = 0.9;
  sunLevel = Math.min(pLevel - catchMargin() - 0.6, sunLevel + 0.6);
  flash = 0.4;
  shake = reduceMotion ? 0 : 8;
  buzz([30, 20, 60]);
  noise(0.6, 3000, 200, 0.35, 'lowpass'); // el choque te frena: el agujero negro se acerca
  {
    const cx = x + Math.cos(ta) * PR * sizeK() * 1.9,
      // Caronte se rompe en pedazos de hielo (gris, con su polo rojizo)
      cy = y + Math.sin(ta) * PR * sizeK() * 1.9;
    for (let i = 0; i < 46; i++) {
      const a = ta + (Math.random() - 0.5) * 2.6,
        v = 50 + Math.random() * 210;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 0.7 + Math.random() * 0.7,
        col: ['#bdb5ad', '#8e8780', '#e9e4de', '#9a5a46', '#ffffff', '#6f6a66'][i % 6],
        s: i % 4 ? 1 + Math.random() * 1.5 : 2.4 + Math.random() * 2.6,
      });
    }
  }
  texts.push({
    txt: '¡Caronte te salvó!',
    x: 0,
    y: -R0 - 96,
    life: 1.6,
    size: 20,
    col: '#d9c7b4',
    center: true,
  });
  return true;
}
/** Ángulo de Caronte en su órbita alrededor de Plutón, en radianes. */
const caronteAng = () => t * 2.2;
/**

/**
 * Avanza un cuadro los poderes: descuenta sus tiempos, funde los asteroides derretidos, gira los
 * anillos empujados, aplica la onda de Júpiter cuando llega al agujero negro y suelta el polvo
 * del salto triple de Marte.
 *
 * @param {number} dt Tiempo real del cuadro, en segundos (sin la cámara lenta).
 * @param {number} d Tiempo de juego del cuadro, en segundos (no se usa aquí).
 */
function powerUpdate(dt, d) {
  ghostT = Math.max(0, ghostT - dt);
  shieldT = Math.max(0, shieldT - dt);
  burnT = Math.max(0, burnT - dt);
  eclipseT = Math.max(0, eclipseT - dt);
  predT = Math.max(0, predT - dt);
  if (eclipseT > 0 && slowTimer > 0) {
    timeScale = 0.42;
  }
  for (const r of rings.values()) {
    if (r.revT) {
      r.revT = Math.max(0, r.revT - dt * 1.2);
    }
    if (r.windT) {
      r.windT = Math.max(0, r.windT - dt * 1.5);
    }
    if (r.heatT) {
      r.heatT = Math.max(0, r.heatT - dt * 0.9);
    }
    for (const o of r.obs) {
      if (o.melt && !o.gone && t - o.melt > (o.burn ? 0.16 : 0.7)) {
        o.gone = true;
        if (o.burn) {
          continue;
        }
        const R = rr(r.k !== undefined ? r.k : level + 1),
          oa = obsAng(r, o);
        // Gotas de roca fundida que caen hacia el agujero negro.
        for (let i = 0; i < 30; i++) {
          const a = Math.random() * Math.PI * 2,
            v = 15 + Math.random() * 70;
          particles.push({
            x: Math.cos(oa) * R,
            y: Math.sin(oa) * R,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            life: 0.9 + Math.random() * 0.8,
            col: ['#fff1c0', '#ffb347', '#ff6a2a', '#d23a10', '#7a7068'][i % 5],
            s: 1.5 + Math.random() * 3,
          });
        }
      }
    }
    if (r.spin) {
      r.spin.t += dt / 0.4;
      const u = Math.min(1, r.spin.t),
        e = 1 - Math.pow(1 - u, 3);
      r.off = r.spin.from + (r.spin.to - r.spin.from) * e;
      if (u >= 1) {
        r.spin = null;
      }
    }
  }
  for (const f of pfx) {
    f.t += dt;
    if (f.k === 'empujon' && f.t >= 0.42 && f.left > 0) {
      // la magnetosfera llega al agujero negro y lo empuja
      if (!f.hit) {
        f.hit = 1;
        holeFlare = 1;
        bhWob = 1;
        shake = reduceMotion ? 0 : 10;
        sub();
        noise(0.7, 1800, 90, 0.35, 'lowpass');
      }
      const q = Math.min(f.left, dt * 2.8);
      f.left -= q;
      sunLevel = Math.max(-1.6, sunLevel - q);
      lastEaten = Math.min(lastEaten, Math.floor(sunLevel));
    }
    if (f.k === 'arder' && burnT > 0) {
      f.t = Math.min(f.t, 0.5);
    }
  }
  pfx = pfx.filter(f => f.t < (f.k === 'arder' ? 1.2 : f.k === 'viento' ? 3.2 : 1.6));
  bhWob = Math.max(0, bhWob - dt * 1.1);
  if (jumping && jumpTarget === 3 && state === 'play' && Math.random() < 0.9) {
    // Marte: la tormenta de polvo que deja el salto
    const pr = rr(pLevel),
      x = Math.cos(pAng) * pr,
      y = Math.sin(pAng) * pr,
      a = pAng + Math.PI + (Math.random() - 0.5) * 1.2,
      v = 20 + Math.random() * 60;
    particles.push({
      x,
      y,
      vx: Math.cos(a) * v + (Math.random() - 0.5) * 40,
      vy: Math.sin(a) * v + (Math.random() - 0.5) * 40,
      life: 0.8 + Math.random() * 0.7,
      col: ['#c8573a', '#e0866a', '#8f3a24', '#f0b090'][Math.floor(Math.random() * 4)],
      s: 2 + Math.random() * 3.5,
    });
  }
}
// ---- Efectos de los poderes sobre el planeta ----

/**
 * Número pseudoaleatorio fijo para cada par (i, k): da variaciones estables entre cuadros.
 *
 * @param {number} i Índice del elemento.
 * @param {number} k Canal (otro valor distinto para el mismo elemento).
 * @returns {number} Valor de 0 a 1.
 */
const hsh = (i, k) => frac(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453);
/** Transición suave (smoothstep) de 0 a 1 cuando x va de a a b. */
const smst = (a, b, x) => {
  const u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
};
/** @returns {number[]} Posición [x, y] del planeta, en píxeles de pantalla. */
function plPos() {
  const pr = rr(pLevel) * S;
  return [CX + Math.cos(pAng) * pr, CY + Math.sin(pAng) * pr];
}
/**
 * Traza un copo de hielo: estrella de seis puntas con el trazo actual.
 *
 * @param {number} x Centro horizontal, en píxeles de pantalla.
 * @param {number} y Centro vertical, en píxeles de pantalla.
 * @param {number} s Largo de cada brazo, en píxeles de pantalla.
 * @param {number} rot Giro, en radianes.
 */
function flake(x, y, s, rot) {
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = rot + (i * Math.PI) / 3,
      c = Math.cos(a) * s,
      d = Math.sin(a) * s;
    ctx.moveTo(x - c, y - d);
    ctx.lineTo(x + c, y + d);
  }
  ctx.stroke();
}
/**
 * Dibuja el aire que tiembla por el calor alrededor del planeta (tres contornos ondulados).
 *
 * @param {number} px Centro horizontal del planeta, en píxeles de pantalla.
 * @param {number} py Centro vertical del planeta, en píxeles de pantalla.
 * @param {number} r Radio del planeta, en píxeles de pantalla.
 * @param {string} col Color del trazo, en CSS.
 * @param {number} k Intensidad, de 0 a 1.
 */
function heatHaze(px, py, r, col, k) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = k * (0.22 - i * 0.05);
    ctx.strokeStyle = col;
    ctx.beginPath();
    for (let j = 0; j <= 48; j++) {
      const th = (j / 48) * Math.PI * 2,
        rq =
          r * (1.22 + 0.16 * i) +
          Math.sin(th * 7 + t * 13 + i * 2) * r * 0.045 +
          Math.sin(th * 3 - t * 9) * r * 0.03;
      j
        ? ctx.lineTo(px + Math.cos(th) * rq, py + Math.sin(th) * rq)
        : ctx.moveTo(px + Math.cos(th) * rq, py + Math.sin(th) * rq);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
}
/**
 * Júpiter: auroras en sus dos polos (las más potentes del sistema solar, que Hubble ve en
 * ultravioleta), con la huella de Ío.
 *
 * @param {number} px Centro horizontal del planeta, en píxeles de pantalla.
 * @param {number} py Centro vertical del planeta, en píxeles de pantalla.
 * @param {number} r Radio del planeta, en píxeles de pantalla.
 * @param {number} tt Tiempo desde que se usó el poder, en segundos.
 */
function drawAurora(px, py, r, tt) {
  const k = Math.min(1, tt / 0.12) * Math.min(1, (1.4 - tt) / 0.5);
  if (k <= 0) {
    return;
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const pole of [-1, 1]) {
    const cy = py + pole * r * 0.84,
      w = pole < 0 ? 1 : 0.8,
      fl = 0.75 + 0.25 * Math.sin(t * 23 + pole * 3) * Math.sin(t * 7.7);
    const g = ctx.createRadialGradient(px, cy, 0, px, cy, r * 0.95);
    g.addColorStop(0, 'rgba(190,170,255,' + 0.55 * k * w * fl + ')');
    g.addColorStop(0.5, 'rgba(120,110,255,' + 0.22 * k * w + ')');
    g.addColorStop(1, 'rgba(90,80,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, cy, r * 0.95, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 22; i++) {
      // cortinas de luz que suben desde el óvalo
      const th = (i / 22) * Math.PI * 2,
        ox = px + Math.cos(th) * r * 0.42,
        oy = cy + Math.sin(th) * r * 0.11,
        h = r * (0.06 + 0.14 * hsh(i, pole)) * (0.6 + 0.4 * Math.sin(t * 17 + i * 1.7));
      ctx.globalAlpha = 0.28 * k * w;
      ctx.strokeStyle = i % 3 ? '#9b8cff' : '#d6ccff';
      ctx.lineWidth = Math.max(1.5, r * 0.12);
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox, oy + pole * h);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.35 * k * w * fl;
    ctx.strokeStyle = '#b7a8ff';
    ctx.lineWidth = Math.max(2, r * 0.16);
    ctx.beginPath();
    ctx.ellipse(px, cy, r * 0.42, r * 0.11, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.8 * k * w * fl;
    ctx.strokeStyle = '#efe9ff';
    ctx.lineWidth = Math.max(0.8, r * 0.04);
    ctx.beginPath();
    ctx.ellipse(px, cy, r * 0.42, r * 0.11, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.8 * k * w;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px + r * 0.55, cy + pole * r * 0.03, Math.max(1, r * 0.05), 0, Math.PI * 2);
    ctx.fill(); // la huella de Ío
  }
  ctx.restore();
}
/**
 * Sol: corona, protuberancias y viento solar mientras arde.
 *
 * @param {number} px Centro horizontal del planeta, en píxeles de pantalla.
 * @param {number} py Centro vertical del planeta, en píxeles de pantalla.
 * @param {number} r Radio del planeta, en píxeles de pantalla.
 */
function drawSolarFire(px, py, r) {
  let k = Math.min(1, (BURN_DUR - burnT) / 0.2, 0.3 + burnT / 0.6);
  // Parpadea cuando se va a apagar.
  if (burnT < 0.45) {
    k *= 0.72 + 0.28 * Math.sin(t * 28);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  const g = ctx.createRadialGradient(px, py, r * 0.98, px, py, r * 3.6);
  g.addColorStop(0, 'rgba(255,214,140,' + 0.42 * k + ')');
  g.addColorStop(0.2, 'rgba(255,150,60,' + 0.16 * k + ')');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(px, py, r * 3.6, 0, Math.PI * 2);
  ctx.arc(px, py, r * 0.98, 0, Math.PI * 2, true);
  ctx.fill('evenodd');
  for (let i = 0; i < 7; i++) {
    // serpentinas de la corona: largas, suaves y desiguales
    const a = (i / 7) * Math.PI * 2 + t * 0.12 + hsh(i, 1) * 0.7,
      L = r * (1.6 + 2.2 * hsh(i, 2)) * (1 + 0.1 * Math.sin(t * 2.3 + i)),
      w = r * (0.35 + 0.25 * hsh(i, 3));
    const gg = ctx.createLinearGradient(
      px + Math.cos(a) * r,
      py + Math.sin(a) * r,
      px + Math.cos(a) * (r + L),
      py + Math.sin(a) * (r + L),
    );
    gg.addColorStop(0, 'rgba(255,226,170,' + 0.22 * k + ')');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a - w / r) * r, py + Math.sin(a - w / r) * r);
    ctx.lineTo(px + Math.cos(a) * (r + L), py + Math.sin(a) * (r + L));
    ctx.lineTo(px + Math.cos(a + w / r) * r, py + Math.sin(a + w / r) * r);
    ctx.closePath();
    ctx.fill();
  }
  for (let i = 0; i < 5; i++) {
    // protuberancias: arcos de plasma que salen del borde y vuelven a caer
    const a0 = (i / 5) * Math.PI * 2 + t * 0.25 + hsh(i, 5),
      sp = 0.3 + 0.22 * hsh(i, 6),
      h = r * (0.3 + 0.4 * hsh(i, 7)) * (0.7 + 0.3 * Math.sin(t * 1.9 + i * 2));
    const x1 = px + Math.cos(a0 - sp) * r * 0.97,
      y1 = py + Math.sin(a0 - sp) * r * 0.97,
      x2 = px + Math.cos(a0 + sp) * r * 0.97,
      y2 = py + Math.sin(a0 + sp) * r * 0.97;
    const c1x = px + Math.cos(a0 - sp * 0.5) * (r + h * 1.35),
      c1y = py + Math.sin(a0 - sp * 0.5) * (r + h * 1.35),
      c2x = px + Math.cos(a0 + sp * 0.7) * (r + h * 1.2),
      c2y = py + Math.sin(a0 + sp * 0.7) * (r + h * 1.2);
    for (const [lw, col, al] of [
      [r * 0.34, '#ff5a2a', 0.3],
      [r * 0.15, '#ff7a3c', 0.85],
      [r * 0.05, '#ffd2a0', 0.9],
    ]) {
      ctx.globalAlpha = al * k;
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.8, lw);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(c1x, c1y, c2x, c2y, x2, y2);
      ctx.stroke();
    }
  }
  ctx.restore();
  if (Math.random() < 0.8 * k) {
    const a = Math.random() * Math.PI * 2,
      v = 90 + Math.random() * 90,
      wx = (px - CX) / S,
      wy = (py - CY) / S,
      rs = r / S; // viento solar
    particles.push({
      x: wx + Math.cos(a) * rs * 1.05,
      y: wy + Math.sin(a) * rs * 1.05,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: 0.4 + Math.random() * 0.4,
      col: Math.random() < 0.5 ? '#fff1c0' : '#ffb347',
      s: 0.8 + Math.random() * 1.2,
    });
  }
}
/**
 * Mercurio: su cola de sodio real (amarillo anaranjado, a 589 nm), más larga que la Tierra,
 * apuntando lejos del agujero negro, con un punto de luz por cada salto instantáneo que queda.
 *
 * @param {number} px Centro horizontal del planeta, en píxeles de pantalla.
 * @param {number} py Centro vertical del planeta, en píxeles de pantalla.
 * @param {number} r0 Radio del planeta, en píxeles de pantalla (se usa al menos 7 unidades).
 */
function drawSodiumTail(px, py, r0) {
  const r = Math.max(r0, 7 * S),
    a = Math.atan2(py - CY, px - CX),
    L = r * (13 + Math.sin(t * 5) * 0.6),
    bend = r * 2.6;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(a);
  ctx.globalCompositeOperation = 'lighter';
  const yc = x => bend * Math.pow(x / L, 2);
  for (const [w0, w1, len, c0, al] of [
    [r * 1.1, r * 3.6, 1, '255,175,70', 0.2],
    [r * 0.7, r * 1.4, 0.75, '255,200,105', 0.32],
    [r * 0.32, r * 0.1, 0.4, '255,244,205', 0.7],
  ]) {
    const LL = L * len,
      gg = ctx.createLinearGradient(0, 0, LL, 0);
    gg.addColorStop(0, 'rgba(' + c0 + ',' + al + ')');
    gg.addColorStop(1, 'rgba(' + c0 + ',0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    for (let j = 0; j <= 20; j++) {
      const x = (LL * j) / 20,
        w = w0 + ((w1 - w0) * j) / 20;
      j ? ctx.lineTo(x, yc(x) - w / 2) : ctx.moveTo(x, yc(x) - w / 2);
    }
    for (let j = 20; j >= 0; j--) {
      const x = (LL * j) / 20,
        w = w0 + ((w1 - w0) * j) / 20;
      ctx.lineTo(x, yc(x) + w / 2);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.lineWidth = 1;
  if (ctx.setLineDash) {
    ctx.setLineDash([r * 0.6, r * 0.9]);
  } // átomos de sodio que corren por la cola
  for (let i = 0; i < 4; i++) {
    const sp = (i - 1.5) * r * 0.3;
    ctx.lineDashOffset = -t * r * 14 - i * r * 0.5;
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#ffe2a0';
    ctx.beginPath();
    for (let j = 0; j <= 12; j++) {
      const x = (L * 0.9 * j) / 12;
      j ? ctx.lineTo(x, yc(x) + sp * (1 + (x / L) * 3)) : ctx.moveTo(x, yc(x) + sp);
    }
    ctx.stroke();
  }
  if (ctx.setLineDash) {
    ctx.setLineDash([]);
  }
  ctx.restore();
  heatHaze(px, py, r0, '#fff0d0', 0.9);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < periLeft; i++) {
    const b = t * 7 + i * Math.PI,
      x = px + Math.cos(b) * r * 1.55,
      y = py + Math.sin(b) * r * 1.55; // un punto de luz por cada salto instantáneo que te queda
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 0.5);
    g.addColorStop(0, 'rgba(255,255,255,.95)');
    g.addColorStop(0.3, 'rgba(255,214,120,.6)');
    g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
// ---- Caronte: la luna gris de Plutón, con su polo rojizo (Mordor Macula); mide la mitad que
// Plutón ----

/**
 * Posición de Caronte en su órbita inclinada alrededor de Plutón.
 *
 * @param {number} px Centro horizontal de Plutón, en píxeles de pantalla.
 * @param {number} py Centro vertical de Plutón, en píxeles de pantalla.
 * @param {number} r Radio de la órbita, en píxeles de pantalla.
 * @returns {number[]} [x, y, z]: posición en píxeles y profundidad (z < 0: detrás de Plutón).
 */
function caronteXY(px, py, r) {
  const a = caronteAng(),
    x = Math.cos(a) * r * 2.4,
    y = Math.sin(a) * r * 0.7;
  return [
    px + x * Math.cos(0.25) - y * Math.sin(0.25),
    py + x * Math.sin(0.25) + y * Math.cos(0.25),
    Math.sin(a),
  ];
}
/**
 * Dibuja Caronte con el planeta en WebGL (textura de la Luna) o un círculo si no hay WebGL, y le
 * pinta encima su polo rojizo.
 *
 * @param {number} cx Centro horizontal, en píxeles de pantalla.
 * @param {number} cy Centro vertical, en píxeles de pantalla.
 * @param {number} cr Radio, en píxeles de pantalla.
 * @param {number} al Opacidad, de 0 a 1.
 */
function drawCaronte(cx, cy, cr, al) {
  ctx.save();
  ctx.globalAlpha = al;
  let res = null;
  try {
    if (PLGL.ok()) {
      res = PLGL.render(
        'luna',
        2 * cr * 2,
        t * 0.3,
        [-Math.cos(pAng) * 0.8, Math.sin(pAng) * 0.8, 0.6],
        [1.3, 1.18, 1.08],
        t,
      );
    }
  } catch (e) {
    res = null;
  }
  if (res) {
    const h = cr * res.pad;
    ctx.drawImage(res.cv, cx - h, cy - h, 2 * h, 2 * h);
  } else {
    ctx.fillStyle = '#a99a8c';
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, cr * 0.98, 0, Math.PI * 2);
  ctx.clip();
  const g = ctx.createRadialGradient(cx, cy - cr * 0.85, 0, cx, cy - cr * 0.85, cr * 0.75);
  g.addColorStop(0, 'rgba(120,52,36,.65)');
  g.addColorStop(1, 'rgba(120,52,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
  ctx.fillStyle = 'rgba(150,150,160,.12)';
  ctx.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
  ctx.restore();
}
/** @returns {boolean} Verdadero si Caronte está listo para salvar a Plutón y debe verse. */
function caronteOn() {
  return (
    curPlanet === 'pluton' &&
    shieldLeft > 0 &&
    charge >= chargeMax() &&

    state === 'play'

}
/**
 * Dibuja la órbita de Caronte y, si está en la mitad que pasa detrás de Plutón, la luna. Se
 * llama antes de dibujar el planeta; la mitad de delante la dibuja `drawPowerFx`.
 *
 * @param {number} px Centro horizontal de Plutón, en píxeles de pantalla.
 * @param {number} py Centro vertical de Plutón, en píxeles de pantalla.

function drawCaronteBack(px, py) {
  if (!caronteOn()) {
    return;

  const r = PR * S * 1.15 * sizeK(),
    [cx, cy, z] = caronteXY(px, py, r);

  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = '#d9c7b4';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(px, py, r * 2.4, r * 0.7, 0.25, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  if (z < 0) {
    drawCaronte(cx, cy, r * 0.62, 1);

/**
 * Dibuja los efectos de los poderes sobre el planeta y a su alrededor (encendido, hielo, erupción,

 *
 * @param {number} px Centro horizontal del planeta, en píxeles de pantalla.
 * @param {number} py Centro vertical del planeta, en píxeles de pantalla.
 * @param {number} rad Radio base del planeta, en píxeles de pantalla (sin su factor de tamaño).

function drawPowerFx(px, py, rad) {
  const r = rad * sizeK();
  for (const f of pfx) {
    if (f.k === 'ignite' && f.t < 0.6) {
      // encendido: destello, anillo y rayos del color del planeta
      const u = f.t / 0.6,
        e = 1 - Math.pow(1 - u, 3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(px, py, 0, px, py, r * (2 + 4 * e));
      g.addColorStop(0, 'rgba(255,255,255,' + 0.7 * (1 - u) + ')');
      g.addColorStop(0.35, rgba(f.col, 0.45 * (1 - u)));
      g.addColorStop(1, rgba(f.col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r * (2 + 4 * e), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = (1 - u) * 0.7;
      ctx.strokeStyle = f.col;
      ctx.lineWidth = 1.5 * (1 - u) + 0.5;
      ctx.beginPath();
      ctx.arc(px, py, r * (1.3 + 5 * e), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      if (!f.sp) {
        f.sp = 1;
        const wx = (px - CX) / S,
          wy = (py - CY) / S;
        for (let i = 0; i < 22; i++) {
          const a = Math.random() * Math.PI * 2,
            v = 50 + Math.random() * 120;
          particles.push({
            x: wx,
            y: wy,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            life: 0.5 + Math.random() * 0.5,
            col: i % 3 ? f.col : '#ffffff',
            s: 1.2 + Math.random() * 1.8,
          });
        }
      }
    } else if (f.k === 'empujon' && f.t < 1.4) {
      drawAurora(px, py, r, f.t);
    } else if (f.k === 'hielo' && f.t < 0.8) {

        e = 1 - Math.pow(1 - u, 3),
        R = r * (1.2 + 5 * e);

      ctx.globalAlpha = (1 - u) * 0.8;
      ctx.strokeStyle = '#dff6ff';
      ctx.lineWidth = 2 * (1 - u) + 0.6;
      ctx.beginPath();
      ctx.arc(px, py, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;

        const a = (i / 9) * Math.PI * 2 + hsh(i, 9);

          py + Math.sin(a) * R,

      ctx.restore();

        L = r * (3 + 6 * u);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, 0, L, 0);
      g.addColorStop(0, 'rgba(255,215,160,' + 0.95 * (1 - u) + ')');
      g.addColorStop(0.35, 'rgba(235,105,60,' + 0.75 * (1 - u) + ')');
      g.addColorStop(1, 'rgba(140,40,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.6);
      ctx.quadraticCurveTo(L * 0.5, -r * (1 + 1.6 * u), L, -r * (2 + 2 * u));

      ctx.fill();
      ctx.restore();

    }

      const g = ctx.createRadialGradient(
        px + Math.cos(a) * r * 0.5,

        px,
        py,
        r * 1.7,
      );
      g.addColorStop(0, 'rgba(255,220,160,' + 0.6 * k + ')');
      g.addColorStop(0.5, 'rgba(255,110,40,' + 0.45 * k + ')');
      g.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r * 1.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = k;
      ctx.strokeStyle = '#ffd9a0';
      ctx.lineWidth = 1.5 + 2.5 * k;
      ctx.beginPath();
      ctx.arc(px, py, r * (1.05 + 0.05 * Math.sin(t * 30)), a - 1.3, a + 1.3);
      ctx.stroke();
      ctx.restore();

        ctx.strokeStyle = 'rgba(60,15,5,.9)';
        ctx.lineWidth = 0.9;
        ctx.lineJoin = 'round';
        for (let i = 0; i < 3; i++) {

        ctx.strokeStyle = 'rgba(255,170,90,.6)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();

      if (Math.random() < k * frag * 0.9) {

          wy = (py - CY) / S,
          b = a + (Math.random() - 0.5) * 1.6;
        particles.push({
          x: wx + Math.cos(b) * PR * sizeK(),
          y: wy + Math.sin(b) * PR * sizeK(),
          vx: Math.cos(a) * 40 + (Math.random() - 0.5) * 30,
          vy: Math.sin(a) * 40 + (Math.random() - 0.5) * 30,
          life: 0.6 + Math.random() * 0.4,
          col: Math.random() < 0.5 ? '#ff8a4d' : curP().col || '#cfc6bb',
          s: 1.2 + Math.random() * 1.8,

    drawSolarFire(px, py, r);
  }
  if (shieldT > 0) {
    // Saturno: los anillos (dibujados con el planeta) dejan un brillo frío de hielo
    const al = Math.min(1, shieldT / 0.35, (1.5 - shieldT) / 0.2);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(px, py, r, px, py, r * 3.6);
    g.addColorStop(0, 'rgba(255,240,205,' + 0.16 * al + ')');
    g.addColorStop(1, 'rgba(255,240,205,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, r * 3.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawSodiumTail(px, py, r);

    // Mercurio: brillo de "intocable"
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, ghostT * 3) * 0.7;
    ctx.strokeStyle = '#fff3d6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, r * 1.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (caronteOn()) {
    const [cx, cy, z] = caronteXY(px, py, r);
    if (z >= 0) {
      drawCaronte(cx, cy, r * 0.62, 1);

  }
}
/**

function drawPowerScene() {

        e = 1 - Math.pow(1 - Math.min(1, f.t / 0.4), 3),
        k = Math.min(1, f.t / 0.06) * Math.min(1, (1.4 - f.t) / 0.55);
      const bx = CX - px,

        const L = Ls[li] * r * (0.25 + 0.75 * e);
        for (const sd of [-1, 1]) {
          const pts = [];
          for (let j = 0; j <= 36; j++) {
            const th = 0.2 + ((Math.PI - 0.4) * j) / 36,
              rho = L * Math.pow(Math.sin(th), 2),
              x = sd * rho * Math.sin(th),
              y = -rho * Math.cos(th),
              d = Math.hypot(x, y) || 1,
              dot = (x * ux + y * uy) / d,
              sc = dot > 0 ? 1 - 0.42 * dot : 1 + 0.9 * -dot * Math.min(1, li / 2.5);
            pts.push([px + x * sc, py + y * sc]);
          }
          for (const [lw, al] of [
            [4, 0.07],
            [1.2, 0.42],
          ]) {
            ctx.globalAlpha = al * k * (1 - li * 0.1);
            ctx.strokeStyle = li % 2 ? '#a99cff' : '#8fb4ff';
            ctx.lineWidth = lw;

    cg.addColorStop(0.3, 'rgba(190,205,255,' + 0.25 * cover * k + ')');
    cg.addColorStop(1, 'rgba(160,180,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(CX, CY, mr * 2.6, 0, Math.PI * 2);
    ctx.fill(); // la corona
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + hsh(i, 8) * 0.6 + t * 0.05,
        l = mr * (1.5 + 1.3 * hsh(i, 5)),
        w = 0.16 + 0.14 * hsh(i, 6); // serpentinas de la corona: suaves y de largos distintos
      const gg = ctx.createLinearGradient(
        CX + Math.cos(a) * mr,
        CY + Math.sin(a) * mr,
        CX + Math.cos(a) * l,
        CY + Math.sin(a) * l,
      );
      gg.addColorStop(0, 'rgba(235,240,255,' + 0.4 * cover * k + ')');
      gg.addColorStop(1, 'rgba(200,215,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a - w) * mr, CY + Math.sin(a - w) * mr);
      ctx.quadraticCurveTo(
        CX + Math.cos(a) * mr * 1.2,
        CY + Math.sin(a) * mr * 1.2,
        CX + Math.cos(a) * l,
        CY + Math.sin(a) * l,
      );
      ctx.quadraticCurveTo(
        CX + Math.cos(a) * mr * 1.2,
        CY + Math.sin(a) * mr * 1.2,
        CX + Math.cos(a + w) * mr,
        CY + Math.sin(a + w) * mr,
      );
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = k;
    let res = null;
    try {
      res = PLGL.ok()
        ? PLGL.render('luna', mr * 2 * 1.4, t * 0.1, [0, 0, -1], [0.25, 0.27, 0.35], t)
        : null;
    } catch (e) {
      res = null;
    } // la Luna a contraluz: solo se ve su borde
    if (res) {
      const h = mr * res.pad;
      ctx.drawImage(res.cv, mx - h, my - h, 2 * h, 2 * h);
    }
    ctx.fillStyle = 'rgba(6,7,14,.93)';
    ctx.beginPath();
    ctx.arc(mx, my, mr * 0.995, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(220,230,255,' + 0.6 * k + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.stroke();
    const chrom = (1 - smst(0.05, 0.4, dn)) * k;
    if (chrom > 0.01) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(mx, my, mr * 0.99, 0, Math.PI * 2, true);
      ctx.clip('evenodd'); // la cromosfera: un borde rosado que se ve un instante
      ctx.globalAlpha = 0.7 * chrom;
      ctx.strokeStyle = '#ff6f9a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(CX, CY, mr * 0.995, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = hsh(i, 6) * Math.PI * 2,
          h = mr * (0.06 + 0.06 * hsh(i, 7));
        ctx.globalAlpha = 0.8 * chrom;
        ctx.strokeStyle = '#ff5a86';
        ctx.lineWidth = 2; // pequeñas protuberancias rosadas
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(a - 0.05) * mr, CY + Math.sin(a - 0.05) * mr);
        ctx.quadraticCurveTo(
          CX + Math.cos(a) * (mr + h * 2),
          CY + Math.sin(a) * (mr + h * 2),
          CX + Math.cos(a + 0.05) * mr,
          CY + Math.sin(a + 0.05) * mr,
        );
        ctx.stroke();
      }
      ctx.restore();
    }
    if (dist > 1) {
      const a0 = Math.atan2(CY - my, CX - mx),
        bx = CX + Math.cos(a0) * mr * 0.99,
        by = CY + Math.sin(a0) * mr * 0.99;
      const bd = smst(0.03, 0.08, dn) * (1 - smst(0.16, 0.27, dn)) * k,
        dd = smst(0.11, 0.2, dn) * (1 - smst(0.36, 0.58, dn)) * k;
      for (let j = 0; j < 6; j++) {
        if (bd <= 0.01) {

        }
        const a = a0 + (j - 2.5) * 0.1,
          fl = 0.6 + 0.4 * Math.sin(t * 40 + j * 2.3);
        if (hsh(j, 11) < 0.25) {
          continue;
        } // las perlas de Baily: luz que pasa entre las montañas de la Luna
        const x = CX + Math.cos(a) * mr * 0.99,
          y = CY + Math.sin(a) * mr * 0.99,
          g = ctx.createRadialGradient(x, y, 0, x, y, 7 * S);
        g.addColorStop(0, 'rgba(255,255,255,' + bd * fl + ')');
        g.addColorStop(1, 'rgba(255,240,220,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 7 * S, 0, Math.PI * 2);
        ctx.fill();
      }
      if (dd > 0.01) {
        const g = ctx.createRadialGradient(bx, by, 0, bx, by, mr * 1.3);
        g.addColorStop(0, 'rgba(255,255,255,' + dd + ')');
        g.addColorStop(0.12, 'rgba(255,250,235,' + 0.55 * dd + ')');
        g.addColorStop(1, 'rgba(230,235,255,0)'); // el anillo de diamante
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bx, by, mr * 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineCap = 'round';
        for (let j = 0; j < 4; j++) {
          const a = (j * Math.PI) / 2 + 0.3,
            L = mr * (j % 2 ? 0.8 : 1.3) * dd;
          ctx.globalAlpha = 0.85 * dd;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(bx - Math.cos(a) * L, by - Math.sin(a) * L);
          ctx.lineTo(bx + Math.cos(a) * L, by + Math.sin(a) * L);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}
/**
 * Dibuja cómo se ve un anillo afectado por un poder: escarcha de Urano, flechas de Venus o
 * ráfagas de Neptuno.
 *
 * @param {object} ring Anillo (usa frozenT, revT y windT).
 * @param {number} R Radio del anillo, en unidades del mundo.
 * @param {number} alpha Opacidad del anillo, de 0 a 1.
 */
function drawRingPower(ring, R, alpha) {
  const Rs = R * S;
  if (ring.frozenT > 0) {
    // Urano: la escarcha nace donde estás y crece por el anillo en cristales; al final se agrieta y
    // se rompe
    const el = (ring.frz0 || 3) - ring.frozenT - ((ring.frz0 || 3) > 3.3 ? 0.18 : 0),
      gr = clamp(el / 0.55, 0, 1),
      span = Math.PI * (1 - Math.pow(1 - gr, 2)),
      c = ring.frzA !== undefined ? ring.frzA : pAng,
      kk = Math.min(1, ring.frozenT / 0.25) * alpha;
    if (span > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.28 * kk;
      ctx.strokeStyle = '#9fdcff';
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(CX, CY, Rs, c - span, c + span);
      ctx.stroke();
      ctx.globalAlpha = 0.9 * kk;
      ctx.strokeStyle = '#effbff';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(CX, CY, Rs, c - span, c + span);
      ctx.stroke();
      ctx.globalAlpha = 0.35 * kk;
      ctx.lineWidth = 0.8;
      for (const d of [-4.5, 4.5]) {
        ctx.beginPath();
        ctx.arc(CX, CY, Rs + d * S * 0.6, c - span, c + span);
        ctx.stroke();
      }
      if (gr < 1) {
        for (const sd of [-1, 1]) {
          const a = c + sd * span,
            x = CX + Math.cos(a) * Rs,
            y = CY + Math.sin(a) * Rs,
            g = ctx.createRadialGradient(x, y, 0, x, y, 14);
          g.addColorStop(0, 'rgba(255,255,255,' + 0.9 * kk + ')');
          g.addColorStop(1, 'rgba(180,230,255,0)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, 14, 0, Math.PI * 2);
          ctx.fill();
        }
      } // el borde de la escarcha que avanza
      ctx.lineWidth = 1.1;
      for (let i = 0; i < 70; i++) {
        const da = (hsh(i, 1) * 2 - 1) * Math.PI,
          la = clamp((span - Math.abs(da)) / 0.35, 0, 1);
        if (la <= 0) {
          continue;
        } // cristales: una aguja con ramas a 60°, como la escarcha real
        const a = c + da,
          x = CX + Math.cos(a) * Rs,
          y = CY + Math.sin(a) * Rs,
          nx = Math.cos(a),
          ny = Math.sin(a),
          side = hsh(i, 2) < 0.5 ? -1 : 1,
          len = (6 + 12 * hsh(i, 3)) * S * 0.6 * la;
        if (i % 6 === 0) {
          ctx.globalAlpha = 0.8 * kk;
          ctx.strokeStyle = '#ffffff';
          flake(x + nx * side * len * 0.5, y + ny * side * len * 0.5, len * 0.45, hsh(i, 4) * 3);
          continue;
        }
        const tw = (hsh(i, 5) - 0.5) * 0.9,
          ex = x + (nx * Math.cos(tw) - ny * Math.sin(tw)) * side * len,
          ey = y + (ny * Math.cos(tw) + nx * Math.sin(tw)) * side * len;
        ctx.globalAlpha = (0.4 + 0.4 * hsh(i, 6)) * kk;
        ctx.strokeStyle = i % 3 ? '#d6f6ff' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(ex, ey);
        for (const q of [0.3 + 0.2 * hsh(i, 7), 0.65 + 0.2 * hsh(i, 8)]) {
          const bx = x + (ex - x) * q,
            by = y + (ey - y) * q,
            bl = len * (0.2 + 0.25 * hsh(i, 9)) * (1.1 - q);
          for (const s2 of [-1, 1]) {
            if (hsh(i, s2 + q) < 0.2) {
              continue;
            }
            const ba = Math.atan2(ey - y, ex - x) + (s2 * Math.PI) / 3;
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(ba) * bl, by + Math.sin(ba) * bl);
          }
        }
        ctx.stroke();
      }
      for (const o of ring.obs) {
        if (o.star || o.gone) {
          continue;
        }
        const oa = obsAng(ring, o);
        if (Math.abs(Math.atan2(Math.sin(oa - c), Math.cos(oa - c))) > span) {
          continue;
        } // los asteroides quedan con una costra de hielo
        const x = CX + Math.cos(oa) * Rs,
          y = CY + Math.sin(oa) * Rs,
          rad = obsRad(ring, o) * S * 1.12;
        const g = ctx.createRadialGradient(x, y, rad * 0.3, x, y, rad * 1.5);
        g.addColorStop(0, 'rgba(190,240,255,' + 0.3 * kk + ')');
        g.addColorStop(0.7, 'rgba(160,225,255,' + 0.22 * kk + ')');
        g.addColorStop(1, 'rgba(160,225,255,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, rad * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.85 * kk;
        ctx.strokeStyle = '#f2fcff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(x, y, rad * 1.02, Math.PI * 0.9, Math.PI * 1.75);
        ctx.stroke();
        ctx.lineWidth = 1;
        for (let j = 0; j < 6; j++) {
          const a = (j * Math.PI) / 3 + o.seed,
            l = rad * (0.25 + 0.2 * hsh(j, o.seed));
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
          ctx.lineTo(x + Math.cos(a) * (rad + l), y + Math.sin(a) * (rad + l));
          ctx.stroke();
        }
      }
      if (ring.frozenT < 0.5) {
        const cq = (0.5 - ring.frozenT) / 0.5;
        ctx.globalAlpha = 0.9 * cq * alpha;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.1; // grietas
        for (let i = 0; i < 12; i++) {
          let a = c + (hsh(i, 21) * 2 - 1) * span,
            rq = Rs - 6 * S * 0.6;
          ctx.beginPath();
          ctx.moveTo(CX + Math.cos(a) * rq, CY + Math.sin(a) * rq);
          for (let j = 0; j < 4; j++) {
            a += (hsh(i, j + 22) - 0.5) * 0.04;
            rq += 3 * S * 0.6 * cq;
            ctx.lineTo(CX + Math.cos(a) * rq, CY + Math.sin(a) * rq);
          }
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    if (ring.frozenT < 0.3 && !ring.shat) {
      ring.shat = 1;
      const Rw = R; // el hielo se rompe en pedazos
      for (let i = 0; i < 46; i++) {
        const a = c + (Math.random() * 2 - 1) * span,
          v = 30 + Math.random() * 110,
          d = Math.random() < 0.5 ? 1 : -1;
        particles.push({
          x: Math.cos(a) * Rw,
          y: Math.sin(a) * Rw,
          vx: Math.cos(a) * v * d + (Math.random() - 0.5) * 40,
          vy: Math.sin(a) * v * d + (Math.random() - 0.5) * 40,
          life: 0.5 + Math.random() * 0.6,
          col: ['#ffffff', '#d6f6ff', '#a8e8ff'][i % 3],
          s: 0.9 + Math.random() * 1.6,
        });
      }
      if (alpha > 0.6) {
        noise(0.25, 9000, 4000, 0.14, 'highpass');
      }
    }
  }
  if (ring.revT > 0) {
    // Venus: flechas doradas que giran al revés
    ctx.save();
    ctx.globalAlpha = ring.revT * alpha;
    ctx.strokeStyle = '#ffd58a';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    const sg = ring.w >= 0 ? 1 : -1;
    for (let i = 0; i < 10; i++) {
      const a = ring.phase + (i * Math.PI) / 5;
      ctx.beginPath();
      ctx.arc(CX, CY, Rs + 9, a, a + sg * 0.22, sg < 0);
      ctx.stroke();
      const e = a + sg * 0.22,
        ex = CX + Math.cos(e) * (Rs + 9),
        ey = CY + Math.sin(e) * (Rs + 9),
        tx = -Math.sin(e) * sg,
        ty = Math.cos(e) * sg,
        nx = Math.cos(e),
        ny = Math.sin(e);
      ctx.beginPath();
      ctx.moveTo(ex - tx * 5 + nx * 4, ey - ty * 5 + ny * 4);
      ctx.lineTo(ex, ey);
      ctx.lineTo(ex - tx * 5 - nx * 4, ey - ty * 5 - ny * 4);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (ring.windT > 0) {
    // Neptuno: ráfagas de viento azul que empujan el anillo
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const a = (ring.off || 0) + (i * Math.PI) / 8 + t * 2,
        rr2 = Rs + ((i % 3) - 1) * 7;
      ctx.globalAlpha = ring.windT * 0.6 * alpha;
      ctx.strokeStyle = i % 2 ? '#9cc0ff' : '#dbe8ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(CX, CY, rr2, a, a + 0.35);
      ctx.stroke();
    }
    ctx.restore();
  }
}
/**

 * hecho con la lente real: el mundo se estira y se abre en un círculo de luz con aberración

 * Golpes de música entre lanzamientos: cuatro en los primeros anillos (para aprender), luego tres.
 *
 * @returns {number} Golpes de música.
 */

const ORB_W = 1.75,

  WH_OUT = 0.7;

  whShock = null,
  gapC = {},

  hideEarth = false;
/**
 * Sonido de entrada: un tirón grave que sube, con el aire que se arrastra hacia la boca.
 *
 * @param {number} dur Duración, en segundos.
 */
function whPull(dur) {
  if (!AC || muted) {
    return;
  }
  try {
    const n = AC.currentTime,
      o = AC.createOscillator(),
      g = AC.createGain(),
      o2 = AC.createOscillator(),
      g2 = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(48, n);
    o.frequency.exponentialRampToValueAtTime(190, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.5, n + dur * 0.85);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur + 0.25);
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(ROOT / 2, n);
    o2.frequency.exponentialRampToValueAtTime(ROOT * 2, n + dur);
    g2.gain.setValueAtTime(0.0001, n);
    g2.gain.exponentialRampToValueAtTime(0.06, n + dur * 0.9);
    g2.gain.exponentialRampToValueAtTime(0.0001, n + dur + 0.15);
    o.connect(g);
    g.connect(master);
    o2.connect(g2);
    g2.connect(master);
    o.start(n);
    o2.start(n);
    o.stop(n + dur + 0.3);
    o2.stop(n + dur + 0.2);
    noiseHit(n, dur + 0.1, 'bandpass', 300, 0.32, master, 7000);
  } catch (e) {}

/** Sonido de salida: un golpe con eco. */
function whBoom() {
  if (!AC || muted) {
    return;

  try {
    const n = AC.currentTime;
    dKick(n);
    noiseHit(n, 1.1, 'lowpass', 5000, 0.45, master, 120);
    const e = echoBus();
    [12, 7, 0].forEach((sm, i) => {
      const o = AC.createOscillator(),
        g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = ROOT * Math.pow(2, sm / 12);
      g.gain.setValueAtTime(0.0001, n + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.07, n + i * 0.06 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, n + i * 0.06 + 0.9);
      o.connect(g);
      g.connect(e);
      g.connect(master);
      o.start(n + i * 0.06);
      o.stop(n + i * 0.06 + 1);
    });
  } catch (e) {}
}

    nu = 2 * Math.atan2(Math.sqrt(1 + s.e) * Math.sin(E / 2), Math.sqrt(1 - s.e) * Math.cos(E / 2)),
    an = nu + s.w;

    }

      w.wk = w.k0 + (w.L - w.k0) * Math.min(1, tt / w.T);
      w.trailT += d;
      if (w.trailT > 0.12) {
        w.trailT = 0;
        w.trail.push({ k: w.wk, a: 1 });
        if (w.trail.length > 14) {
          w.trail.shift();
        }
      }
      if (!w.safe && !w.hitDone && pLevel >= w.L - 0.02) {
        waveSafe(w);
      }
      if (!w.safe && !w.hitDone && w.wk >= pLevel - 0.04) {
        const r = waveCatch(w, px, py);
        if (r) {
          return r;
        }
      }
      if (tt >= w.T) {
        waveBreak(w);
      }

      w.broken += d;
    }
    for (const tr of w.trail) {
      tr.a -= d * 1.1;
    }

      w.over = true;
      if (w.learn) {

          localStorage.setItem('orbita_p1_vistos', JSON.stringify(seenTypes));
        } catch (e) {}
      }
    }

    if (w.released && !w.broken && !w.safe && !w.hitDone) {

    }
  }

    waveBeepT -= d;

            ROOT * 4 * Math.pow(2, (hot ? 3 : 0) / 12),
            AC.currentTime,
            0.07,
            0.03 + 0.05 * waveProx,
            'square',

      const R = rr(c.k),
        x = Math.cos(c.ang) * R,
        y = Math.sin(c.ang) * R;

  comets = comets.filter(c => c.left > 0 && c.k >= level - 1);

    b.t += d;

      b.fired = true;

      noise(0.35, 5000, 300, 0.35, 'lowpass');
      buzz(30);
    }
    if (b.t >= b.warn && b.t < b.warn + b.fire && Math.abs(pLevel - b.k) < 0.45) {
      return 'beam';
    }
  }
  beams = beams.filter(b => b.t < b.warn + b.fire + 0.3);

    flareWarn -= d;

      flareT = 0.75;
      noise(0.5, 7000, 500, 0.3, 'highpass');
    }

    R +
    wob *
      (0.35 * Math.sin(2 * th + p[0] + t * 0.5) +
        0.25 * Math.sin(5 * th + p[1] - t * 0.9) +
        0.2 * Math.sin(11 * th + p[2] + t * 1.7) +
        0.12 * Math.sin(23 * th + p[0] * 2 - t * 2.6) +
        0.08 * Math.sin(41 * th + p[1] * 3 + t * 3.3))

function clearance(k, onlyApproaching) {
  const ring = rings.get(k);
  if (!ring) {
    return 999;
  }
  const R = rr(k),
    px = Math.cos(pAng) * R,
    py = Math.sin(pAng) * R;
  let m = 999;
  for (const o of ring.obs) {
    if (o.gone) {
      continue;
    }
    const oa = obsAng(ring, o);
    if (onlyApproaching) {
      const diff = Math.atan2(Math.sin(oa - pAng), Math.cos(oa - pAng));
      if (diff * (o.dir || 1) * ring.w * (ring.sgn || 1) >= 0) {
        continue;
      }
    }
    const Rs = R * stretchAt(ring, oa);
    m = Math.min(
      m,
      Math.hypot(px - Math.cos(oa) * Rs, py - Math.sin(oa) * Rs) - (PR + obsRad(ring, o)),
    );
  }
  return m;
}

    src.start(n);
    src.stop(n + 2);
    const chord = (t0, semis, dur, gain) => {
      for (const sm of semis) {
        for (const det of [-6, 6]) {
          const o = AC.createOscillator(),
            gg = AC.createGain(),
            lp = AC.createBiquadFilter();
          o.type = 'sawtooth';
          o.frequency.value = (ROOT / 2) * Math.pow(2, sm / 12);
          o.detune.value = det;
          lp.type = 'lowpass';

          lp.connect(gg);
          gg.connect(master);
          o.start(t0);
          o.stop(t0 + dur + 0.1);
        }
      }
    };
    chord(n + 1.6, [3, 7, 10, 15], 4.5, 0.03); // acorde luminoso (Si mayor)

      const o = AC.createOscillator(),
        gg = AC.createGain();
      o.type = 'sine';
      o.frequency.value = ROOT * 2 * Math.pow(2, sm / 12);
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
      o.connect(gg);
      gg.connect(master);
      o.start(t0);
      o.stop(t0 + 2.3);

function updateIntro(dt) {

  holeFlare = Math.max(0, holeFlare - dt * 1.4);
  pulse = Math.max(0, pulse - dt * 3.5);
  shake = Math.max(0, shake - dt * 25);
  SI = Math.max(0.4, Math.min(W / 2 / 224, (CY - 80) / 224));

  }
  if (introT >= T_ARRIVE && once('arrive')) {
    suck();
    shake = reduceMotion ? 0 : 6;
    buzz([30, 30, 30, 30, 60]);

  if (introT >= T_SUN_END && once('disk')) {
    holeFlare = 1;
    pulse = 1;
    flash = 0.5;

    buzz(50);

    sk = sunK(),
    holeR = bhRadius();

  if (state === 'intro' && sk > 0 && sk < 1) {
    const sR = 20 * Math.pow(1 - sk, 0.7),
      sx = b.x * sk * 0.5,
      sy = b.y * sk * 0.5;
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2,
        px = sx + Math.cos(a) * sR,
        py = sy + Math.sin(a) * sR;
      const dx = px - b.x,
        dy = py - b.y,
        l = Math.hypot(dx, dy) || 1,
        v = 90 + Math.random() * 80;
      iparts.push({
        x: px,
        y: py,
        vx: (-dy / l) * v,
        vy: (dx / l) * v,
        life: 1.2 + Math.random(),
        col: SUN_COLS[i % 4],
        s: 1.5 + Math.random() * 2.5,

    }
  }

    if (p.done) {

          ey = Math.sin(p.a) * p.rr,

          y: ey,
          vx: -Math.sin(p.a) * v,
          vy: Math.cos(p.a) * v,
          life: 0.8 + Math.random() * 0.5,
          col: p.c,
          s: 1.5 + Math.random() * 2,

    q.vy -= (dy / l) * pull * dt;
