<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · Prototipo 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1220; --fg:#ece6d8; --muted:#8b8f9e; --sun:#ff5a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1220; --fg:#ece6d8; } }
:root[data-theme="dark"]{ --bg:#0d1220; --fg:#ece6d8; }
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:'Unbounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none;transition:opacity .3s;}
#score{font-weight:900;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.02em;}
#best{margin-top:6px;font-weight:300;font-size:13px;color:var(--muted);}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 24px;transition:opacity .25s;}
#panel.hide{opacity:0;}
.title{font-weight:900;font-size:clamp(52px,16vw,108px);letter-spacing:-.04em;line-height:.9;
  color:var(--fg);}
.big{font-weight:900;font-size:clamp(72px,24vw,140px);line-height:.9;letter-spacing:-.04em;
}
.sub{margin-top:18px;font-weight:300;font-size:15px;line-height:1.6;color:var(--muted);max-width:30ch;}
.msg{margin-top:14px;font-weight:500;font-size:16px;color:var(--fg);}
.msg.rec{color:var(--sun);}
.cta{margin-top:34px;font-weight:500;font-size:14px;color:var(--fg);animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .cta{animation:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" style="opacity:0"><div id="score">0</div><div id="best">Récord 0</div></div>
  <div id="panel">
    <div class="title">Órbita</div>
    <div class="sub">El agujero negro jala a la Tierra. Toca para alejarla y pasa por los huecos. Más cerca del agujero, más puntos.</div>
    <div class="cta">Toca para empezar</div>
  </div>
</div>
<script>
(() => {
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const elHud = document.getElementById('hud'), elPanel = document.getElementById('panel');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- medidas ----------
let W, H, DPR, S, CX, CY;
const PR = 11;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cvs.getBoundingClientRect(); W = r.width; H = r.height;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H*0.62;
  S = Math.max(.5, Math.min(W/2/215, (CY - 100)/210));
}
window.addEventListener('resize', resize); resize();

// ---------- zonas (cambian cada 25 anillos) ----------
const BONE = '#ece6d8';
const ZONES = [
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#0d1220'},
  {ring:BONE, ast:BONE, s1:'#ffc2a0', s2:'#e01f2e', bg:'#120f1e'},
  {ring:BONE, ast:BONE, s1:'#fff6d8', s2:'#ffb81f', bg:'#0f1220'},
  {ring:BONE, ast:BONE, s1:'#f6dcff', s2:'#9a3dff', bg:'#120c22'},
];
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
const zoneOf = k => ZONES[Math.floor(k/25) % ZONES.length];

// ---------- estrellas ----------
const stars = Array.from({length:140}, () => ({a:Math.random()*Math.PI*2, r:Math.sqrt(Math.random())*1.2, s:Math.random()*1.3+.3, tw:Math.random()*6}));

// ---------- audio ----------
let AC = null, master = null, musicBus = null, NOISE = null, shaper = null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .6;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = .0001; musicBus.connect(master);
    const len = AC.sampleRate*2; NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC = null; }
}
const ROOT = 415.3; // tonalidad: Sol# menor
const SCALE = [0,3,5,7,10,12,15,17];
function cowbell(semi){
  if (!AC) return; try{
    const t0 = AC.currentTime, f = ROOT*Math.pow(2, semi/12);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = 'square'; o1.frequency.value = f; o2.frequency.value = f*1.48;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.7; bp.Q.value = 1.4;
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.3,t0+.004); g.gain.exponentialRampToValueAtTime(.0001,t0+.26);
    o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(master);
    o1.start(t0); o2.start(t0); o1.stop(t0+.3); o2.stop(t0+.3);
  }catch(e){}
}
function noiseHit(t0, dur, type, freq, gain, dest, f1){
  const src = AC.createBufferSource(); src.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = .9;
  f.frequency.setValueAtTime(freq, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t0, Math.random()*.8); src.stop(t0+dur+.02);
}
function noise(dur, f0, f1, gain, type){ if (!AC) return; try{ noiseHit(AC.currentTime, dur, type, f0, gain, master, f1); }catch(e){} }
function thump(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(55,t0+.1);
    g.gain.setValueAtTime(.3,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.15);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+.17);
  }catch(e){}
}
function sub(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(28,t0+.9);
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 400;
    g.gain.setValueAtTime(.5,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+1);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t0); o.stop(t0+1.05);
  }catch(e){}
}

// ---------- beat (se van sumando capas al subir) ----------
const BPM = 140, STEP = 60/BPM/4;
let musicOn = false, nextT = 0, step = 0, schedTimer = null, kickQueue = [];
const BASS = {0:[0,.42], 6:[0,.28], 10:[-2,.42], 16:[0,.42], 22:[3,.28], 26:[-2,.42]};
function dKick(t0){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(165,t0); o.frequency.exponentialRampToValueAtTime(45,t0+.12);
  g.gain.setValueAtTime(.95,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
  o.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0+.32);
  kickQueue.push(t0);
}
function dClap(t0){ for (let i=0;i<3;i++) noiseHit(t0+i*.011, i<2 ? .03 : .17, 'bandpass', 1600, .55, musicBus); }
function dHat(t0, open){ noiseHit(t0, open ? .17 : .035, 'highpass', 8000, open ? .16 : .2, musicBus); }
function d808(t0, semi, dur){
  const f = ROOT/8*Math.pow(2, semi/12);
  if (!shaper){
    shaper = AC.createWaveShaper(); const c = new Float32Array(256);
    for (let i=0;i<256;i++){ const x = i/128-1; c[i] = Math.tanh(x*2.5); }
    shaper.curve = c; const sg = AC.createGain(); sg.gain.value = .55; shaper.connect(sg); sg.connect(musicBus);
  }
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f*1.5,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.06);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.9,t0+.01);
  g.gain.setValueAtTime(.9,t0+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(shaper); o.start(t0); o.stop(t0+dur+.02);
}
function scheduleStep(s, t0){
  const b = s % 16;
  if (b===0 || b===6 || b===10) dKick(t0);
  if (b % 2 === 0) dHat(t0, false);
  if (level >= 5 && (b===4 || b===12)) dClap(t0);
  if (level >= 12 && BASS[s]) d808(t0, BASS[s][0], BASS[s][1]);
  if (level >= 25){
    if (b===2 || b===14) dHat(t0, true);
    if (s===30 || s===31){ dHat(t0+STEP/2, false); }
  }
}
function tick(){
  if (!AC || !musicOn) return;
  try{
    if (nextT < AC.currentTime - .2) nextT = AC.currentTime + .05;
    while (nextT < AC.currentTime + .12){ scheduleStep(step, nextT); nextT += STEP; step = (step+1) % 32; }
  }catch(e){}
}
function startMusic(){
  if (!AC) return;
  try{
    musicOn = true; step = 0; nextT = AC.currentTime + .08; kickQueue = [];
    const n = AC.currentTime;
    musicBus.gain.cancelScheduledValues(n); musicBus.gain.setValueAtTime(.0001, n);
    musicBus.gain.exponentialRampToValueAtTime(.55, n+.25);
    if (!schedTimer) schedTimer = setInterval(tick, 25);
    tick();
  }catch(e){}
}
function stopMusic(){
  if (!AC) return;
  try{
    musicOn = false; const n = AC.currentTime;
    musicBus.gain.cancelScheduledValues(n); musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, .0001), n);
    musicBus.gain.exponentialRampToValueAtTime(.0001, n+.35);
  }catch(e){}
}
const buzz = p => { try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} };

// ---------- récord ----------
let best = 0;
try{ best = parseInt(localStorage.getItem('orbita_tierra_best')||'0',10) || 0; }catch(e){ best = 0; }
const saveBest = () => { try{ localStorage.setItem('orbita_tierra_best', String(best)); }catch(e){} };

// ---------- recorrido fijo: siempre el mismo, para poder aprenderlo ----------
const SEED = 20261007; let rngState = SEED;
function rng(){ rngState |= 0; rngState = rngState + 0x6D2B79F5 | 0; let x = Math.imul(rngState ^ rngState >>> 15, 1 | rngState); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }

// ---------- física y estado ----------
const HZ = 40, RMAX = 205, G0 = 380, JUMP = 110, VMAX = 260, AHEAD = 2.5;
const BAND3 = 85, BAND2 = 125;
const frac = x => x - Math.floor(x);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const grav = rad => G0*Math.pow(120/Math.max(rad, 20), 1.5);        // más fuerte mientras más cerca
const mult = rad => rad < BAND3 ? 3 : rad < BAND2 ? 2 : 1;
let state = 'menu', level = 0;
let ang, r, vr, walls, spawned, nextWall, lastGap, score, obs, prevMult;
let t = 0, timeScale = 1, slowTimer = 0, shake = 0, flash = 0, pulse = 0, canRestart = false;
let particles = [], texts = [], trail = [], culprit = null, culpritT = 0, pop = 0;
const linSpeed = () => 130 + Math.min(walls*1.5, 80);
const omega = rad => linSpeed()/120*Math.pow(120/rad, 1.3);       // cerca del agujero todo va más rápido
const debris = Array.from({length:60}, () => ({a:Math.random()*Math.PI*2, r:60 + Math.random()*180}));
const CONT = [{x:.1,y:-.35,w:.42,h:.22},{x:.45,y:.15,w:.3,h:.38},{x:.8,y:-.05,w:.35,h:.25},{x:.62,y:.55,w:.22,h:.12}];
const CLOUD = [{x:.2,y:-.6,w:.5},{x:.55,y:-.1,w:.4},{x:.9,y:.4,w:.45}];

function setup(){
  rngState = SEED; ang = 0; r = 150; vr = 0; walls = 0; spawned = 0; level = 0; score = 0;
  obs = []; nextWall = 2.2; lastGap = 150; prevMult = 1;
  particles = []; texts = []; trail = []; culprit = null; culpritT = 0; timeScale = 1; slowTimer = 0;
}
function start(){
  setup(); state = 'play'; vr = JUMP*.6;
  elScore.textContent = '0'; elBest.textContent = 'Récord ' + best;
  elHud.style.opacity = 1; elPanel.classList.add('hide');
  startMusic();
}
setup();

// muros de asteroides con un hueco (como tubos de Flappy Bird, pero alrededor del agujero)
function spawnWall(){
  const i = spawned++;
  const gap = 66 - Math.min(i*.6, 20);
  const lo = HZ + 18 + gap/2, hi = RMAX - 8 - gap/2;
  let gc = lo + rng()*(hi - lo);
  const maxShift = 70 + Math.min(i*1.5, 40);
  gc = clamp(gc, lastGap - maxShift, lastGap + maxShift);
  if (i < 3) gc = clamp(gc, 125, 175);
  lastGap = gc;
  const A = nextWall, rocks = [];
  for (let rr = HZ + 6; rr <= RMAX + 14; rr += 19){
    if (Math.abs(rr - gc) < gap/2 + 9) continue;
    rocks.push({ro:rr, r:9, seed:rng()*100});
  }
  obs.push({A, rocks, passed:false, near:false, wall:true});
  const spacing = (230 - Math.min(i*1.2, 50))/120;
  if (i >= 8 && rng() < .5){
    const ro = HZ + 30 + rng()*(RMAX - HZ - 40);
    obs.push({A: A + spacing*.5, rocks:[{ro, r:10, seed:rng()*100}], passed:false, near:false, wall:false});
  }
  nextWall = A + spacing;
}

function thrust(){
  vr = vr < 0 ? JUMP : Math.min(vr + JUMP*.5, VMAX); pop = 1;
  noise(.1, 400, 1600, .1, 'bandpass');
}
function onPassWall(o, m){
  const z = zoneOf(level);
  walls++; level = walls;
  const gain = m + (o.near ? 2 : 0);
  score += gain; elScore.textContent = score;
  cowbell(SCALE[(walls % 3) + (m - 1)*2] + (o.near ? 12 : 0));
  if (o.near){ texts.push({txt:'Rozón +' + gain, x:0, y:-RMAX-22, life:1, size:15, col:z.s2}); timeScale = .45; slowTimer = .08; buzz(12); }
  else if (m > 1) texts.push({txt:'+' + gain, x:0, y:-RMAX-22, life:.8, size:15, col:z.s2});
  if (walls % 25 === 0){ texts.push({txt:'Zona ' + (walls/25 + 1), x:0, y:-RMAX-50, life:1.6, size:24, col:BONE, center:true}); flash = .3; buzz(20); }
}
function die(hit, cause){
  state = 'dead'; canRestart = false; culprit = hit; culpritT = hit ? 1.4 : 0;
  shake = reduceMotion ? 0 : 16; flash = cause === 'hole' ? .5 : 1;
  timeScale = cause === 'hole' ? .25 : .03; slowTimer = cause === 'hole' ? .5 : .28;
  const cols = ['#2b63c9','#4fa35a','#ffffff','#8fd0ff'];
  for (let i=0;i<80;i++){
    const a = Math.random()*Math.PI*2, v = 40 + Math.random()*220;
    let vx = Math.cos(a)*v, vy = Math.sin(a)*v;
    if (cause === 'hole'){ vx = vx*.25 + (80 + Math.random()*120)*(Math.random()<.5?-1:1); vy = vy*.25 + 120 + Math.random()*80; }
    particles.push({x:0, y:-r, vx, vy, life:1 + Math.random()*1.2, col:cols[i%4], s:2 + Math.random()*3});
  }
  stopMusic(); noise(1, 3500, 60, .9, 'lowpass'); sub(); buzz([40,30,90]);
  const prev = best;
  if (score > best){ best = score; saveBest(); }
  setTimeout(() => {
    let msg;
    if (score > prev && prev > 0) msg = '<div class="msg rec">Nuevo récord</div>';
    else if (score > prev) msg = '<div class="msg rec">Tu primer récord</div>';
    else if (best - score <= 5) msg = '<div class="msg">Te faltaron ' + (best - score + 1) + ' para tu récord</div>';
    else msg = '<div class="msg">Récord: ' + best + '</div>';
    const why = cause === 'hole' ? 'La Tierra cayó en el agujero negro. Toca más seguido.' : 'La Tierra chocó con un asteroide.';
    elPanel.innerHTML = '<div class="big">' + score + '</div><div class="sub" style="margin-top:6px">' + why + '</div>' + msg + '<div class="cta">Toca para reintentar</div>';
    elPanel.classList.remove('hide'); elHud.style.opacity = 0;
    setTimeout(() => { canRestart = true; }, 250);
  }, 850);
}

// ---------- entrada ----------
function press(e){
  if (e && e.cancelable) e.preventDefault();
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  if (state === 'menu'){ start(); return; }
  if (state === 'dead'){ if (canRestart) start(); return; }
  if (state === 'play') thrust();
}
window.addEventListener('pointerdown', press, {passive:false});
window.addEventListener('keydown', e => {
  if (['Space','ArrowUp','Enter'].includes(e.code)){ e.preventDefault(); if (!e.repeat) press(); }
});

// ---------- lógica ----------
function update(dt){
  if (slowTimer > 0) slowTimer -= dt; else timeScale += (1 - timeScale)*Math.min(1, dt*6);
  shake = Math.max(0, shake - dt*40); flash = Math.max(0, flash - dt*2.6); pulse = Math.max(0, pulse - dt*3.5);
  culpritT = Math.max(0, culpritT - dt); pop = Math.max(0, pop - dt*7);
  if (AC) while (kickQueue.length && AC.currentTime >= kickQueue[0]){ kickQueue.shift(); pulse = Math.max(pulse, .8); }
  const d = dt*timeScale; t += d;
  for (const db of debris){
    db.r -= (14 + 1400/Math.max(db.r, 10))*dt; db.a += (.4 + 70/Math.max(db.r, 10))*dt;
    if (db.r < HZ){ db.r = HZ + 120 + Math.random()*120; db.a = Math.random()*Math.PI*2; }
  }
  if (state === 'menu'){ ang += .5*d; r = 150 + Math.sin(t*2)*6; }
  if (state === 'play'){
    vr -= grav(r)*d; r += vr*d;
    if (r > RMAX){ r = RMAX; if (vr > 0) vr = 0; }
    ang += omega(r)*d;
    trail.push({a:ang, r}); if (trail.length > 26) trail.shift();
    while (nextWall < ang + AHEAD) spawnWall();
    if (r < HZ + PR*.6){ die(null, 'hole'); return; }
    const m = mult(r);
    if (m > prevMult){ cowbell(SCALE[3 + m]); texts.push({txt:'x' + m, x:-30, y:-r, life:.7, size:14, col:zoneOf(level).s2}); }
    prevMult = m;
    const ex = Math.cos(ang)*r, ey = Math.sin(ang)*r;
    for (const o of obs){
      const da = o.A - ang;
      if (Math.abs(da) < .4){
        for (const k of o.rocks){
          const dd = Math.hypot(ex - Math.cos(o.A)*k.ro, ey - Math.sin(o.A)*k.ro);
          if (dd < PR + k.r*.75){ die({A:o.A, k}, 'ast'); return; }
          if (dd < PR + k.r + 7) o.near = true;
        }
      }
      if (!o.passed && da < -(PR + 12)/r){ o.passed = true; if (o.wall) onPassWall(o, m); }
    }
    obs = obs.filter(o => o.A > ang - .7);
  }
  for (const p of particles){
    if (state === 'dead'){ const l = Math.hypot(p.x, p.y) || 1; p.vx -= p.x/l*260*d; p.vy -= p.y/l*260*d; if (l < HZ) p.life -= d*4; }
    p.vx *= Math.pow(.6, d); p.vy *= Math.pow(.6, d);
    p.x += p.vx*d; p.y += p.vy*d; p.life -= d*.7;
  }
  particles = particles.filter(p => p.life > 0);
  for (const tx of texts){ tx.life -= dt; if (!tx.center) tx.y -= dt*22; }
  texts = texts.filter(tx => tx.life > 0);
}

// ---------- dibujo ----------
function drawAst(x, y, rad, seed, rot, col, alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i=0;i<8;i++){
    const a = i/8*Math.PI*2, k = rad*(.72 + .4*frac(Math.sin(seed + i*12.9898)*43758.5453));
    i ? ctx.lineTo(Math.cos(a)*k, Math.sin(a)*k) : ctx.moveTo(Math.cos(a)*k, Math.sin(a)*k);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function drawEarth(px, py, rad){
  ctx.save();
  ctx.shadowColor = 'rgba(120,190,255,.7)'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#2b63c9'; ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = '#4fa35a';
  for (const c of CONT){
    const x = px + (frac(c.x + t*.06)*2.8 - 1.4)*rad;
    ctx.beginPath(); ctx.ellipse(x, py + c.y*rad, c.w*rad, c.h*rad, .3, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const c of CLOUD){
    const x = px + (frac(c.x + t*.11)*2.8 - 1.4)*rad;
    ctx.beginPath(); ctx.ellipse(x, py + c.y*rad, c.w*rad, .09*rad, 0, 0, Math.PI*2); ctx.fill();
  }
  // lado de noche: la luz viene del disco del agujero negro (abajo)
  const sh = ctx.createLinearGradient(px, py + rad, px, py - rad);
  sh.addColorStop(0, 'rgba(10,14,30,0)'); sh.addColorStop(.5, 'rgba(10,14,30,.15)'); sh.addColorStop(1, 'rgba(10,14,30,.75)');
  ctx.fillStyle = sh; ctx.fillRect(px - rad, py - rad, rad*2, rad*2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(143,208,255,.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(px, py, rad + .6, 0, Math.PI*2); ctx.stroke();
}
function render(){
  const z = zoneOf(level);
  ctx.save();
  ctx.fillStyle = z.bg; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  const sr = Math.max(W, H)*.62;
  for (const s of stars){
    const a = s.a - ang*.05, x = CX + Math.cos(a)*s.r*sr, y = CY + Math.sin(a)*s.r*sr;
    ctx.globalAlpha = .12 + .22*(.5 + .5*Math.sin(t*1.3 + s.tw));
    ctx.fillStyle = BONE; ctx.fillRect(x, y, s.s*.8, s.s*.8);
  }
  ctx.globalAlpha = 1;

  // agujero negro
  const hR = (HZ + pulse*2)*S;
  const g = ctx.createRadialGradient(CX, CY, hR*.9, CX, CY, hR*2.6);
  g.addColorStop(0, rgba(z.s2,.42)); g.addColorStop(.35, rgba(z.s2,.1)); g.addColorStop(1, rgba(z.s2,0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, hR*2.6, 0, Math.PI*2); ctx.fill();
  for (const db of debris){
    ctx.globalAlpha = .4*clamp((db.r - HZ)/40, 0, 1); ctx.fillStyle = BONE;
    ctx.fillRect(CX + Math.cos(db.a)*db.r*S - .8, CY + Math.sin(db.a)*db.r*S - .8, 1.6, 1.6);
  }
  const lw = Math.max(1, Math.min(hR*.05, 4));
  for (let i=0;i<14;i++){
    const r2 = hR*(1.06 + i*.03) + i*lw*.6, a0 = t*(3.4 - i*.14) + i*1.7;
    ctx.globalAlpha = .6 - i*.035; ctx.strokeStyle = i%3 === 0 ? z.s1 : z.s2; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(CX, CY, r2, a0, a0 + 1.4 + (i%4)*.55); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(CX, CY, hR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = z.s1; ctx.lineWidth = 1.8 + pulse*1.5; ctx.shadowColor = z.s2; ctx.shadowBlur = 16 + pulse*14;
  ctx.beginPath(); ctx.arc(CX, CY, hR*1.01, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0;

  // zonas de puntos: más cerca del agujero, más puntos
  ctx.setLineDash([2, 7]); ctx.lineWidth = 1; ctx.strokeStyle = z.s2;
  ctx.globalAlpha = .28; ctx.beginPath(); ctx.arc(CX, CY, BAND3*S, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = .16; ctx.beginPath(); ctx.arc(CX, CY, BAND2*S, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '500 11px Unbounded, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = z.s2;
  const la = -Math.PI/2 - .55;
  ctx.globalAlpha = .55; ctx.fillText('x3', CX + Math.cos(la)*(HZ + BAND3)/2*S, CY + Math.sin(la)*(HZ + BAND3)/2*S);
  ctx.globalAlpha = .4; ctx.fillText('x2', CX + Math.cos(la)*(BAND3 + BAND2)/2*S, CY + Math.sin(la)*(BAND3 + BAND2)/2*S);
  ctx.globalAlpha = 1;

  // el mundo gira: la Tierra queda arriba y los asteroides llegan desde la derecha
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(-Math.PI/2 - ang);
  for (const o of obs){
    const da = o.A - ang;
    const al = da < 0 ? clamp(1 + da/.5, 0, 1) : clamp((AHEAD - da)/.8, 0, 1);
    if (al <= .01) continue;
    for (const k of o.rocks){
      if (k.ro > RMAX + 20) continue;
      drawAst(Math.cos(o.A)*k.ro*S, Math.sin(o.A)*k.ro*S, k.r*S, k.seed, t*.6 + k.seed, BONE, al);
    }
  }
  if (culprit && culpritT > 0){
    ctx.globalAlpha = Math.min(1, culpritT); ctx.strokeStyle = z.s2; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(Math.cos(culprit.A)*culprit.k.ro*S, Math.sin(culprit.A)*culprit.k.ro*S, (culprit.k.r + 7)*S, 0, Math.PI*2); ctx.stroke();
  }
  if (state !== 'dead'){
    for (let i=1;i<trail.length;i++){
      const p0 = trail[i-1], p1 = trail[i];
      ctx.globalAlpha = (i/trail.length)*.3; ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = (i/trail.length)*PR*1.1*S; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(Math.cos(p0.a)*p0.r*S, Math.sin(p0.a)*p0.r*S); ctx.lineTo(Math.cos(p1.a)*p1.r*S, Math.sin(p1.a)*p1.r*S); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha = 1;

  if (state !== 'dead') drawEarth(CX, CY - r*S, PR*S*(1 + pop*.12));

  for (const p of particles){
    ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col;
    ctx.fillRect(CX + p.x*S - p.s/2, CY + p.y*S - p.s/2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of texts){
    ctx.globalAlpha = clamp(tx.life, 0, 1);
    ctx.font = '900 ' + tx.size + 'px Unbounded, system-ui, sans-serif';
    ctx.fillStyle = tx.col; ctx.fillText(tx.txt, CX + tx.x*S, CY + tx.y*S);
  }
  ctx.globalAlpha = 1;
  // peligro: cerca del horizonte
  if (state === 'play'){
    const danger = clamp((70 - r)/25, 0, 1);
    if (danger > 0){
      const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.35, W/2, H/2, Math.max(W,H)*.75);
      vg.addColorStop(0, rgba(z.s2, 0)); vg.addColorStop(1, rgba(z.s2, danger*(.3 + .12*Math.sin(t*14))));
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
  }
  ctx.restore();
  if (flash > 0){ ctx.globalAlpha = flash*.35; ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05); last = now;
  requestAnimationFrame(frame);
  try{ update(dt); render(); }catch(e){ try{ ctx.restore(); }catch(_){} console.error(e); }
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
