<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · Prototipo 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1220; --fg:#ece6d8; --muted:#8b8f9e; --sun:#ff5a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1220; --fg:#ece6d8; } }
:root[data-theme="dark"]{ --bg:#0d1220; --fg:#ece6d8; }
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:'Unbounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none;transition:opacity .3s;}
#score{font-weight:900;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.02em;}
#best{margin-top:6px;font-weight:300;font-size:13px;color:var(--muted);}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 24px;transition:opacity .25s;}
#panel.hide{opacity:0;}
.title{font-weight:900;font-size:clamp(52px,16vw,108px);letter-spacing:-.04em;line-height:.9;
  color:var(--fg);}
.big{font-weight:900;font-size:clamp(72px,24vw,140px);line-height:.9;letter-spacing:-.04em;
}
.sub{margin-top:18px;font-weight:300;font-size:15px;line-height:1.6;color:var(--muted);max-width:30ch;}
.msg{margin-top:14px;font-weight:500;font-size:16px;color:var(--fg);}
.msg.rec{color:var(--sun);}
.cta{margin-top:34px;font-weight:500;font-size:14px;color:var(--fg);animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .cta{animation:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" style="opacity:0"><div id="score">0</div><div id="best">Récord 0</div></div>
  <div id="panel">
    <div class="title">Órbita</div>
    <div class="sub">Las puertas pasan sobre ti al ritmo del beat. Toca en el golpe para cruzar. Justo en el golpe es Perfecto.</div>
    <div class="cta">Toca para empezar</div>
  </div>
</div>
<script>
(() => {
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const elHud = document.getElementById('hud'), elPanel = document.getElementById('panel');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- medidas ----------
let W, H, DPR, S, CX, CY;
const R0 = 96, GAP = 34, PR = 8, SUN = 16;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cvs.getBoundingClientRect(); W = r.width; H = r.height;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.min(W/2/170, H/2/250);
  CX = W/2; CY = H*0.62;
}
window.addEventListener('resize', resize); resize();

// ---------- zonas (cambian cada 25 anillos) ----------
const BONE = '#ece6d8';
const ZONES = [
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#0d1220'},
  {ring:BONE, ast:BONE, s1:'#ffc2a0', s2:'#e01f2e', bg:'#120f1e'},
  {ring:BONE, ast:BONE, s1:'#fff6d8', s2:'#ffb81f', bg:'#0f1220'},
  {ring:BONE, ast:BONE, s1:'#f6dcff', s2:'#9a3dff', bg:'#120c22'},
];
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
const zoneOf = k => ZONES[Math.floor(k/25) % ZONES.length];

// ---------- estrellas ----------
const stars = Array.from({length:140}, () => ({a:Math.random()*Math.PI*2, r:Math.sqrt(Math.random())*1.2, s:Math.random()*1.3+.3, tw:Math.random()*6}));

// ---------- audio ----------
let AC = null, master = null, musicBus = null, NOISE = null, shaper = null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .6;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = .0001; musicBus.connect(master);
    const len = AC.sampleRate*2; NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC = null; }
}
const ROOT = 415.3; // tonalidad: Sol# menor
const SCALE = [0,3,5,7,10,12,15,17];
function cowbell(semi){
  if (!AC) return; try{
    const t0 = AC.currentTime, f = ROOT*Math.pow(2, semi/12);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = 'square'; o1.frequency.value = f; o2.frequency.value = f*1.48;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.7; bp.Q.value = 1.4;
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.3,t0+.004); g.gain.exponentialRampToValueAtTime(.0001,t0+.26);
    o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(master);
    o1.start(t0); o2.start(t0); o1.stop(t0+.3); o2.stop(t0+.3);
  }catch(e){}
}
function noiseHit(t0, dur, type, freq, gain, dest, f1){
  const src = AC.createBufferSource(); src.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = .9;
  f.frequency.setValueAtTime(freq, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t0, Math.random()*.8); src.stop(t0+dur+.02);
}
function noise(dur, f0, f1, gain, type){ if (!AC) return; try{ noiseHit(AC.currentTime, dur, type, f0, gain, master, f1); }catch(e){} }
function thump(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(55,t0+.1);
    g.gain.setValueAtTime(.3,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.15);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+.17);
  }catch(e){}
}
function suck(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(260, t0); o.frequency.exponentialRampToValueAtTime(30, t0 + 1.8);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.45, t0 + .6); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.9);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 2);
    noiseHit(t0, 1.8, 'lowpass', 2200, .45, master, 70);
  }catch(e){}
}
function sub(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(28,t0+.9);
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 400;
    g.gain.setValueAtTime(.5,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+1);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t0); o.stop(t0+1.05);
  }catch(e){}
}

// ---------- beat (se van sumando capas al subir) ----------
const BPM = 140, STEP = 60/BPM/4, TB = 60/BPM;
let musicOn = false, nextT = 0, step = 0, schedTimer = null, kickQueue = [], musicStart = -1;
const BASS = {0:[0,.42], 6:[0,.28], 10:[-2,.42], 16:[0,.42], 22:[3,.28], 26:[-2,.42]};
function dKick(t0){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(165,t0); o.frequency.exponentialRampToValueAtTime(45,t0+.12);
  g.gain.setValueAtTime(.95,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
  o.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0+.32);
  kickQueue.push(t0);
}
function dClap(t0){ for (let i=0;i<3;i++) noiseHit(t0+i*.011, i<2 ? .03 : .17, 'bandpass', 1600, .55, musicBus); }
function dHat(t0, open){ noiseHit(t0, open ? .17 : .035, 'highpass', 8000, open ? .16 : .2, musicBus); }
function d808(t0, semi, dur){
  const f = ROOT/8*Math.pow(2, semi/12);
  if (!shaper){
    shaper = AC.createWaveShaper(); const c = new Float32Array(256);
    for (let i=0;i<256;i++){ const x = i/128-1; c[i] = Math.tanh(x*2.5); }
    shaper.curve = c; const sg = AC.createGain(); sg.gain.value = .55; shaper.connect(sg); sg.connect(musicBus);
  }
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f*1.5,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.06);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.9,t0+.01);
  g.gain.setValueAtTime(.9,t0+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(shaper); o.start(t0); o.stop(t0+dur+.02);
}
function scheduleStep(s, t0){
  const b = s % 16;
  if (b===0 || b===6 || b===10) dKick(t0);
  if (b % 2 === 0) dHat(t0, false);
  if (level >= 5 && (b===4 || b===12)) dClap(t0);
  if (level >= 12 && BASS[s]) d808(t0, BASS[s][0], BASS[s][1]);
  if (level >= 25){
    if (b===2 || b===14) dHat(t0, true);
    if (s===30 || s===31){ dHat(t0+STEP/2, false); }
  }
}
function tick(){
  if (!AC || !musicOn) return;
  try{
    if (nextT < AC.currentTime - .2) nextT = AC.currentTime + .05;
    while (nextT < AC.currentTime + .12){ scheduleStep(step, nextT); nextT += STEP; step = (step+1) % 32; }
  }catch(e){}
}
function startMusic(){
  if (!AC) return;
  try{
    musicOn = true; step = 0; nextT = AC.currentTime + .08; kickQueue = []; musicStart = nextT;
    const n = AC.currentTime;
    musicBus.gain.cancelScheduledValues(n); musicBus.gain.setValueAtTime(.0001, n);
    musicBus.gain.exponentialRampToValueAtTime(.55, n+.25);
    if (!schedTimer) schedTimer = setInterval(tick, 25);
    tick();
  }catch(e){}
}
function stopMusic(){
  if (!AC) return;
  try{
    musicOn = false; const n = AC.currentTime;
    musicBus.gain.cancelScheduledValues(n); musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, .0001), n);
    musicBus.gain.exponentialRampToValueAtTime(.0001, n+.35);
  }catch(e){}
}
const buzz = p => { try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} };

// ---------- récord ----------
let best = 0;
try{ best = parseInt(localStorage.getItem('orbita_best_v2')||'0',10) || 0; }catch(e){ best = 0; }
const saveBest = () => { try{ localStorage.setItem('orbita_best_v2', String(best)); }catch(e){} };

// ---------- estado ----------
let state = 'menu';
let rings, level, pLevel, camLevel, pAng, jumping, jumpT, combo, lastLand, score;
let astFade = 0, appear = 1;
let swallow = null, holeFlare = 0;
let streak = 0, jumpClear = 999, culprit = null, culpritT = 0, landPop = 0;
const PERFECT = 12;
let t = 0, timeScale = 1, slowTimer = 0, shake = 0, flash = 0, pulse = 0, deadT = 0, canRestart = false;
let particles = [], trail = [], texts = [], burns = [];
let sunLevel = -1.6, lastEaten = -2;
const debris = Array.from({length:60}, () => ({a:Math.random()*Math.PI*2, r:60 + Math.random()*180}));
const JUMP_DUR = .12;
let clock = 0, clockStart = 0;
function songTime(){
  if (state === 'menu') return t;
  if (AC && musicStart >= 0) return AC.currentTime - musicStart - (AC.outputLatency || AC.baseLatency || 0);
  return clock - clockStart;
}

// generador con semilla fija: el recorrido es siempre el mismo, como un nivel de Geometry Dash
const SEED = 20261007;
let rngState = SEED;
function rng(){ rngState |= 0; rngState = rngState + 0x6D2B79F5 | 0; let x = Math.imul(rngState ^ rngState >>> 15, 1 | rngState); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }
function makeRing(k){
  if (k === 0) return {obs:[], w:0, phase:0, gb:0, seg:1};
  const wall = k >= 7 && k % 7 === 0;
  const m = wall ? 4 : k < 12 ? 2 : k < 30 ? (rng() < .5 ? 1 : 2) : 1;   // cada cuántos golpes pasa una puerta
  const n = wall ? 4 : 6 + Math.floor(rng()*3);                          // puertas por anillo
  const dir = rng() < .5 ? -1 : 1;
  const w = dir*2*Math.PI/(n*m*TB);
  const off = Math.floor(rng()*m);
  const gb = -Math.PI/2 - w*(off*TB + JUMP_DUR);                          // si tocas en el golpe, caes en el centro del hueco
  const win = Math.max(.24 - k*.003, .13);                                // margen de tiempo para acertar
  const seg = 2*Math.PI/n, RREF = 130, r = 9;
  const half = win*Math.abs(w)/2 + (PR + r*.75 + 1.5)/RREF, stepA = 19/RREF;
  const len = seg - 2*half, count = Math.max(1, Math.floor(len/stepA) + 1), pad = (len - (count - 1)*stepA)/2;
  const obs = [];
  for (let j=0;j<n;j++){
    const c = gb + j*seg;
    for (let i=0;i<count;i++) obs.push({a: c + half + pad + i*stepA, r, seed: rng()*100});
  }
  return {obs, w, phase:0, gb, seg};
}
function ensureRings(){
  for (let k=Math.max(0,level-3); k<=level+6; k++) if (!rings.has(k)) rings.set(k, makeRing(k));
  for (const k of [...rings.keys()]) if (k < level-3) rings.delete(k);
}
function setup(){
  rngState = SEED; swallow = null; holeFlare = 0;
  rings = new Map(); level = 0; pLevel = 0; camLevel = 0; pAng = -Math.PI/2;
  jumping = false; jumpT = 0; combo = 0; lastLand = -9; score = 0;
  streak = 0; jumpClear = 999; culprit = null; culpritT = 0; landPop = 0; astFade = 0; appear = 1;
  particles = []; trail = []; texts = []; burns = []; timeScale = 1; slowTimer = 0;
  sunLevel = -1.6; lastEaten = -2;
  ensureRings();
}
function start(){
  setup(); state = 'play'; clockStart = clock; musicStart = -1;
  elScore.textContent = '0'; elBest.textContent = 'Récord ' + best;
  elHud.style.opacity = 1; elPanel.classList.add('hide');
  startMusic();
}
setup();

const rr = k => R0 + (k - camLevel)*GAP;
const PW = () => 1.1 + Math.min(level*.015, 1.0);

// distancia libre entre la luna y el asteroide más cercano del anillo k
function clearance(k, onlyApproaching){
  const ring = rings.get(k); if (!ring) return 999;
  const R = rr(k), px = Math.cos(pAng)*R, py = Math.sin(pAng)*R; let m = 999;
  for (const o of ring.obs){
    const oa = o.a + ring.phase;
    if (onlyApproaching){ const diff = Math.atan2(Math.sin(oa - pAng), Math.cos(oa - pAng)); if (diff*ring.w >= 0) continue; }
    m = Math.min(m, Math.hypot(px - Math.cos(oa)*R, py - Math.sin(oa)*R) - (PR + o.r));
  }
  return m;
}
function jump(){
  jumping = true; jumpT = 0;
  jumpClear = 999;
  noise(.07, 2500, 7000, .07, 'highpass');
}
function onLand(){
  const z = zoneOf(level);
  let perfect = false;
  const lr = rings.get(level);
  if (lr && lr.w){
    let dlt = (-Math.PI/2 - (lr.gb + lr.phase)) % lr.seg; if (dlt < 0) dlt += lr.seg; if (dlt > lr.seg/2) dlt -= lr.seg;
    perfect = Math.abs(dlt/lr.w) < .05;
  }
  let gain = 1;
  if (perfect){ streak = Math.min(streak + 1, 5); gain = 1 + streak; } else streak = 0;
  score += gain; elScore.textContent = score;
  thump(); pulse = Math.max(pulse, .6); landPop = 1; astFade = 1; appear = 0;
  if (perfect){
    cowbell(SCALE[Math.min(3 + streak, SCALE.length - 1)] + (streak >= 5 ? 12 : 0));
    texts.push({txt:'Perfecto +' + gain, x:0, y:-R0-26, life:1, size:16, col:z.s2});
    buzz(15);
  } else {
    cowbell(SCALE[level % 3]);
  }
  if (level % 25 === 0){
    texts.push({txt:'Zona ' + (level/25 + 1), x:0, y:-R0-64, life:1.6, size:28, col:BONE, center:true});
    flash = .35; buzz(20);
  }
  ensureRings();
}
function eatRings(){
  while (lastEaten + 1 <= sunLevel){
    lastEaten++;
    if (lastEaten >= 1) burns.push({k:lastEaten, life:1});
  }
}
function nearMiss(x,y){
  timeScale = .32; slowTimer = .2;
  texts.push({txt:'¡Cerca!', x, y:y-20, life:.9, size:14, col:BONE});
  noise(.3, 500, 5000, .22, 'bandpass'); buzz(12);
}
function die(x,y,cause,who){
  state = 'dead'; deadT = 0; canRestart = false;
  culprit = who || null; culpritT = who ? 1.4 : 0;
  const z = zoneOf(level);
  if (cause === 'sun'){
    const r0 = Math.hypot(x, y);
    swallow = {p:0, a:Math.atan2(y, x), r:r0, r0, done:false};
    shake = 0; flash = .15; timeScale = 1; slowTimer = 0;
    stopMusic(); suck(); buzz([20,60,20,60,20,60,40]);
  } else {
    swallow = null;
    shake = reduceMotion ? 0 : 16; flash = 1; timeScale = .03; slowTimer = .28;
    for (let i=0;i<80;i++){
      const a = Math.random()*Math.PI*2, v = 50 + Math.random()*260;
      particles.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1 + Math.random()*1.2, col: ['#2b63c9','#4fa35a','#ffffff','#8fd0ff'][i%4], s: 2 + Math.random()*3.5});
    }
    stopMusic(); noise(1, 3500, 60, .9, 'lowpass'); sub(); buzz([40,30,90]);
  }
  const prev = best;
  if (score > best){ best = score; saveBest(); }
  setTimeout(() => {
    let msg;
    if (score > prev && prev > 0) msg = '<div class="msg rec">Nuevo récord</div>';
    else if (score > prev) msg = '<div class="msg rec">Tu primer récord</div>';
    else if (best - score <= 3) msg = '<div class="msg">Te faltaron ' + (best - score + 1) + ' para tu récord</div>';
    else msg = '<div class="msg">Récord: ' + best + '</div>';
    const why = cause === 'sun' ? 'La Tierra cayó en el agujero negro. Salta más seguido.' : cause === 'hit' ? 'Saltaste tarde: el asteroide te llegó.' : 'Saltaste encima de un asteroide.';
    msg = '<div class="sub" style="margin-top:6px">' + why + '</div>' + msg;
    elPanel.innerHTML = '<div class="big">' + score + '</div>' + msg + '<div class="cta">Toca para reintentar</div>';
    elPanel.classList.remove('hide'); elHud.style.opacity = 0;
    setTimeout(() => { canRestart = true; }, 250);
  }, cause === 'sun' ? 2400 : 850);
}

// ---------- entrada ----------
function press(e){
  if (e && e.cancelable) e.preventDefault();
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  if (state === 'menu'){ start(); return; }
  if (state === 'dead'){ if (canRestart) start(); return; }
  if (state === 'play' && !jumping) jump();
}
window.addEventListener('pointerdown', press, {passive:false});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){ e.preventDefault(); if (!e.repeat) press(); }
});

// ---------- lógica ----------
function update(dt){
  // tiempo real: cámara lenta, sacudida, destello
  if (slowTimer > 0) slowTimer -= dt; else timeScale += (1 - timeScale)*Math.min(1, dt*5);
  culpritT = Math.max(0, culpritT - dt); astFade = Math.max(0, astFade - dt*5); appear = Math.min(1, appear + dt*5); landPop = Math.max(0, landPop - dt*6);
  shake = Math.max(0, shake - dt*40); flash = Math.max(0, flash - dt*2.6); pulse = Math.max(0, pulse - dt*3.5);
  if (AC) while (kickQueue.length && AC.currentTime >= kickQueue[0]){ kickQueue.shift(); pulse = 1; }
  const d = dt*timeScale; t += d;
  clock += dt;
  const st = songTime();
  for (const r of rings.values()) r.phase = r.w*st;

  if (state === 'play'){
    if (jumping){
      jumpT += d; const p = Math.min(jumpT/JUMP_DUR, 1);
      pLevel = level + (1 - Math.pow(1-p, 3));
      if (p >= 1){ jumping = false; level += 1; pLevel = level; onLand(); }
    }
    camLevel += (level - camLevel)*Math.min(1, d*6);
    // el sol crece y se come los anillos; si te quedas quieto, te alcanza
    const gap = pLevel - sunLevel;
    let sp = .22 + Math.min(level*.012, .7);
    if (gap > 2.2) sp += (gap - 2.2)*1.3;
    sunLevel += sp*d;
    eatRings();
    if (sunLevel >= pLevel - .18){
      const pr0 = rr(pLevel); die(Math.cos(pAng)*pr0, Math.sin(pAng)*pr0, 'sun'); return;
    }
    trail.push({a:pAng, l:pLevel}); if (trail.length > 22) trail.shift();

    const pr = rr(pLevel), px = Math.cos(pAng)*pr, py = Math.sin(pAng)*pr;
    const check = jumping ? [level+1] : [];
    for (const k of check){
      const ring = rings.get(k); if (!ring) continue;
      const R = rr(k);
      for (const o of ring.obs){
        const oa = o.a + ring.phase, ox = Math.cos(oa)*R, oy = Math.sin(oa)*R;
        const dist = Math.hypot(px-ox, py-oy);
        if (dist < PR + o.r*.75){ die(px, py, k === level ? 'hit' : 'jump', {k, o}); return; }
      }
    }
  } else {
    camLevel += (level - camLevel)*Math.min(1, d*6);
    if (state === 'dead' && sunLevel < level + 3 && (!swallow || swallow.done)){ sunLevel += .9*d; eatRings(); }
  }
  if (state === 'dead') deadT += d;
  holeFlare = Math.max(0, holeFlare - dt*1.4);
  if (swallow && !swallow.done){
    swallow.p = Math.min(1, swallow.p + dt/1.8);
    const p = swallow.p, hw = Math.max(rr(sunLevel), SUN);
    swallow.r = swallow.r0 + (hw*.88 - swallow.r0)*Math.pow(p, 2.2);
    swallow.a += (1.1 + 9*p*p)*dt;
    if (Math.random() < .35 + p){
      const a = swallow.a, ex = Math.cos(a)*swallow.r, ey = Math.sin(a)*swallow.r, v = 60 + Math.random()*70;
      particles.push({x:ex, y:ey, vx:-Math.sin(a)*v - Math.cos(a)*30, vy:Math.cos(a)*v - Math.sin(a)*30,
        life:.7 + Math.random()*.6, col:['#2b63c9','#4fa35a','#ffffff','#8fd0ff'][Math.floor(Math.random()*4)], s:1.5 + Math.random()*2});
    }
    if (p >= 1){
      swallow.done = true; flash = .7; pulse = 1; holeFlare = 1;
      shake = reduceMotion ? 0 : 10;
      noise(.6, 6000, 150, .5, 'lowpass'); thump(); buzz(70);
    }
  }

  for (const p of particles){
    const len = Math.hypot(p.x, p.y) || 1;
    p.vx += (-p.x/len*140)*d; p.vy += (-p.y/len*140)*d;
    p.vx *= Math.pow(.6, d); p.vy *= Math.pow(.6, d);
    p.x += p.vx*d; p.y += p.vy*d; p.life -= d*.8;
    if (len < Math.max(rr(sunLevel), SUN)) p.life -= d*3;
  }
  particles = particles.filter(p => p.life > 0);
  for (const tx of texts){ tx.life -= dt; if (!tx.center) tx.y -= dt*22; }
  texts = texts.filter(tx => tx.life > 0);
  for (const b of burns) b.life -= dt*1.6;
  const hw = Math.max(rr(sunLevel), SUN);
  for (const db of debris){
    db.r -= (14 + 1400/Math.max(db.r, 10))*dt; db.a += (.4 + 70/Math.max(db.r, 10))*dt;
    if (db.r < hw){ db.r = hw + 120 + Math.random()*120; db.a = Math.random()*Math.PI*2; }
  }
  burns = burns.filter(b => b.life > 0);
}

// ---------- dibujo ----------
const frac = x => x - Math.floor(x);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function drawAst(x, y, r, seed, rot, col, alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i=0;i<8;i++){
    const a = i/8*Math.PI*2, k = r*(.72 + .4*frac(Math.sin(seed + i*12.9898)*43758.5453));
    i ? ctx.lineTo(Math.cos(a)*k, Math.sin(a)*k) : ctx.moveTo(Math.cos(a)*k, Math.sin(a)*k);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
const CONT = [{x:.1,y:-.35,w:.42,h:.22},{x:.45,y:.15,w:.3,h:.38},{x:.8,y:-.05,w:.35,h:.25},{x:.62,y:.55,w:.22,h:.12}];
const CLOUD = [{x:.2,y:-.6,w:.5},{x:.55,y:-.1,w:.4},{x:.9,y:.4,w:.45}];
function drawEarth(px, py, rad){
  ctx.save();
  ctx.shadowColor = 'rgba(120,190,255,.7)'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#2b63c9'; ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = '#4fa35a';
  for (const c of CONT){ const x = px + (frac(c.x + t*.06)*2.8 - 1.4)*rad; ctx.beginPath(); ctx.ellipse(x, py + c.y*rad, c.w*rad, c.h*rad, .3, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const c of CLOUD){ const x = px + (frac(c.x + t*.11)*2.8 - 1.4)*rad; ctx.beginPath(); ctx.ellipse(x, py + c.y*rad, c.w*rad, .09*rad, 0, 0, Math.PI*2); ctx.fill(); }
  const sh = ctx.createLinearGradient(px, py + rad, px, py - rad);
  sh.addColorStop(0, 'rgba(10,14,30,0)'); sh.addColorStop(.5, 'rgba(10,14,30,.15)'); sh.addColorStop(1, 'rgba(10,14,30,.75)');
  ctx.fillStyle = sh; ctx.fillRect(px - rad, py - rad, rad*2, rad*2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(143,208,255,.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(px, py, rad + .6, 0, Math.PI*2); ctx.stroke();
}
function render(){
  const z = zoneOf(level);
  ctx.save();
  ctx.fillStyle = z.bg; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  // estrellas
  const sr = Math.max(W, H)*.62;
  for (const s of stars){
    const a = s.a + t*.015, x = CX + Math.cos(a)*s.r*sr, y = CY + Math.sin(a)*s.r*sr;
    ctx.globalAlpha = .12 + .22*(.5 + .5*Math.sin(t*1.3 + s.tw));
    ctx.fillStyle = BONE; ctx.fillRect(x, y, s.s*.8, s.s*.8);
  }
  ctx.globalAlpha = 1;

  // agujero negro: crece desde el centro y se traga los anillos
  const sunW = Math.max(rr(sunLevel), SUN), sunR = (sunW + pulse*2)*S;
  const g = ctx.createRadialGradient(CX, CY, sunR*.9, CX, CY, sunR*2.5);
  g.addColorStop(0, rgba(z.s2,.42)); g.addColorStop(.35, rgba(z.s2,.1)); g.addColorStop(1, rgba(z.s2,0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, sunR*2.5, 0, Math.PI*2); ctx.fill();
  // restos cayendo en espiral
  for (const db of debris){
    ctx.globalAlpha = .4*clamp((db.r - sunW)/40, 0, 1); ctx.fillStyle = BONE;
    ctx.fillRect(CX + Math.cos(db.a)*db.r*S - .8, CY + Math.sin(db.a)*db.r*S - .8, 1.6, 1.6);
  }
  // disco de acreción girando
  const lw = Math.max(1, Math.min(sunR*.05, 4));
  for (let i=0;i<14;i++){
    const r2 = sunR*(1.06 + i*.03) + i*lw*.6, a0 = t*(3.4 - i*.14) + i*1.7;
    ctx.globalAlpha = .6 - i*.035; ctx.strokeStyle = i%3 === 0 ? z.s1 : z.s2; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(CX, CY, r2, a0, a0 + 1.4 + (i%4)*.55); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // horizonte de eventos y anillo de luz
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(CX, CY, sunR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = z.s1; ctx.lineWidth = Math.max(1.2, Math.min(sunR*.035, 3)) + pulse*1.5 + holeFlare*6;
  ctx.shadowColor = z.s2; ctx.shadowBlur = 16 + pulse*14 + holeFlare*40;
  ctx.beginPath(); ctx.arc(CX, CY, sunR*1.01, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0;
  // anillos que el agujero negro acaba de tragarse: se estiran y caen dentro
  for (const b of burns){
    const R = sunW*S*(1 + .3*b.life);
    ctx.globalAlpha = b.life*.8; ctx.strokeStyle = z.s1; ctx.lineWidth = 5*b.life + 1;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // anillos y asteroides
  const keys = [...rings.keys()].sort((a,b) => a-b);
  for (const k of keys){
    const R = rr(k); if (k <= sunLevel || R < sunW + 2) continue;
    const ring = rings.get(k), zc = zoneOf(k);
    let alpha;
    if (k < level) alpha = clamp((R - SUN)/(R0 - SUN), 0, 1)*.35;
    else alpha = [1, .85, .14, .07, .04, .02, .01][Math.min(k-level, 6)];
    alpha *= clamp((226 - R)/30, 0, 1);
    if (alpha <= .01) continue;
    const cur = k === level && state !== 'dead';
    ctx.globalAlpha = alpha*(cur ? .9 : .55); ctx.strokeStyle = zc.ring; ctx.lineWidth = (cur ? 2 : 1) + (cur ? pulse*1.2 : 0);
    ctx.beginPath(); ctx.arc(CX, CY, R*S, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = alpha;
    // asteroides visibles solo en el anillo al que vas a saltar
    let aA = 0, sc = 1;
    if (k === level + 1){ aA = appear; sc = .4 + .6*appear; }
    else if (k === level && astFade > 0){ aA = astFade; sc = .5 + .5*astFade; }
    if (aA > .01) for (const o of ring.obs){
      const oa = o.a + ring.phase;
      drawAst(CX + Math.cos(oa)*R*S, CY + Math.sin(oa)*R*S, o.r*S*sc, o.seed, t*.8 + o.seed, zc.ast, aA);
    }
  }
  ctx.globalAlpha = 1;

  // marca de dónde vas a caer: justo encima de ti
  if (state === 'play' && !jumping){
    const Rn = rr(level+1)*S, Rc = rr(level)*S;
    ctx.globalAlpha = .22; ctx.strokeStyle = BONE; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(CX, CY - Rc - PR*S - 3); ctx.lineTo(CX, CY - Rn + 6); ctx.stroke(); ctx.setLineDash([]);
    const bt = Math.pow(1 - frac(songTime()/TB), 3);
    ctx.globalAlpha = .45 + .55*bt; ctx.lineWidth = 3 + bt*2;
    ctx.beginPath(); ctx.arc(CX, CY, Rn, -Math.PI/2 - .07 - bt*.03, -Math.PI/2 + .07 + bt*.03); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // el asteroide que te mató, señalado
  if (culprit && culpritT > 0){
    const ring = rings.get(culprit.k);
    if (ring){
      const oa = culprit.o.a + ring.phase, R = rr(culprit.k)*S;
      ctx.globalAlpha = Math.min(1, culpritT); ctx.strokeStyle = z.s2; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(CX + Math.cos(oa)*R, CY + Math.sin(oa)*R, Math.max(1, (culprit.o.r + 7)*S), 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // estela y jugador
  if (state !== 'dead'){
    for (let i=1;i<trail.length;i++){
      const p0 = trail[i-1], p1 = trail[i], r0 = rr(p0.l)*S, r1 = rr(p1.l)*S;
      ctx.globalAlpha = (i/trail.length)*.3; ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = (i/trail.length)*PR*1.4*S;
      ctx.lineCap = 'round'; ctx.beginPath();
      ctx.moveTo(CX + Math.cos(p0.a)*r0, CY + Math.sin(p0.a)*r0);
      ctx.lineTo(CX + Math.cos(p1.a)*r1, CY + Math.sin(p1.a)*r1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const pr = rr(pLevel)*S, px = CX + Math.cos(pAng)*pr, py = CY + Math.sin(pAng)*pr;
    drawEarth(px, py, PR*S*1.15*(jumping ? 1.1 : 1)*(1 + landPop*.25));
  }
  if (swallow && !swallow.done){
    const p = swallow.p, sr = swallow.r*S;
    const px = CX + Math.cos(swallow.a)*sr, py = CY + Math.sin(swallow.a)*sr;
    const rad = PR*S*1.15*(1 - .5*p);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(Math.atan2(CY - py, CX - px) - Math.PI/2);
    ctx.translate(0, rad*1.4*p*p); ctx.scale(1 - .6*p, 1 + 2.8*p*p);
    ctx.globalAlpha = 1 - clamp((p - .82)/.18, 0, 1);
    drawEarth(0, 0, rad);
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2);
    ctx.fillStyle = rgba(z.s2, .35*p); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,' + (.85*p*p) + ')'; ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // partículas
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col;
    ctx.fillRect(CX + p.x*S - p.s/2, CY + p.y*S - p.s/2, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // textos flotantes
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of texts){
    ctx.globalAlpha = clamp(tx.life, 0, 1);
    ctx.font = '900 ' + tx.size + 'px Unbounded, system-ui, sans-serif';
    ctx.fillStyle = tx.col;
    ctx.fillText(tx.txt, CX + tx.x*S, CY + tx.y*S);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play'){
    const danger = clamp((1.1 - (pLevel - sunLevel))/.8, 0, 1);
    if (danger > 0){
      const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.35, W/2, H/2, Math.max(W,H)*.75);
      vg.addColorStop(0, 'rgba(255,40,70,0)'); vg.addColorStop(1, 'rgba(255,40,70,' + (danger*(.35 + .15*Math.sin(t*14))) + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
  }
  if (flash > 0){ ctx.globalAlpha = flash*.35; ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05); last = now;
  requestAnimationFrame(frame);
  try{ update(dt); render(); }catch(e){ try{ ctx.restore(); }catch(_){} console.error(e); }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
