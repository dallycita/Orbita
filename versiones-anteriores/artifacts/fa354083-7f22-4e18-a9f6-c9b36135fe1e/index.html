<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · Prototipo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1220; --fg:#ece6d8; --muted:#8b8f9e; --sun:#ff5a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1220; --fg:#ece6d8; } }
:root[data-theme="dark"]{ --bg:#0d1220; --fg:#ece6d8; }
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:'Unbounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#wallet{position:absolute;top:max(2.4vh,14px);right:14px;z-index:7;padding:6px 12px;border-radius:999px;background:rgba(13,18,32,.6);border:1px solid rgba(255,211,107,.4);color:#ffd36b;font-weight:500;font-size:14px;pointer-events:none;transition:opacity .3s;}
#wallet.pop{animation:wpop .45s ease-out;}
@keyframes wpop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
#hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none;transition:opacity .3s;}
#score small{font-size:.38em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:.15em;}
#score{font-weight:900;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.02em;}
#best{margin-top:6px;font-weight:300;font-size:13px;color:var(--muted);}
#scorewrap{position:relative;display:grid;place-items:center;margin:0 auto;}
#scorewrap.arc{width:112px;height:112px;}
#arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);display:none;}
#scorewrap.arc #arc{display:block;}
#arc circle{fill:none;stroke-width:2.5;}
#arc .bg{stroke:rgba(236,230,216,.12);}
#arc .fg{stroke:var(--sun);stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset .25s ease-out,stroke .2s;}
.chips{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:auto;}
.chips .lbl{font-weight:300;font-size:12px;color:var(--muted);}
.chips .row{display:flex;gap:8px;}
.chip{font:500 12px 'Unbounded',system-ui,sans-serif;color:var(--muted);background:transparent;border:1px solid rgba(236,230,216,.2);border-radius:999px;padding:8px 13px;cursor:pointer;}
.chip.on{color:var(--fg);border-color:var(--sun);}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}
#panel.hide .chips{pointer-events:none;}
@keyframes hop{0%{translate:0 0;scale:1}40%{translate:0 -6px;scale:1.07}100%{translate:0 -2px;scale:1.03}}
@keyframes hopbig{0%{scale:1}45%{scale:1.1}100%{scale:1.05}}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  #home .sm:hover,#home .opt:hover,#levels .arrow:hover,#levels .back:hover,#levels .play:not([disabled]):hover,.chip:hover{animation:hop .35s ease-out forwards;}
  #home .bigplay:hover{animation:hopbig .4s ease-out forwards;box-shadow:0 0 0 10px rgba(255,90,31,.2),0 0 60px rgba(255,90,31,.55);}
  #home .sm:hover,#home .opt:hover,.chip:hover{border-color:rgba(236,230,216,.5);}
}
#home .playrow{display:flex;align-items:center;gap:26px;}
#home .spacer{width:68px;height:68px;}
#home .plan{position:relative;width:68px;height:68px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 40%,#1d2440,#0f1426);
  box-shadow:0 0 0 2px rgba(143,208,255,.35),0 0 22px rgba(143,208,255,.25);display:flex;align-items:center;justify-content:center;}
#home .plan svg{width:52px;height:52px;}
#home .plan .orb{position:absolute;inset:-7px;border-radius:50%;border:1.5px dashed rgba(143,208,255,.5);animation:orbspin 9s linear infinite;}
@keyframes orbspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#home .plan .orb{animation:none}}
#home .plabel{position:absolute;top:100%;margin-top:9px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;color:#8fd0ff;white-space:nowrap;}
@media (hover:hover) and (prefers-reduced-motion:no-preference){#home .plan:hover{animation:hopbig .4s ease-out forwards;box-shadow:0 0 0 3px rgba(143,208,255,.6),0 0 34px rgba(143,208,255,.5);}}
#planets{position:absolute;inset:0;z-index:6;background:transparent;transition:opacity .3s;pointer-events:none;text-align:center;}
#planets.off{opacity:0;}
#planets.off *{pointer-events:none !important;}
#planets button{pointer-events:auto;cursor:pointer;font-family:'Unbounded',system-ui,sans-serif;}
#planets .back{position:absolute;top:max(3vh,18px);left:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(236,230,216,.22);background:rgba(13,18,32,.6);color:var(--fg);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;}
#planets .ptop{position:absolute;left:0;right:0;top:max(3vh,18px);font-size:13px;letter-spacing:.12em;color:var(--muted);line-height:40px;}
#planets .pcount{position:absolute;left:0;right:0;top:calc(max(3vh,18px) + 36px);font-size:11px;color:var(--muted);letter-spacing:.08em;}
#planets .arrow{position:absolute;top:38%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(236,230,216,.25);background:rgba(13,18,32,.5);color:var(--fg);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;}
#planets .arrow.l{left:12px;} #planets .arrow.r{right:12px;}
#planets .pinfo{position:absolute;left:0;right:0;bottom:max(6vh,36px);padding:0 28px;display:flex;flex-direction:column;align-items:center;}
#planets .pname{font-size:clamp(28px,8vw,40px);font-weight:500;color:#fff;line-height:1.1;}
#planets .pchip{margin-top:10px;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:11px;letter-spacing:.06em;color:#fff;}
#planets .pdesc{margin:14px 0 0;max-width:32ch;font-size:14px;line-height:1.6;color:#fff;opacity:.9;font-weight:400;}
#planets .plock{margin-top:12px;max-width:32ch;font-size:12px;line-height:1.5;color:var(--muted);}
#planets .pbtn{margin-top:20px;min-width:200px;padding:13px 22px;border-radius:999px;border:0;background:var(--sun);color:#fff;font-size:14px;font-weight:500;}
#planets .pbtn[disabled]{background:transparent;border:1px solid rgba(255,255,255,.4);cursor:default;}
#planets .scanbtn{margin-top:14px;padding:9px 18px;border-radius:999px;border:1px solid rgba(143,208,255,.55);background:rgba(13,18,32,.5);color:#8fd0ff;font-size:12px;letter-spacing:.12em;}
#planets .pinfo{transition:opacity .3s;}
#planets.scanning .pinfo{opacity:0;}
#planets.scanning .pinfo *{pointer-events:none !important;}
#planets .pstats{position:absolute;left:0;right:0;top:31%;padding:0 24px;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .4s;}
#planets.scanning .pstats{opacity:1;}
#planets:not(.scanning) .pstats *{pointer-events:none !important;}
#planets .sname{font-size:22px;font-weight:500;color:#fff;}
#planets .srow{width:100%;max-width:340px;margin-top:12px;text-align:left;}
#planets .shead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#fff;}
#planets .shead small{font-size:10px;color:var(--muted);margin-left:6px;font-weight:400;}
#planets .sval{font-weight:500;}
#planets .sdat{font-size:10.5px;color:var(--muted);margin-top:3px;}
#planets .sbar{position:relative;height:6px;border-radius:3px;background:#22283a;margin-top:6px;overflow:hidden;}
#planets .sbar i{position:absolute;top:0;bottom:0;left:50%;width:0;border-radius:3px;transition:width .55s ease-out,left .55s ease-out;}
#planets .sbar b{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55);}
#planets .spips{display:flex;gap:6px;margin-top:6px;}
#planets .spips i{width:10px;height:10px;border-radius:50%;border:1.5px solid #8fd0ff;opacity:0;transition:opacity .3s;}
#planets .spips i.on{background:#8fd0ff;}
#planets .spower{width:100%;max-width:340px;margin-top:16px;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(13,18,32,.55);text-align:left;box-sizing:border-box;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;}
#planets .spower.on{opacity:1;transform:none;}
#planets .spk{font-size:10px;letter-spacing:.12em;color:var(--muted);}
#planets .spn{margin-top:4px;font-size:15px;font-weight:500;color:#fff;}
#planets .spd{margin-top:4px;font-size:12px;line-height:1.5;color:#fff;opacity:.9;font-weight:400;}
#planets .spf{margin-top:6px;font-size:11px;line-height:1.5;color:#8fd0ff;font-weight:400;}
#planets .spsoon{margin-top:6px;font-size:10.5px;line-height:1.4;color:var(--muted);}
#planets .sclose{margin-top:14px;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:12px;letter-spacing:.08em;}
#planets button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;}

#home{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:max(7vh,44px);transition:opacity .35s;pointer-events:none;
  background:linear-gradient(to bottom, rgba(11,15,28,.15) 0%, rgba(11,15,28,0) 35%, rgba(11,15,28,.55) 70%, rgba(11,15,28,.85) 100%);}
#home.off{opacity:0;}
#home.off *{pointer-events:none !important;}
#home button{pointer-events:auto;font-family:'Unbounded',system-ui,sans-serif;cursor:pointer;}
#home .bigplay{width:104px;height:104px;border-radius:50%;border:0;background:var(--sun);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(255,90,31,.14),0 0 40px rgba(255,90,31,.35);transition:transform .15s;}
#home .bigplay:active{transform:scale(.94);}
#home .bigplay svg{width:40px;height:40px;margin-left:6px;}
#home .playlbl{margin-top:14px;font-size:14px;font-weight:500;letter-spacing:.12em;color:var(--fg);}
#home .row{display:flex;gap:12px;margin-top:30px;}
#home .sm{min-width:92px;padding:11px 14px;border-radius:999px;border:1px solid rgba(236,230,216,.22);background:rgba(13,18,32,.6);color:var(--fg);font-size:12px;font-weight:500;}
#home .sheet{position:absolute;left:50%;bottom:max(7vh,44px);transform:translateX(-50%);width:min(320px,86vw);background:#151a2b;border:1px solid rgba(236,230,216,.14);
  border-radius:22px;padding:20px;box-sizing:border-box;display:none;flex-direction:column;gap:12px;pointer-events:auto;}
#home .sheet.on{display:flex;}
#home .sheet h3{margin:0 0 4px;font-size:15px;font-weight:500;color:var(--fg);text-align:center;}
#home .sheet .opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid rgba(236,230,216,.14);background:transparent;color:var(--fg);font-size:13px;font-weight:400;}
#home .sheet .opt b{font-weight:500;color:var(--muted);}
#home .sheet .danger{color:var(--fg);}
#home button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;}
#levels .back{position:absolute;top:max(3vh,18px);left:14px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid rgba(236,230,216,.22);
  background:rgba(13,18,32,.6);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#levels{position:absolute;inset:0;z-index:5;background:#0b0f1c;transition:opacity .3s;touch-action:pan-x pan-y;overflow:hidden;}
#levels.off{opacity:0;pointer-events:none;}
#levels .track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;}
#levels .track::-webkit-scrollbar{display:none;}
#levels .page{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(9vh,56px) 64px max(11vh,72px);box-sizing:border-box;text-align:center;position:relative;}
#levels .page::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 38%, var(--lc) 0%, transparent 70%);opacity:.14;pointer-events:none;}
#levels .num{position:relative;font-size:11px;color:var(--muted);letter-spacing:.14em;}
#levels .art{position:relative;width:min(46vmin,230px);height:min(46vmin,230px);margin:14px 0 6px;}
#levels .art svg{width:100%;height:100%;display:block;}
#levels .name{position:relative;font-weight:500;font-size:clamp(24px,7vw,34px);color:var(--fg);line-height:1.1;}
#levels .badge{position:relative;display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;border:1.5px solid currentColor;font-size:12px;font-weight:500;letter-spacing:.04em;}
#levels .fact{position:relative;margin:16px 0 0;max-width:30ch;font-size:14px;line-height:1.6;color:var(--fg);opacity:.82;font-weight:400;}
#levels .stats{position:relative;margin-top:20px;width:100%;max-width:300px;}
#levels .row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
#levels .row b{color:var(--fg);font-weight:500;}
#levels .bar{height:6px;border-radius:3px;background:#22283a;margin-top:7px;overflow:hidden;}
#levels .bar i{display:block;height:100%;background:var(--lc);}
#levels .nuevo{position:relative;margin-top:12px;font-size:11px;color:var(--muted);}
#levels .play{position:relative;margin-top:22px;width:100%;max-width:300px;padding:14px;border-radius:999px;border:0;background:var(--sun);color:#fff;font:500 15px 'Unbounded',system-ui,sans-serif;cursor:pointer;}
#levels .play[disabled]{background:#22283a;color:var(--muted);cursor:default;}
#levels .top{position:absolute;left:0;right:0;top:max(3vh,18px);text-align:center;font-size:13px;color:var(--muted);letter-spacing:.06em;pointer-events:none;z-index:2;}
#levels .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid rgba(236,230,216,.22);
  background:rgba(13,18,32,.6);color:var(--fg);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s;}
#levels .arrow.l{left:10px;} #levels .arrow.r{right:10px;}
#levels .arrow[disabled]{opacity:0;pointer-events:none;}
#levels .foot{position:absolute;left:0;right:0;bottom:max(3vh,18px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2;}
#levels .dots{display:flex;gap:8px;}
#levels .dots i{width:8px;height:8px;border-radius:50%;background:#3a4055;transition:background .2s,transform .2s;}
#levels .dots i.on{background:var(--fg);transform:scale(1.15);}
#levels .lv-foot{font:400 12px 'Unbounded',system-ui,sans-serif;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;}
#levels button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;}
.chip.act{pointer-events:auto;margin-top:18px;}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 24px;transition:opacity .25s;}
#panel.hide{opacity:0;}
#panel.top{justify-content:flex-start;padding-top:max(9vh,56px);}
.title{font-weight:900;font-size:clamp(52px,16vw,108px);letter-spacing:-.04em;line-height:.9;
  color:var(--fg);}
.big{font-weight:900;font-size:clamp(72px,24vw,140px);line-height:.9;letter-spacing:-.04em;
}
.sub{margin-top:18px;font-weight:300;font-size:15px;line-height:1.6;color:var(--muted);max-width:30ch;}
.msg{margin-top:14px;font-weight:500;font-size:16px;color:var(--fg);}
.msg.rec{color:var(--sun);}
.cta{margin-top:34px;font-weight:500;font-size:14px;color:var(--fg);animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .cta{animation:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="wallet" style="opacity:0">★ 0</div>
  <div id="hud" style="opacity:0"><div id="scorewrap"><svg id="arc" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44"/></svg><div id="score">0</div></div><div id="best">Récord 0</div></div>
  <div id="home" class="off"></div>
  <div id="planets" class="off"></div>
  <div id="levels" class="off"></div>
  <div id="panel">
    <div class="cta" style="margin-top:46vh">Toca para comenzar</div>
  </div>
</div>
<script>
(() => {
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const elWrap = document.getElementById('scorewrap'), elArcFg = document.querySelector('#arc .fg');
// tres formas de mostrar el récord, para comparar
const MODES = [['faltan','Faltan N'],['arco','Arco'],['nada','Nada']];
let hudMode = 'faltan';
const MUSICS = [['espacial','Espacial'],['synthwave','Synthwave'],['phonk','Phonk']];
let musicStyle = 'espacial';
function chipsHTML(){ return ''; }   // indicador fijo en "Faltan N"; la música cambia sola
{ const c0 = document.getElementById('chips0'); if (c0) c0.innerHTML = chipsHTML(); }
function refreshChips(){ document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.mode ? c.dataset.mode === hudMode : c.dataset.music === musicStyle)); }
const elHud = document.getElementById('hud'), elPanel = document.getElementById('panel');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- medidas ----------
let W, H, DPR, S, CX, CY;
const R0 = 96, GAP = 34, PR = 8, SUN = 16;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cvs.getBoundingClientRect(); W = r.width; H = r.height;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.min(W/2/170, H/2/250);
  CX = W/2; CY = H*0.62;
}
window.addEventListener('resize', resize); resize();

// ---------- zonas (cambian cada 25 anillos) ----------
const BONE = '#ece6d8';
const ZONES = [
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#0d1220'},
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#120f1e'},
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#0f1220'},
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#120c22'},
];
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
const ZONE_AND = {ring:'#ece6d8', ast:'#ece6d8', s1:'#ffe2b0', s2:'#ff5a1f', bg:'#060714'};
const ZONE_MAG = {ring:'#ece6d8', ast:'#ece6d8', s1:'#ffe2b0', s2:'#ff5a1f', bg:'#04070e'};
const zoneOf = k => (lvl === 2 && !tutorial) ? ZONE_MAG : (lvl === 1 && !tutorial) ? ZONE_AND : ZONES[Math.floor(k/25) % ZONES.length];

// ---------- estrellas ----------
const stars = Array.from({length:140}, () => ({a:Math.random()*Math.PI*2, r:Math.sqrt(Math.random())*1.2, s:Math.random()*1.3+.3, tw:Math.random()*6}));

// ---------- audio ----------
let AC = null, master = null, musicBus = null, NOISE = null, shaper = null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = (typeof muted !== 'undefined' && muted) ? 0 : .6;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = .0001; musicBus.connect(master);
    const len = AC.sampleRate*2; NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC = null; }
}
const ROOT = 415.3; // tonalidad: Sol# menor
const SCALE = [0,3,5,7,10,12,15,17];
function cowbell(semi){
  if (!AC) return; try{
    const t0 = AC.currentTime, f = ROOT*Math.pow(2, semi/12);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = 'square'; o1.frequency.value = f; o2.frequency.value = f*1.48;

  const angs = ring.obs.map(o => ((o.a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2)).sort((x, y) => x - y);
  let bestGap = -1, bestA = 0;
  for (let i=0;i<angs.length;i++){ const a0 = angs[i], a1 = i + 1 < angs.length ? angs[i + 1] : angs[0] + Math.PI*2, gap = a1 - a0; if (gap > bestGap){ bestGap = gap; bestA = a0 + gap/2; } }
  return Object.assign({a: bestA, got: false}, extra);
}
function drawNebula(x, y, sz, al){

}
function drawPulsar(x, y, sz, al){

    const bx = Math.cos(a + sg), by = Math.sin(a + sg), px = -by, py = bx, L = sz*4.2;

}

function makeRing(k){
  if (k === 0) return {obs:[], w:0, phase:0, type:'clasico'};
  const type = ringType(k), dir = rng() < .5 ? -1 : 1, base = rng()*Math.PI*2, obs = [];
  const ring = {obs, w:0, phase:0, type};
  if (type === 'vacio'){ ring.w = dir*.3; return ring; }
  if (type === 'uno'){ obs.push({a: base, r: 9, seed: rng()*100}); ring.w = dir*.45; return ring; }
  if (type === 'barrera'){
    for (let a = 0; a < Math.PI*2 - 1e-6; a += .2) obs.push({a: base + a, r: 9, seed: rng()*100});
    ring.w = dir*.25; return ring;
  }
  if (type === 'muralla'){
    // anillo casi lleno con uno o dos huecos
    const gaps = 2, hg = .46, stepA = .22;          // nivel 1: murallas siempre con dos huecos amplios
    for (let a = 0; a < Math.PI*2 - 1e-6; a += stepA){
      let inGap = false;
      for (let g=0; g<gaps; g++){ const c = g*Math.PI*2/gaps, d = Math.atan2(Math.sin(a - c), Math.cos(a - c)); if (Math.abs(d) < hg) inGap = true; }
      if (!inGap) obs.push({a: base + a, r: 9, seed: rng()*100});
    }
    ring.w = dir*Math.min(.5 + k*.006, .8)*(lvl === 2 && !tutorial ? 1.08 : 1);
  } else if (type === 'respiracion'){
    // asteroides grandes que se encogen en cada golpe: ahí se abre el paso
    // 16 asteroides: grandes cierran el anillo, chicos dejan pasar a la Tierra con margen.
    // El giro va con la música: en cada golpe en que se encogen, hay un hueco justo encima de ti.
    const n = 16, sig = Math.PI*2/n;
    ring.w = dir*sig/(4*TB); ring.sync = true;
    const off = -Math.PI/2 - sig/2 - ring.w*JUMP_DUR;
    for (let i=0;i<n;i++) obs.push({a: off + i*sig, r: 24, seed: rng()*100});
  } else if (type === 'contragiro'){
    // dos arcos que giran en sentidos opuestos
    const m = 10, stepA = .22;
    for (let i=0;i<m;i++){ obs.push({a: base + i*stepA, r: 9, seed: rng()*100, dir: 1}); obs.push({a: base + Math.PI + i*stepA, r: 9, seed: rng()*100, dir: -1}); }
    ring.w = Math.min(.42 + k*.005, .7);
  } else if (type === 'escalera'){
    // todos los anillos del bloque giran igual y con el hueco alineado: se pueden encadenar
    let bs = k; while (bs > 1 && ringType(bs - 1) === 'escalera') bs--;
    const bdir = bs % 2 ? 1 : -1, hg = .45, stepA = .22;
    for (let a = 0; a < Math.PI*2 - 1e-6; a += stepA){
      let inGap = false;
      for (let g=0; g<3; g++){ const c = g*Math.PI*2/3, d = Math.atan2(Math.sin(a - c), Math.cos(a - c)); if (Math.abs(d) < hg) inGap = true; }
      if (!inGap) obs.push({a: a + bs*1.3, r: 9, seed: rng()*100});
    }
    ring.w = bdir*.8; ring.phase = ring.w*t;
  } else if (type === 'freno'){
    // gira y de pronto cambia de sentido
    const n = k < 30 ? 2 : 3;
    for (let i=0;i<n;i++) obs.push({a: base + i*(Math.PI*2/n) + (rng()-.5)*.4, r: 9.5, seed: rng()*100});
    ring.w = dir*Math.min(.9 + k*.01, 1.6); ring.sgn = 1; ring.ft = 0; ring.fp = 1.2 + rng()*.8; ring.flash = 0;
  } else {
    const size = () => (k < 20 ? 9 : 9 + rng()*1.5);

    const sp = Math.min(.55 + k*.01, 1.05) * (.85 + rng()*.3);

    ring.w = dir*sp*(lvl === 2 && !tutorial ? 1.08 : 1);
  }
  if (!tutorial && (type === 'clasico' || type === 'muralla' || type === 'respiracion')){
    if (lvl >= 2 && OBJ_NEBULA.has(k)) ring.obj = placeInGap(ring, {kind:'nebula'});
    else if (lvl >= 2 && OBJ_PULSAR.has(k)) ring.obj = placeInGap(ring, {kind:'pulsar'});

}

function clearance(k, onlyApproaching){
  const ring = rings.get(k); if (!ring) return 999;
  const R = rr(k), px = Math.cos(pAng)*R, py = Math.sin(pAng)*R; let m = 999;
  for (const o of ring.obs){
    const oa = obsAng(ring, o);
    if (onlyApproaching){ const diff = Math.atan2(Math.sin(oa - pAng), Math.cos(oa - pAng)); if (diff*(o.dir || 1)*ring.w*(ring.sgn || 1) >= 0) continue; }
    m = Math.min(m, Math.hypot(px - Math.cos(oa)*R, py - Math.sin(oa)*R) - (PR + obsRad(ring, o)));

}

function update(dt){

        // la Tierra atraviesa el anillo y lo rompe
        crossed = true; shake = reduceMotion ? 0 : 6; pulse = 1;
        const R = rr(level + 1), cx0 = Math.cos(pAng)*R, cy0 = Math.sin(pAng)*R;
        for (let i=0;i<34;i++){
          const a = Math.random()*Math.PI*2, v = 60 + Math.random()*200;
          particles.push({x:cx0, y:cy0, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.6 + Math.random()*.6, col: i%2 ? BONE : zoneOf(level).s2, s:2 + Math.random()*3});
        }
        noise(.35, 5000, 200, .4, 'lowpass');
      }
      if (p >= 1){ jumping = false; level += jumpTarget; pLevel = level; onLand(jumpTarget === 2); jumpTarget = 1; }
    }
    camLevel += (level - camLevel)*Math.min(1, d*6);
    // el sol crece y se come los anillos; si te quedas quieto, te alcanza

  }

}

    if (ring.flash > 0 && k === level + 1){ ctx.globalAlpha = ring.flash; ctx.strokeStyle = zc.s2; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, R*S, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = alpha; }

    let aA = 0, sc = 1;
    if (k === level + 1){ aA = appear; sc = .4 + .6*appear; }
    else if (k === level && astFade > 0){ aA = astFade; sc = .5 + .5*astFade; }
    if (aA > .01) for (const o of ring.obs){
      const oa = obsAng(ring, o);
      drawAst(CX + Math.cos(oa)*R*S, CY + Math.sin(oa)*R*S, obsRad(ring, o)*S*sc, o.seed, t*.8 + o.seed, zc.ast, aA);

      if (ring.obj && !ring.obj.got){ const sa = ring.obj.a + ring.phase, ox = CX + Math.cos(sa)*R*S, oy = CY + Math.sin(sa)*R*S; if (ring.obj.kind === 'pulsar') drawPulsar(ox, oy, 4.5*S, aA); else drawNebula(ox, oy, 5*S, aA); }

      const la = -Math.PI/2 + .45; ctx.globalAlpha = vis; ctx.fillStyle = z.s2; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.arc(CX, CY, Rs, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      const la = -Math.PI/2 - .45;
      ctx.globalAlpha = vis; ctx.fillStyle = '#8fd0ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.globalAlpha = .85; ctx.lineWidth = 3;

const INTRO_END = 15.9, T_ZOOM = 13.9, ZOOM_DUR = 1.8, T_ENTER = 2.2, T_ARRIVE = 4.1, T_SUN_END = 5.8, T_DISK_END = 6.2, T_EARTH = 6.6;

introSetup();
const once = k => cues[k] ? false : (cues[k] = true);
const easeIO = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2;

function startIntro(){ homeAmbience(false); state = 'intro'; introSetup(); elPanel.classList.add('hide'); elHud.style.opacity = 0; introDrone(true); }
const introZoomK = () => easeIO(clamp((introT - T_ZOOM)/ZOOM_DUR, 0, 1));
const EARTH_W = .9*Math.pow(60/84, 1.5);
const holeGameR = () => Math.max(rr(sunLevel), SUN)*S;
const zoomZ = () => holeGameR()/(20*SI);

function introDrone(on){
  if (!AC) return; try{
    const n = AC.currentTime;
    if (on){
      const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
      o.type = 'sine'; o.frequency.value = 55; o2.type = 'sawtooth'; o2.frequency.value = 55.6;
      lp.type = 'lowpass'; lp.frequency.value = 220;
      g.gain.setValueAtTime(.0001, n); g.gain.exponentialRampToValueAtTime(.22, n + 2.5);
      o.connect(g); o2.connect(lp); lp.connect(g); g.connect(master); o.start(n); o2.start(n);
      droneNodes = {o, o2, g};
    } else if (droneNodes){
      const d = droneNodes; droneNodes = null;
      d.g.gain.cancelScheduledValues(n); d.g.gain.setValueAtTime(Math.max(d.g.gain.value, .0001), n);
      d.g.gain.exponentialRampToValueAtTime(.0001, n + .6); d.o.stop(n + .7); d.o2.stop(n + .7);

}
function eatSound(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(320, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 1.2);

    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.35);
    noiseHit(t0, 1.1, 'lowpass', 2200, .3, master, 80);
  }catch(e){}
}

function updateIntro(dt){
  if (state === 'intro') introT += dt;
  t += dt;
  flash = Math.max(0, flash - dt*2.2); holeFlare = Math.max(0, holeFlare - dt*1.4); pulse = Math.max(0, pulse - dt*3.5); shake = Math.max(0, shake - dt*25);
  SI = Math.max(.4, Math.min(W/2/224, (CY - 80)/224));
  if (introT >= T_ENTER && once('enter')){ noise(1.9, 80, 700, .3, 'lowpass'); buzz([10,60,10,60]); }
  if (introT >= T_ARRIVE && once('arrive')){ suck(); shake = reduceMotion ? 0 : 6; buzz([30,30,30,30,60]); }
  if (introT >= T_SUN_END && once('disk')){ holeFlare = 1; pulse = 1; flash = .5; thump(); noise(.7, 5000, 120, .45, 'lowpass'); buzz(50); }
  const b = bhPos(), sk = sunK(), holeR = bhRadius();
  // el Sol se deshace en una espiral de fuego alrededor del agujero negro
  if (state === 'intro' && sk > 0 && sk < 1){
    const sR = 20*Math.pow(1 - sk, .7), sx = b.x*sk*.5, sy = b.y*sk*.5;
    for (let i=0;i<6;i++){
      const a = Math.random()*Math.PI*2, px = sx + Math.cos(a)*sR, py = sy + Math.sin(a)*sR;
      const dx = px - b.x, dy = py - b.y, l = Math.hypot(dx, dy) || 1, v = 90 + Math.random()*80;
      iparts.push({x:px, y:py, vx:-dy/l*v, vy:dx/l*v, life:1.2 + Math.random(), col:SUN_COLS[i%4], s:1.5 + Math.random()*2.5});
    }
  }
  for (const p of ip){
    if (p.done) continue;
    const w = .9*Math.pow(60/p.r, 1.5);
    if (p.eatAt != null && introT >= p.eatAt){
      if (!p.sounded){ p.sounded = true; eatSound(); buzz(20); }
      p.ph = Math.min(1, (introT - p.eatAt)/1.3);
      p.rr = p.r + (holeR*.85 - p.r)*Math.pow(p.ph, 2.2);
      p.a += (w + 1.2 + 9*p.ph*p.ph)*dt;
      if (Math.random() < .25 + p.ph){
        const ex = Math.cos(p.a)*p.rr, ey = Math.sin(p.a)*p.rr, v = 40 + Math.random()*60;
        iparts.push({x:ex, y:ey, vx:-Math.sin(p.a)*v, vy:Math.cos(p.a)*v, life:.8 + Math.random()*.5, col:p.c, s:1.5 + Math.random()*2});
      }

      if (p.earth && introT > T_EARTH){ const k = easeIO(Math.min((introT - T_EARTH)/6, 1)); p.rr = p.r - (p.r - earthEndR())*k; }
    }
  }
  const pull = introT >= T_ARRIVE ? 260 : 0;
  for (const q of iparts){
    const dx = q.x - b.x, dy = q.y - b.y, l = Math.hypot(dx, dy) || 1;
    q.vx -= dx/l*pull*dt; q.vy -= dy/l*pull*dt; q.vx *= Math.pow(.6, dt); q.vy *= Math.pow(.6, dt);
    q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt*(l < holeR ? 4 : .6);
  }
  iparts = iparts.filter(q => q.life > 0);
  if (state === 'intro' && introT > INTRO_END) endIntro(false);
}

// ---------- presentación de marca: el agujero negro y el logotipo de Órbita (10 s) ----------
const SPLASH_END = 10, SK = Math.sin(37*Math.PI/180), BR0 = 1.35, BR1 = 2.05;
const BST = [[0,[50,10,4]],[.35,[150,38,8]],[.6,[255,100,28]],[.82,[255,196,96]],[1,[255,246,222]]];

const easeIO2 = v => v < .5 ? 2*v*v : 1 - Math.pow(-2*v + 2, 2)/2;
function bcol(b, a){ b = Math.max(0, Math.min(1, b)); for (let i=1;i<BST.length;i++){ if (b <= BST[i][0]){ const [p0,c0] = BST[i-1], [p1,c1] = BST[i], u = (b-p0)/(p1-p0); return 'rgba(' + c0.map((v,j) => Math.round(v + (c1[j]-v)*u)).join(',') + ',' + a + ')'; } } return 'rgba(255,246,222,' + a + ')'; }

function bstyle(cx, cy, r, k, r0, r1, a, lensMode, nStops){
  const g = ctx.createConicGradient ? ctx.createConicGradient(0, cx, cy) : null;
  if (!g) return bcol(bbright(Math.PI, r, r0, r1), a);
  const n = nStops || 28;
  for (let i=0;i<=n;i++){ const ph = i/n*Math.PI*2, th = lensMode ? ph : Math.atan2(Math.sin(ph)/k, Math.cos(ph)); g.addColorStop(i/n, bcol(bbright(th, r, r0, r1), a)); }

}
function bhDisk(cx, cy, R, from, to, alpha, f1){
  const r0 = R*BR0, r1 = R*(f1 || BR1), step = Math.max(1, R*.02), n = R > 30 ? 56 : 28;
  for (let r = r1; r >= r0; r -= step){
    const fade = Math.min(1, (r1 - r)/(R*.4) + .15)*alpha;
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r*SK, 0, from, to); ctx.strokeStyle = bstyle(cx, cy, r, SK, r0, r1, fade, false, n); ctx.lineWidth = step*1.8; ctx.stroke();
  }
}
function bhDiskK(cx, cy, R, k, f0, f1, from, to, alpha){
  const r0 = R*f0, r1 = R*f1, step = Math.max(1.6, R*.035);
  for (let r = r1; r >= r0; r -= step){
    const fade = Math.min(1, (r1 - r)/(R*.35) + .15)*alpha;
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r*k, 0, from, to); ctx.strokeStyle = bstyle(cx, cy, r, k, r0, r1, fade, false); ctx.lineWidth = step*1.3; ctx.stroke();

}
// el agujero negro de la marca, visto casi desde arriba (como en el juego)
function brandHole(cx, cy, R, alpha, flare){
  bhDiskK(cx, cy, R, .96, 1.06, 1.6, 0, Math.PI*2, alpha);
  ctx.globalAlpha = alpha; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = bcol(.95, .9); ctx.lineWidth = Math.max(1.2, R*.03) + flare*5; ctx.shadowColor = '#ff5a1f'; ctx.shadowBlur = 10 + flare*36;
  ctx.beginPath(); ctx.arc(cx, cy, R*1.015, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
// el logotipo: la Ó es el agujero negro a 37° y su acento es la Tierra
// proporciones del logotipo
const LOGO = { r: .42, disk: 1.8, txt: 1.55, track: .2, weight: 400 };
// el acento de la Ó: la Tierra escapando, con una estela inclinada como un acento agudo
function drawAccent(cx, cy, R, p){
  const dx = .574, dy = -.819, ex = cx + R*.55 - dx*(1 - p)*R*3, ey = cy - R*1.62 - dy*(1 - p)*R*3;
  const re = Math.max(3, R*.19), L = R*(.55 + .25*p), tx = ex - dx*L, ty = ey - dy*L, px = -dy*re*.85, py = dx*re*.85;
  const g = ctx.createLinearGradient(tx, ty, ex, ey);
  if (g && g.addColorStop){ g.addColorStop(0, 'rgba(143,208,255,0)'); g.addColorStop(1, 'rgba(143,208,255,.75)'); ctx.fillStyle = g; }
  else ctx.fillStyle = 'rgba(143,208,255,.5)';
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex + px, ey + py); ctx.lineTo(ex - px, ey - py); ctx.closePath(); ctx.fill();
  splashEarth(ex, ey, re);
}
function drawLogo(midX, cy, fs){
  ctx.save();
  const Rf = fs*LOGO.r, word = 'RBITA', ls = fs*LOGO.track;
  ctx.font = LOGO.weight + ' ' + fs + 'px ' + (splashFont ? 'Unbounded' : 'system-ui') + ', sans-serif';
  const mw = s => { const m = ctx.measureText(s); return (m && m.width) || s.length*fs*.75; };
  const tw = mw(word) + ls*(word.length - 1), cx = midX - (Rf*LOGO.disk + Rf*LOGO.txt + tw)/2 + Rf*LOGO.disk;
  const g = ctx.createRadialGradient(cx, cy, Rf, cx, cy, Rf*4); g.addColorStop(0, 'rgba(255,100,28,.16)'); g.addColorStop(1, 'rgba(255,100,28,0)');

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = BONE;
  for (let i=0;i<word.length;i++) ctx.fillText(word[i], cx + Rf*LOGO.txt + mw(word.slice(0, i)) + ls*i, cy + fs*.36);

function bhCore(cx, cy, R, alpha){
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  // la luz curvada alrededor de la esfera: un solo anillo continuo, más grueso arriba y más fino abajo
  const dq = R > 30 ? .04 : .1, N = 120, ns = R > 30 ? 48 : 28;
  for (let q = 0; q <= 1.0001; q += dq){
    const rd = R*BR0 + q*R*(BR1 - BR0), g = ctx.createConicGradient ? ctx.createConicGradient(0, cx, cy) : null;
    if (g) for (let i=0;i<=ns;i++){ const ph = i/ns*Math.PI*2, up = .5 - .5*Math.sin(ph); g.addColorStop(i/ns, bcol(bbright(ph, rd, R*BR0, R*BR1), alpha*(1 - q*.6)*(.45 + .45*up))); }

    for (let i=0;i<=N;i++){
      const ph = i/N*Math.PI*2, up = .5 - .5*Math.sin(ph), rr2 = R*(1.03 + (.08 + .16*up)*q);
      const px = cx + Math.cos(ph)*rr2, py = cy + Math.sin(ph)*rr2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.strokeStyle = g || bcol(.6, alpha*.45*(1 - q*.6)); ctx.lineWidth = Math.max(1.8, R*.03); ctx.stroke();

  ctx.beginPath(); ctx.arc(cx, cy, R*1.015, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
function splashEarth(ex, ey, r){
  ctx.fillStyle = '#3d8bff'; ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = '#5ccf6b'; ctx.beginPath(); ctx.ellipse(ex - r*.25, ey - r*.15, r*.45, r*.3, .4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(10,14,30,.55)'; ctx.beginPath(); ctx.arc(ex + r*.5, ey - r*.5, r*1.1, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
// el sonido de la marca: un rumor que crece, las letras como notas, la Tierra que cae y un golpe final
function splashSounds(){
  if (!AC) return;
  try{
    const n = AC.currentTime + .05;
    splashBus = AC.createGain(); splashBus.gain.value = .9; splashBus.connect(master);
    const osc = (type, f0, f1, t0, dur, peak, att) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
      o.frequency.setValueAtTime(f0, t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + att); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(splashBus); o.start(t0); o.stop(t0 + dur + .05); return o;
    };
    osc('sine', 38, 58, n, 6, .35, 2.5);                                   // rumor grave
    const src = AC.createBufferSource(); src.buffer = NOISE;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1; f.frequency.setValueAtTime(200, n + 3); f.frequency.exponentialRampToValueAtTime(6000, n + 5.5);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001, n + 3); g.gain.exponentialRampToValueAtTime(.28, n + 5.45); g.gain.exponentialRampToValueAtTime(.0001, n + 5.6);
    src.connect(f); f.connect(g); g.connect(splashBus); src.start(n + 3); src.stop(n + 5.7);   // barrido que sube
    [0, 3, 5, 7, 10].forEach((s, i) => osc('triangle', ROOT*Math.pow(2, s/12), 0, n + 4 + i*.22, .7, .12, .005));   // una nota por letra
    osc('sine', ROOT*2*Math.pow(2, 7/12), 0, n + 5.3, 1.4, .1, .004);                 // la Tierra cae en el acento
    osc('sine', 72, 38, n + 5.5, 1.6, .9, .005);                                     // golpe
    noiseHit(n + 5.5, 1.6, 'highpass', 3000, .35, splashBus);
    for (const s of [0, 3, 7, 12]) for (const det of [-7, 7]){                      // acorde final
      const o = AC.createOscillator(), gg = AC.createGain(), lp = AC.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = ROOT/2*Math.pow(2, s/12); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = 1300;
      gg.gain.setValueAtTime(.0001, n + 5.5); gg.gain.exponentialRampToValueAtTime(.035, n + 5.6); gg.gain.exponentialRampToValueAtTime(.0001, n + 9.5);
      o.connect(lp); lp.connect(gg); gg.connect(splashBus); o.start(n + 5.5); o.stop(n + 9.6);
    }
    osc('sine', ROOT*4, 0, n + 5.55, 2.8, .07, .005); osc('sine', ROOT*4*Math.pow(2, 7/12), 0, n + 5.6, 2.6, .05, .005);   // campanas
  }catch(e){}
}
function startSplash(){ state = 'splash'; splashT = 0; sflared = false; sfl = 0; elPanel.classList.add('hide'); elHud.style.opacity = 0; splashSounds(); }
function skipSplash(){

}
function updateSplash(dt){
  t += dt; if (state === 'splash') splashT += dt;
  flash = Math.max(0, flash - dt*2); sfl = Math.max(0, sfl - dt*1.3);
  if (state === 'splash' && !sflared && splashT >= 5.5){ sflared = true; flash = .35; sfl = 1; buzz([30,40,80]); }

function renderSplash(){
  const T = splashT;

  const sr = Math.max(W, H)*.62;
  for (const s of stars){ const x = CX + Math.cos(s.a + t*.004)*s.r*sr, y = CY + Math.sin(s.a + t*.004)*s.r*sr; ctx.globalAlpha = .1 + .2*(.5 + .5*Math.sin(t*1.3 + s.tw)); ctx.fillStyle = BONE; ctx.fillRect(x, y, s.s*.8, s.s*.8); }

  ctx.font = LOGO.weight + ' ' + fs + 'px ' + (splashFont ? 'Unbounded' : 'system-ui') + ', sans-serif';
  const mw = s => { const m = ctx.measureText(s); return (m && m.width) || s.length*fs*.8; };
  const tw = mw(word) + ls*(word.length - 1), total = Rf*LOGO.disk + Rf*LOGO.txt + tw, fx = (W - total)/2 + Rf*LOGO.disk, fy = H*.45;

  bhDisk(cx, cy, R, 0, Math.PI, a, df);
  if (dim > 0){ ctx.globalAlpha = dim; ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // letras una por una, por delante del disco (el disco pasa por detrás de la R)
  const tx = cx + R*LOGO.txt, base = cy + fs*.36;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for (let i=0;i<word.length;i++){
    const la = clamp((T - (4 + i*.22))/.32, 0, 1); if (la <= 0) continue;

  }

  if (T > 4.95){ const p = clamp((T - 4.95)/.45, 0, 1); drawAccent(cx, cy, R, 1 - Math.pow(1 - p, 3)); }
  if (state === 'splash' && T > .8 && T < 9){ ctx.globalAlpha = .35; ctx.fillStyle = BONE; ctx.font = '300 12px Unbounded, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Toca para saltar', CX, H - 34); ctx.globalAlpha = 1; }
  if (T > 9.2){ ctx.globalAlpha = clamp((T - 9.2)/.8, 0, 1); ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.restore();

}

// "Voz" inspirada en la sonificación de la NASA del agujero negro de Perseo (2022): un gemido grave que cambia lentamente de tono
function perseusVoice(dest, n){
  const nodes = [];
  const formA = AC.createBiquadFilter(), formB = AC.createBiquadFilter(), mix = AC.createGain();
  formA.type = 'bandpass'; formA.frequency.value = 420; formA.Q.value = 5;
  formB.type = 'bandpass'; formB.frequency.value = 900; formB.Q.value = 7;
  mix.gain.value = .9; formA.connect(mix); formB.connect(mix); mix.connect(dest);
  // la "vocal" del gemido cambia despacio (ooo -> aaa)
  for (const [f, rate, depth] of [[formA, .09, 160], [formB, .06, 300]]){ const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = rate; lg.gain.value = depth; l.connect(lg); lg.connect(f.frequency); l.start(n); nodes.push(l); }
  for (const [base, rate, dep, gn] of [[ROOT/8, .05, .09, .5], [ROOT/8*1.19, .037, .11, .32], [ROOT/16*1.5, .023, .07, .45], [ROOT/8*.998, .061, .1, .28]]){
    const o = AC.createOscillator(), og = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = base; og.gain.value = gn;
    l.frequency.value = rate; lg.gain.value = base*dep; l.connect(lg); lg.connect(o.frequency);   // el tono se arrastra arriba y abajo
    o.connect(og); og.connect(formA); og.connect(formB); o.start(n); l.start(n); nodes.push(o, l);

}

    ng.addColorStop(0, 'rgba(255,90,150,' + (.18 + R2()*.18) + ')'); ng.addColorStop(1, 'rgba(255,70,140,0)'); g.fillStyle = ng; g.fillRect(x - r, y - r, r*2, r*2); }
  g.lineCap = 'round';
  for (let i=0;i<9;i++){ const a0 = R2()*Math.PI*2; g.strokeStyle = 'rgba(255,150,190,' + (.18 + R2()*.2) + ')'; g.lineWidth = 1 + R2()*2.5; g.beginPath();
    for (let j=0;j<=14;j++){ const a = a0 + j*.12 + Math.sin(j*.9 + i)*.15, r = TR*(.15 + j*.055); const x = tx + Math.cos(a)*r, y = ty + Math.sin(a)*r*.8; j ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  const r136 = g.createRadialGradient(tx, ty, 0, tx, ty, TR*.18); r136.addColorStop(0, 'rgba(235,245,255,.95)'); r136.addColorStop(1, 'rgba(180,210,255,0)'); g.fillStyle = r136; g.fillRect(tx - TR*.2, ty - TR*.2, TR*.4, TR*.4);
  // la Pequeña Nube de Magallanes a lo lejos, y el puente de estrellas que las une
  const sx = W*.12, sy = H*.12; g.save(); g.translate(sx, sy); g.rotate(.5); g.scale(1, .55);
  const smc = g.createRadialGradient(0, 0, 0, 0, 0, D*.08); smc.addColorStop(0, 'rgba(210,225,255,.5)'); smc.addColorStop(1, 'rgba(190,210,255,0)'); g.fillStyle = smc; g.beginPath(); g.arc(0, 0, D*.08, 0, Math.PI*2); g.fill(); g.restore();
  for (let i=0;i<70;i++){ const u = R2(), x = sx + (W*.42 - sx)*u + (R2() - .5)*D*.05, y = sy + (H*.56 - sy)*u + (R2() - .5)*D*.05; g.fillStyle = 'rgba(200,220,255,' + (.2 + R2()*.4) + ')'; g.fillRect(x, y, 1.1, 1.1); }
  // supernova 1987A: un punto brillante con su anillo interior y dos anillos exteriores
  const nx = tx - TR*.55, ny = ty + TR*.55; g.strokeStyle = 'rgba(255,220,200,.7)'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(nx, ny, 5, 3, .5, 0, Math.PI*2); g.stroke();
  g.strokeStyle = 'rgba(255,160,190,.45)'; g.beginPath(); g.ellipse(nx - 3, ny - 5, 12, 6, .5, 0, Math.PI*2); g.stroke(); g.beginPath(); g.ellipse(nx + 3, ny + 5, 12, 6, .5, 0, Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(255,240,220,.95)'; g.beginPath(); g.arc(nx, ny, 1.4, 0, Math.PI*2); g.fill();
  // muchas estrellas azuladas, jóvenes
  for (let i=0;i<480;i++){ const x = R2()*W, y = R2()*H, s = R2() < .9 ? .5 + R2()*.9 : 1.3 + R2()*1.3;
    g.fillStyle = ['rgba(255,255,255,', 'rgba(190,215,255,', 'rgba(170,200,255,'][i % 3] + (.35 + R2()*.55) + ')'; g.fillRect(x, y, s, s); }
  magCanvas = c; magKey = key; return c;
}
function drawMagallanes(){
  const c = buildMagallanes();
  ctx.save();
  if (c){ const a = Math.sin(t*.03)*.02; ctx.translate(W/2, H/2); ctx.rotate(a); ctx.scale(1.07, 1.07); ctx.translate(-W/2, -H/2); ctx.drawImage(c, 0, 0, W, H); }
  else { ctx.fillStyle = '#04070e'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  for (const s of AND_TW){ ctx.globalAlpha = .25 + .6*Math.max(0, Math.sin(t*1.9 + s.p)); ctx.fillStyle = '#e8f4ff'; ctx.fillRect(((s.x + .37) % 1)*W, ((s.y + .21) % 1)*H, 1.8, 1.8); }
  ctx.globalAlpha = 1;
}


let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05); last = now;
  requestAnimationFrame(frame);
  try{
    if (elWallet) elWallet.style.opacity = (state === 'splash' || state === 'pretitle' || state === 'intro' || (state === 'home' && homeT < HOME_IN)) ? '0' : '1';
    if (state === 'splash' || state === 'pretitle'){ updateSplash(dt); renderSplash(); }
    else if (state === 'intro'){ updateIntro(dt); renderIntro(); }
    else if (state === 'planets'){ renderPlanetsScene(dt); }
    else if (state === 'home' && homeT >= HOME_IN && homeT < HOME_IN + 1){ homeT += dt; update(dt); render(); }
    else if (state === 'home' && homeT < HOME_IN){
      homeT += dt; update(dt); updateHomeShow(dt); renderHomeIntro();
      if (homeT >= HOME_IN && elHome) elHome.classList.remove('off');
    }
    else { update(dt); render(); }
  }catch(e){ try{ ctx.restore(); }catch(_){} console.error(e); }
}
requestAnimationFrame(frame);
})();
