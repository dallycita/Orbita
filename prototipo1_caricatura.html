<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · Prototipo 1 (caricatura)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1f5c; --fg:#fff1d6; --muted:#c4b8ea; --sun:#ff5a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#2a1f5c; --fg:#fff1d6; } }
:root[data-theme="dark"]{ --bg:#2a1f5c; --fg:#fff1d6; }
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none;transition:opacity .3s;}
#score{font-weight:700;color:#ffd36b;text-shadow:3px 3px 0 #1a1033;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.02em;}
#best{margin-top:6px;font-weight:400;font-size:13px;color:var(--muted);}
#scorewrap{position:relative;display:grid;place-items:center;margin:0 auto;}
#scorewrap.arc{width:112px;height:112px;}
#arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);display:none;}
#scorewrap.arc #arc{display:block;}
#arc circle{fill:none;stroke-width:2.5;}
#arc .bg{stroke:rgba(236,230,216,.12);}
#arc .fg{stroke:var(--sun);stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset .25s ease-out,stroke .2s;}
.chips{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:auto;}
.chips .lbl{font-weight:400;font-size:12px;color:var(--muted);}
.chips .row{display:flex;gap:8px;}
.chip{font:500 12px 'Fredoka',system-ui,sans-serif;color:var(--muted);background:transparent;border:2px solid rgba(255,241,214,.35);border-radius:999px;padding:8px 14px;cursor:pointer;}
.chip.on{color:var(--fg);border-color:var(--sun);}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}
#panel.hide .chips{pointer-events:none;}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 24px;transition:opacity .25s;}
#panel.hide{opacity:0;}
.title{font-weight:700;font-size:clamp(56px,17vw,112px);letter-spacing:-.01em;line-height:.9;
  color:#ffd36b;text-shadow:5px 5px 0 #1a1033;transform:rotate(-4deg);}
.big{font-weight:700;font-size:clamp(72px,24vw,140px);line-height:.9;color:#ffd36b;text-shadow:5px 5px 0 #1a1033;}
.sub{margin-top:18px;font-weight:400;font-size:15px;line-height:1.6;color:var(--muted);max-width:30ch;}
.msg{margin-top:14px;font-weight:500;font-size:16px;color:var(--fg);}
.msg.rec{color:var(--sun);}
.cta{margin-top:34px;font-weight:500;font-size:14px;color:var(--fg);animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .cta{animation:none} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" style="opacity:0"><div id="scorewrap"><svg id="arc" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44"/></svg><div id="score">0</div></div><div id="best">Récord 0</div></div>
  <div id="panel">
    <div class="title">Órbita</div>
    <div class="sub">Algo viaja hacia el sistema solar.</div>
    <div class="cta">Toca para comenzar</div>
  </div>
</div>
<script>
(() => {
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const elWrap = document.getElementById('scorewrap'), elArcFg = document.querySelector('#arc .fg');
// tres formas de mostrar el récord, para comparar
const MODES = [['faltan','Faltan N'],['arco','Arco'],['nada','Nada']];
let hudMode = 'faltan';
const MUSICS = [['espacial','Espacial'],['synthwave','Synthwave'],['phonk','Phonk']];
let musicStyle = 'espacial';
try{ const m = localStorage.getItem('orbita_p1_musica'); if (m && MUSICS.some(x => x[0] === m)) musicStyle = m; }catch(e){}
try{ const m = localStorage.getItem('orbita_p1_modo'); if (m && MODES.some(x => x[0] === m)) hudMode = m; }catch(e){}
function chipsHTML(){
  return '<div class="chips"><div class="lbl">Indicador de récord</div><div class="row">' +
    MODES.map(([k, n]) => '<button type="button" class="chip' + (k === hudMode ? ' on' : '') + '" data-mode="' + k + '">' + n + '</button>').join('') + '</div>' +
    '<div class="lbl" style="margin-top:8px">Música</div><div class="row">' +
    MUSICS.map(([k, n]) => '<button type="button" class="chip' + (k === musicStyle ? ' on' : '') + '" data-music="' + k + '">' + n + '</button>').join('') + '</div></div>';
}
{ const c0 = document.getElementById('chips0'); if (c0) c0.innerHTML = chipsHTML(); }
function refreshChips(){ document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.mode ? c.dataset.mode === hudMode : c.dataset.music === musicStyle)); }
const elHud = document.getElementById('hud'), elPanel = document.getElementById('panel');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- medidas ----------
let W, H, DPR, S, CX, CY;
const R0 = 96, GAP = 34, PR = 8, SUN = 16;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cvs.getBoundingClientRect(); W = r.width; H = r.height;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.min(W/2/170, H/2/250);
  CX = W/2; CY = H*0.62;
}
window.addEventListener('resize', resize); resize();

// ---------- zonas (cambian cada 25 anillos) ----------
const BONE = '#fff1d6';
const INK = '#1a1033';
const ZONES = [
  {ring:BONE, ast:BONE, s1:'#ffe2b0', s2:'#ff5a1f', bg:'#2a1f5c'},
  {ring:BONE, ast:BONE, s1:'#ffc2a0', s2:'#e01f2e', bg:'#24356b'},
  {ring:BONE, ast:BONE, s1:'#fff6d8', s2:'#ffb81f', bg:'#3a1f5c'},
  {ring:BONE, ast:BONE, s1:'#f6dcff', s2:'#9a3dff', bg:'#1f3d5c'},
];
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
const zoneOf = k => ZONES[Math.floor(k/25) % ZONES.length];

// ---------- estrellas ----------
const stars = Array.from({length:140}, () => ({a:Math.random()*Math.PI*2, r:Math.sqrt(Math.random())*1.2, s:Math.random()*1.3+.3, tw:Math.random()*6}));

// ---------- audio ----------
let AC = null, master = null, musicBus = null, NOISE = null, shaper = null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .6;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = .0001; musicBus.connect(master);
    const len = AC.sampleRate*2; NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC = null; }
}
const ROOT = 415.3; // tonalidad: Sol# menor
const SCALE = [0,3,5,7,10,12,15,17];
function cowbell(semi){
  if (!AC) return; try{
    const t0 = AC.currentTime, f = ROOT*Math.pow(2, semi/12);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = 'square'; o1.frequency.value = f; o2.frequency.value = f*1.48;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.7; bp.Q.value = 1.4;
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.3,t0+.004); g.gain.exponentialRampToValueAtTime(.0001,t0+.26);
    o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(master);
    o1.start(t0); o2.start(t0); o1.stop(t0+.3); o2.stop(t0+.3);
  }catch(e){}
}
function noiseHit(t0, dur, type, freq, gain, dest, f1){
  const src = AC.createBufferSource(); src.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = .9;
  f.frequency.setValueAtTime(freq, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t0, Math.random()*.8); src.stop(t0+dur+.02);
}
function noise(dur, f0, f1, gain, type){ if (!AC) return; try{ noiseHit(AC.currentTime, dur, type, f0, gain, master, f1); }catch(e){} }
function thump(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(55,t0+.1);
    g.gain.setValueAtTime(.3,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.15);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+.17);
  }catch(e){}
}
function suck(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(260, t0); o.frequency.exponentialRampToValueAtTime(30, t0 + 1.8);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.45, t0 + .6); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.9);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 2);
    noiseHit(t0, 1.8, 'lowpass', 2200, .45, master, 70);
  }catch(e){}
}
function sub(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(28,t0+.9);
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 400;
    g.gain.setValueAtTime(.5,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+1);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t0); o.stop(t0+1.05);
  }catch(e){}
}

// ---------- beat (se van sumando capas al subir) ----------
const BPM = 140, STEP = 60/BPM/4, TB = 60/BPM;
let musicOn = false, nextT = 0, step = 0, schedTimer = null, kickQueue = [], musicStart = -1;
const BASS = {0:[0,.42], 6:[0,.28], 10:[-2,.42], 16:[0,.42], 22:[3,.28], 26:[-2,.42]};
function dKick(t0){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(165,t0); o.frequency.exponentialRampToValueAtTime(45,t0+.12);
  g.gain.setValueAtTime(.95,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
  o.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0+.32);
  kickQueue.push(t0);
}
function dClap(t0){ for (let i=0;i<3;i++) noiseHit(t0+i*.011, i<2 ? .03 : .17, 'bandpass', 1600, .55, musicBus); }
function dHat(t0, open){ noiseHit(t0, open ? .17 : .035, 'highpass', 8000, open ? .16 : .2, musicBus); }
function d808(t0, semi, dur){
  const f = ROOT/8*Math.pow(2, semi/12);
  if (!shaper){
    shaper = AC.createWaveShaper(); const c = new Float32Array(256);
    for (let i=0;i<256;i++){ const x = i/128-1; c[i] = Math.tanh(x*2.5); }
    shaper.curve = c; const sg = AC.createGain(); sg.gain.value = .55; shaper.connect(sg); sg.connect(musicBus);
  }
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f*1.5,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.06);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.9,t0+.01);
  g.gain.setValueAtTime(.9,t0+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(shaper); o.start(t0); o.stop(t0+dur+.02);
}
// ---------- estilos de música (mismo tempo: 140, para que la Respiración siga sincronizada) ----------
const lv = () => state === 'play' ? level : 30;           // en el menú se escucha completa
// progresión en Sol# menor: i – VI – III – VII (Sol#m, Mi, Si, Fa#), dos compases cada acorde
const PROG = [[0,[0,3,7]], [-4,[0,4,7]], [3,[0,4,7]], [-2,[0,4,7]]];
const hz = semi => ROOT/2*Math.pow(2, semi/12);           // Sol#3 como referencia
let echoIn = null;
function echoBus(){
  if (echoIn) return echoIn;
  echoIn = AC.createGain(); const dl = AC.createDelay(1), fb = AC.createGain(), wet = AC.createGain();
  dl.delayTime.value = TB*.75; fb.gain.value = .38; wet.gain.value = .35;
  echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(musicBus);
  return echoIn;
}
function env(g, t0, a, peak, d){ g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d); }
function pad(t0, freqs, dur, gain, cutoff){
  const lp = AC.createBiquadFilter(), g = AC.createGain();
  lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = .5;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + dur*.35); g.gain.setValueAtTime(gain, t0 + dur*.7); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .4);
  lp.connect(g); g.connect(musicBus);
  for (const f of freqs) for (const det of [-6, 6]){
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
    o.connect(lp); o.start(t0); o.stop(t0 + dur + .5);
  }
}
function pluck(t0, f, gain, type, echo){
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = type || 'triangle'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 2600;
  env(g, t0, .005, gain, .28); o.connect(lp); lp.connect(g); g.connect(musicBus); if (echo) g.connect(echoBus());
  o.start(t0); o.stop(t0 + .32);
}
function bassNote(t0, f, dur, gain, type, cutoff){
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = type; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.setValueAtTime(cutoff*2, t0); lp.frequency.exponentialRampToValueAtTime(cutoff, t0 + dur*.6);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + .01); g.gain.setValueAtTime(gain, t0 + dur*.7); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(lp); lp.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0 + dur + .02);
}
function softKick(t0, gain){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(38, t0 + .18);
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .45);
  o.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0 + .5); kickQueue.push(t0);
}
function snareSW(t0){
  noiseHit(t0, .32, 'bandpass', 1800, .45, musicBus);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t0); o.frequency.exponentialRampToValueAtTime(140, t0 + .08);
  env(g, t0, .003, .25, .12); o.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0 + .15);
}
// Espacial: oscuro y cinematográfico, en medio tiempo
// qué tan cerca está el agujero negro de la Tierra: 0 = lejos, 1 = a punto de tragarla
function dangerNow(){ return state === 'play' ? clamp((1.7 - (pLevel - sunLevel))/1.3, 0, 1) : 0; }
// un zumbido disonante que tiembla, sube de tono y se acelera con el peligro
let tens = null, tensT = 0;
function tensionOn(){
  if (!AC || tens) return;
  try{
    const g = AC.createGain(), trem = AC.createGain(), lfo = AC.createOscillator(), lfoG = AC.createGain(), bp = AC.createBiquadFilter();
    g.gain.value = .0001; trem.gain.value = .5; lfo.frequency.value = 4; lfoG.gain.value = .5;
    bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = .8;
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = 'sawtooth'; o1.frequency.value = hz(12); o2.frequency.value = hz(13);   // segunda menor: inquietante
    lfo.connect(lfoG); lfoG.connect(trem.gain);
    o1.connect(bp); o2.connect(bp); bp.connect(trem); trem.connect(g); g.connect(musicBus);
    o1.start(); o2.start(); lfo.start();
    tens = {g, lfo, o1, o2, bp};
  }catch(e){}
}
function tensionSet(d){
  if (!tens) return;
  try{
    const n = AC.currentTime, up = Math.pow(2, 3*d/12);
    tens.g.gain.setTargetAtTime(.0001 + .13*Math.pow(d, 1.4), n, .15);
    tens.lfo.frequency.setTargetAtTime(4 + 11*d, n, .2);
    tens.o1.frequency.setTargetAtTime(hz(12)*up, n, .3); tens.o2.frequency.setTargetAtTime(hz(13)*up, n, .3);
    tens.bp.frequency.setTargetAtTime(700 + 1600*d, n, .2);
  }catch(e){}
}
function stepEspacial(s, t0){
  const bar = Math.floor(s/16), [root, tones] = PROG[Math.floor(bar/2) % 4], b = s % 16, L = lv();
  const dz = dangerNow();
  if (b === 0 || b === 8) softKick(t0, .8);
  if (b === 3 || b === 11) softKick(t0, .35);                         // latido doble
  if (dz > .4){ if (b === 4 || b === 12) softKick(t0, .7); if (b === 7 || b === 15) softKick(t0, .3); }   // el corazón se acelera
  if (dz > .45 && (dz > .75 || b % 2 === 0)) noiseHit(t0, .025, 'highpass', 7500, .04 + .1*dz, musicBus);   // tic-tac
  if (b % 4 === 0 && b !== 0 && b !== 8) noiseHit(t0, .05, 'highpass', 6000, .06, musicBus);
  if (s % 32 === 0) pad(t0, [hz(root - 12), ...tones.map(x => hz(root + x))], 32*STEP, .045, 900);
  if (L >= 12 && b % 16 === 0) bassNote(t0, hz(root - 24), 16*STEP, .32, 'sine', 300);
  if (L >= 5 && b % 2 === 0){
    const seq = [0, 1, 2, 1, 0, 2, 1, 2], tn = tones[seq[(b/2) % 8] % tones.length];
    pluck(t0, hz(root + tn + 12), .07, 'triangle', true);
  }
  if (L >= 25 && b === 0 && bar % 2 === 0) pluck(t0, hz(root + tones[2] + 24), .09, 'sine', true);
  if (L >= 25 && b % 2 === 1) noiseHit(t0, .03, 'highpass', 9000, .04, musicBus);
}
// Synthwave: retro, con energía de persecución
function stepSynthwave(s, t0){
  const bar = Math.floor(s/16), [root, tones] = PROG[Math.floor(bar/2) % 4], b = s % 16, L = lv();
  if (b % 4 === 0) dKick(t0);
  if (b % 2 === 0) bassNote(t0, hz(root - 12 + (b % 4 === 2 ? 12 : 0)), STEP*1.8, .22, 'sawtooth', 500);
  if (L >= 5){ if (b === 4 || b === 12) snareSW(t0); if (b % 4 === 2) dHat(t0, false); }
  if (L >= 5 && s % 128 >= 124) snareSW(t0);                          // redoble cada 8 compases
  if (L >= 12 && s % 32 === 0) pad(t0, tones.map(x => hz(root + x + 12)), 32*STEP, .035, 1800);
  if (L >= 25){
    const up = [0, 1, 2, 3], tn = up[b % 4] === 3 ? 12 : tones[up[b % 4]];
    pluck(t0, hz(root + tn + 12), .055, 'square', true);
  }
}
function stepPhonk(s, t0){
  s = s % 32; const b = s % 16, L = lv();
  if (b===0 || b===6 || b===10) dKick(t0);
  if (b % 2 === 0) dHat(t0, false);
  if (L >= 5 && (b===4 || b===12)) dClap(t0);
  if (L >= 12 && BASS[s]) d808(t0, BASS[s][0], BASS[s][1]);
  if (L >= 25){ if (b===2 || b===14) dHat(t0, true); if (s===30 || s===31) dHat(t0+STEP/2, false); }
}
function scheduleStep(s, t0){
  if (musicStyle === 'synthwave') stepSynthwave(s, t0);

function update(dt){

  shake = Math.max(0, shake - dt*40); flash = Math.max(0, flash - dt*2.6); pulse = Math.max(0, pulse - dt*3.5);

        for (let i=0;i<34;i++){
          const a = Math.random()*Math.PI*2, v = 60 + Math.random()*200;
          particles.push({x:cx0, y:cy0, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.6 + Math.random()*.6, col: i%2 ? BONE : zoneOf(level).s2, s:2 + Math.random()*3});
        }

    const gap = pLevel - sunLevel;
    let sp = .22 + Math.min(level*.012, .7);
    if (gap > 2.2) sp += (gap - 2.2)*1.3;
    sunLevel += sp*d;
    eatRings();
    if (sunLevel >= pLevel - .18){
      const pr0 = rr(pLevel); die(Math.cos(pAng)*pr0, Math.sin(pAng)*pr0, 'sun'); return;
    }
    trail.push({a:pAng, l:pLevel}); if (trail.length > 22) trail.shift();

    const pr = rr(pLevel), px = Math.cos(pAng)*pr, py = Math.sin(pAng)*pr;
    const check = jumping && jumpTarget === 1 && !pending ? [level+1] : [];
    for (const k of check){
      const ring = rings.get(k); if (!ring) continue;
      const R = rr(k);
      for (const o of ring.obs){

      o.connect(g); o2.connect(lp); lp.connect(g); g.connect(master); o.start(n); o2.start(n);
      droneNodes = {o, o2, g};
    } else if (droneNodes){
      const d = droneNodes; droneNodes = null;
      d.g.gain.cancelScheduledValues(n); d.g.gain.setValueAtTime(Math.max(d.g.gain.value, .0001), n);
      d.g.gain.exponentialRampToValueAtTime(.0001, n + .6); d.o.stop(n + .7); d.o2.stop(n + .7);
    }
  }catch(e){}
}
function eatSound(){
  if (!AC) return; try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(320, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 1.2);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.3);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.35);
    noiseHit(t0, 1.1, 'lowpass', 2200, .3, master, 80);
  }catch(e){}
}

function updateIntro(dt){
  if (state === 'intro') introT += dt;
  t += dt;
  flash = Math.max(0, flash - dt*2.2); holeFlare = Math.max(0, holeFlare - dt*1.4); pulse = Math.max(0, pulse - dt*3.5); shake = Math.max(0, shake - dt*25);
  SI = Math.max(.4, Math.min(W/2/224, (CY - 80)/224));
  if (introT >= T_ENTER && once('enter')){ noise(1.9, 80, 700, .3, 'lowpass'); buzz([10,60,10,60]); }
  if (introT >= T_ARRIVE && once('arrive')){ suck(); shake = reduceMotion ? 0 : 6; buzz([30,30,30,30,60]); }
  if (introT >= T_SUN_END && once('disk')){ holeFlare = 1; pulse = 1; flash = .5; thump(); noise(.7, 5000, 120, .45, 'lowpass'); buzz(50); }
  const b = bhPos(), sk = sunK(), holeR = bhRadius();
  // el Sol se deshace en una espiral de fuego alrededor del agujero negro
  if (state === 'intro' && sk > 0 && sk < 1){
    const sR = 20*Math.pow(1 - sk, .7), sx = b.x*sk*.5, sy = b.y*sk*.5;
    for (let i=0;i<6;i++){
      const a = Math.random()*Math.PI*2, px = sx + Math.cos(a)*sR, py = sy + Math.sin(a)*sR;
      const dx = px - b.x, dy = py - b.y, l = Math.hypot(dx, dy) || 1, v = 90 + Math.random()*80;
      iparts.push({x:px, y:py, vx:-dy/l*v, vy:dx/l*v, life:1.2 + Math.random(), col:SUN_COLS[i%4], s:1.5 + Math.random()*2.5});
    }
  }
  for (const p of ip){
    if (p.done) continue;
    const w = .9*Math.pow(60/p.r, 1.5);
    if (p.eatAt != null && introT >= p.eatAt){
      if (!p.sounded){ p.sounded = true; eatSound(); buzz(20); }
      p.ph = Math.min(1, (introT - p.eatAt)/1.3);
      p.rr = p.r + (holeR*.85 - p.r)*Math.pow(p.ph, 2.2);
      p.a += (w + 1.2 + 9*p.ph*p.ph)*dt;
      if (Math.random() < .25 + p.ph){
        const ex = Math.cos(p.a)*p.rr, ey = Math.sin(p.a)*p.rr, v = 40 + Math.random()*60;
        iparts.push({x:ex, y:ey, vx:-Math.sin(p.a)*v, vy:Math.cos(p.a)*v, life:.8 + Math.random()*.5, col:p.c, s:1.5 + Math.random()*2});
      }
      if (p.ph >= 1){ p.done = true; holeFlare = Math.max(holeFlare, .7); pulse = 1; thump(); }
    } else {
      p.a += w*dt;
      if (p.earth && introT > T_EARTH){ const k = Math.min((introT - T_EARTH)/6, 1); p.rr = p.r - 22*k; }
    }
  }
  const pull = introT >= T_ARRIVE ? 260 : 0;
  for (const q of iparts){
    const dx = q.x - b.x, dy = q.y - b.y, l = Math.hypot(dx, dy) || 1;
    q.vx -= dx/l*pull*dt; q.vy -= dy/l*pull*dt; q.vx *= Math.pow(.6, dt); q.vy *= Math.pow(.6, dt);
    q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt*(l < holeR ? 4 : .6);
  }
  iparts = iparts.filter(q => q.life > 0);
  if (state === 'intro' && introT > INTRO_END) endIntro();
}

function drawPlanet(p, x, y, rad, ph){
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(CY - y, CX - x) - Math.PI/2);
  if (ph > 0){ ctx.translate(0, rad*1.4*ph*ph); ctx.scale(1 - .6*ph, 1 + 2.8*ph*ph); ctx.globalAlpha = 1 - clamp((ph - .82)/.18, 0, 1); }
  if (p.earth){ drawEarth(0, 0, rad); }
  else {
    if (p.ring){ ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, rad*.25); ctx.beginPath(); ctx.ellipse(0, 0, rad*2, rad*.55, .35, Math.PI, Math.PI*2); ctx.stroke(); }
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = Math.max(1.2, rad*.15); ctx.strokeStyle = INK; ctx.stroke();
    if (p.bands){ ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(120,70,30,.45)'; ctx.fillRect(-rad, -rad*.35, rad*2, rad*.18); ctx.fillRect(-rad, rad*.15, rad*2, rad*.22); ctx.restore(); }
    const sh = ctx.createLinearGradient(0, rad, 0, -rad);
    sh.addColorStop(0, 'rgba(10,14,30,0)'); sh.addColorStop(.5, 'rgba(10,14,30,.15)'); sh.addColorStop(1, 'rgba(10,14,30,.3)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill();
    if (p.ring){ ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, rad*.25); ctx.beginPath(); ctx.ellipse(0, 0, rad*2, rad*.55, .35, 0, Math.PI); ctx.stroke(); }
  }
  if (ph > 0){ ctx.globalAlpha = (1 - clamp((ph - .82)/.18, 0, 1))*.85*ph*ph; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
}
function caption(txt, t0, t1, size, y){
  if (introT < t0 || introT > t1) return;
  const a = Math.min(1, (introT - t0)/.4, (t1 - introT)/.4), lines = txt.split('\n');
  ctx.globalAlpha = a; ctx.fillStyle = BONE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = size;
  ctx.font = '500 ' + fs + 'px Fredoka, system-ui, sans-serif';
  for (const l of lines){ const m = ctx.measureText ? ctx.measureText(l) : null, w = (m && m.width) || 0; if (w > W - 40) fs = Math.min(fs, size*(W - 40)/w); }
  ctx.font = '500 ' + fs + 'px Fredoka, system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, CX, y + (i - (lines.length - 1)/2)*fs*1.4));
  ctx.globalAlpha = 1;
}
function renderIntro(){
  const z = ZONES[0], b = bhPos(), sk = sunK(), dk = diskK();
  ctx.save();
  ctx.fillStyle = z.bg; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  const sr = Math.max(W, H)*.62;
  for (const s of stars){
    const a = s.a + t*.01, x = CX + Math.cos(a)*s.r*sr, y = CY + Math.sin(a)*s.r*sr;
    ctx.globalAlpha = .3 + .45*(.5 + .5*Math.sin(t*1.3 + s.tw)); ctx.fillStyle = BONE; drawStar(x, y, s.s);
  }
  ctx.strokeStyle = BONE; ctx.lineWidth = 1;
  for (const p of ip){
    if (p.done) continue;
    ctx.globalAlpha = .09*(p.eatAt != null && introT >= p.eatAt ? 1 - p.ph : 1);
    ctx.beginPath(); ctx.arc(CX, CY, p.r*SI, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // el Sol: intacto, y luego estirado hacia el agujero negro
  if (sk < 1){
    const sR = 20*Math.pow(1 - sk, .7)*SI, sx = CX + b.x*sk*.5*SI, sy = CY + b.y*sk*.5*SI;
    ctx.save(); ctx.translate(sx, sy);
    if (sk > 0){ ctx.rotate(Math.atan2(CY + b.y*SI - sy, CX + b.x*SI - sx)); ctx.scale(1 + 1.4*sk, 1 - .45*sk); }
    const g = ctx.createRadialGradient(0, 0, sR*.3, 0, 0, sR*3);
    g.addColorStop(0, 'rgba(255,200,90,.5)'); g.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, sR*3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(0, 0, sR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff3cf'; ctx.beginPath(); ctx.arc(0, 0, sR*.55, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // el agujero negro (solo se ve por cómo dobla la luz, hasta que se alimenta y aparece su disco)
  if (introT >= T_ENTER){
    const hx = CX + b.x*SI, hy = CY + b.y*SI, hR = bhRadius()*SI*(1 + pulse*.06);
    if (dk > 0){
      ctx.globalAlpha = dk;
      const g = ctx.createRadialGradient(hx, hy, hR*.9, hx, hy, hR*2.6);
      g.addColorStop(0, rgba(z.s2,.42)); g.addColorStop(.35, rgba(z.s2,.1)); g.addColorStop(1, rgba(z.s2,0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, hR*2.6, 0, Math.PI*2); ctx.fill();
      const lw = Math.max(1, Math.min(hR*.05, 4));
      for (let i=0;i<14;i++){
        const r2 = hR*(1.06 + i*.03) + i*lw*.6, a0 = t*(3.4 - i*.14) + i*1.7;
        ctx.globalAlpha = dk*(.6 - i*.035); ctx.strokeStyle = i%3 === 0 ? z.s1 : z.s2; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(hx, hy, r2, a0, a0 + 1.4 + (i%4)*.55); ctx.stroke();
      }
    }
    ctx.globalAlpha = .18*(1 - dk); ctx.strokeStyle = BONE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hx, hy, hR*1.8, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx, hy, hR, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = dk > .5 ? z.s1 : BONE; ctx.globalAlpha = .55 + .45*dk; ctx.lineWidth = 1.4 + holeFlare*6;
    ctx.shadowColor = z.s2; ctx.shadowBlur = dk*(16 + holeFlare*40);
    ctx.beginPath(); ctx.arc(hx, hy, hR*1.01, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  for (const p of ip){
    if (p.done) continue;
    const x = CX + Math.cos(p.a)*p.rr*SI, y = CY + Math.sin(p.a)*p.rr*SI;
    let jx = 0, jy = 0;
    if (p.earth && introT > T_EARTH && !reduceMotion){ const k = Math.min((introT - T_EARTH)/6, 1); jx = (Math.random() - .5)*2.5*k; jy = (Math.random() - .5)*2.5*k; }
    drawPlanet(p, x + jx, y + jy, Math.max(2, p.s*SI), p.ph);
    if (p.ph > 0 && p.ph < .85){
      ctx.globalAlpha = 1 - p.ph/.85; ctx.fillStyle = BONE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 12px Fredoka, system-ui, sans-serif';
      ctx.fillText(p.n, CX + Math.cos(p.a)*p.r*SI, CY + Math.sin(p.a)*p.r*SI - p.s*SI - 14);
      ctx.globalAlpha = 1;
    }
  }
  for (const q of iparts){
    ctx.globalAlpha = clamp(q.life, 0, 1); ctx.fillStyle = q.col;
    ctx.fillRect(CX + q.x*SI - q.s/2, CY + q.y*SI - q.s/2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
  const ty = Math.max(70, CY - 236*SI);
  caption('Nuestro sistema solar.', .4, 2.2, 16, ty);
  caption('Un agujero negro errante\nentró al sistema solar.', 2.3, 4.3, 15, ty);
  caption('Se tragó al Sol.', 4.4, 6.1, 16, ty);
  caption('Luego vino por los planetas.', 6.3, 8.0, 15, ty);
  caption('Solo queda la Tierra.', 12.2, 13.7, 16, ty);
  caption('Escapa.', 13.7, INTRO_END, 30, ty);
  if (state === 'intro'){
    ctx.globalAlpha = .45; ctx.fillStyle = BONE; ctx.font = '500 12px Fredoka, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('Toca para saltar la intro', CX, H - 34); ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (flash > 0){ ctx.globalAlpha = flash*.45; ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05); last = now;
  requestAnimationFrame(frame);
  try{
    if (state === 'intro' || state === 'pretitle'){ updateIntro(dt); renderIntro(); }
    else { update(dt); render(); }
  }catch(e){ try{ ctx.restore(); }catch(_){} console.error(e); }
}
requestAnimationFrame(frame);
})();
</script>
</body>
